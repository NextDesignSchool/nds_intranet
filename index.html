// ─── BOARD ────────────────────────────────────────
let _bPosts=[],_bActiveId=null,_bSearch='',_bTagFilter=null,_bCatFilter=null,_bCatOpen={};
let _bDragId=null,_slashId=null,_slashQ='',_slashSel=0;
let _bCategories=[];
// 게시판 데이터: 예전엔 localStorage에만 저장돼서 기기마다 따로 놀았음.
// 이제 Firestore(appdata/board 문서)에 저장해서 어느 기기에서 접속해도 같은 내용이 보이도록 함.
// 매 키 입력마다 Firestore에 쓰면 비용/속도 문제가 있어서, 입력이 잠시 멈춘 뒤(1.5초) 저장하는 방식(디바운스)을 씀.
let _boardSaveTimer=null;
function _bLoad(){ /* 게시판 데이터는 앱 시작 시 loadAppData()에서 한 번만 불러옴 */ }
function _bCatLoad(){ /* 위와 동일: 카테고리도 게시글과 함께 한 번에 불러옴 */ }
function _bSave(){
  if(_boardSaveTimer)clearTimeout(_boardSaveTimer);
  _boardSaveTimer=setTimeout(saveBoardData,1500);
}
function _bCatSave(){_bSave();}
async function saveBoardData(){
  try{
    const db=window._db;
    if(!db) throw new Error('Firebase 미준비');
    await db.collection('appdata').doc('board').set({posts:_bPosts,categories:_bCategories});
  }catch(e){
    try{localStorage.setItem('nds_board',JSON.stringify(_bPosts));localStorage.setItem('nds_board_cats',JSON.stringify(_bCategories));}catch{}
    console.warn('게시판 Firestore 저장 실패, localStorage 백업 사용:', e);
  }
}
async function loadBoardData(){
  try{
    const db=window._db;
    if(!db) throw new Error('Firebase 미준비');
    const snap=await db.collection('appdata').doc('board').get();
    if(snap.exists){
      const d=snap.data();
      _bPosts=d.posts||[];_bCategories=d.categories||[];
    } else {
      // Firestore에 없으면 예전 localStorage 데이터를 1회 마이그레이션
      try{_bPosts=JSON.parse(localStorage.getItem('nds_board')||'[]');}catch{_bPosts=[];}
      try{_bCategories=JSON.parse(localStorage.getItem('nds_board_cats')||'[]');}catch{_bCategories=[];}
      if(_bPosts.length||_bCategories.length)await saveBoardData();
    }
  }catch(e){
    try{_bPosts=JSON.parse(localStorage.getItem('nds_board')||'[]');}catch{_bPosts=[];}
    try{_bCategories=JSON.parse(localStorage.getItem('nds_board_cats')||'[]');}catch{_bCategories=[];}
    console.warn('게시판 Firestore 로드 실패, localStorage 사용:', e);
  }
}
function _bNewId(){return 'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function bAddCategory(){
  const name=prompt('카테고리 이름:');
  if(!name?.trim())return;
  _bCategories.push({id:_bNewId(),name:name.trim()});
  _bCatSave();bRenderSb();renderSidebar();
}
function bDeleteCategory(id,e){
  if(e){e.stopPropagation();}
  if(!confirm('카테고리를 삭제하시겠습니까?\n(포스트는 삭제되지 않습니다)'))return;
  _bCategories=_bCategories.filter(c=>c.id!==id);
  _bPosts.forEach(p=>{if(p.category===id)p.category=null;});
  _bCatSave();_bSave();bRenderSb();renderSidebar();
}
function bToggleCat(id){
  _bCatOpen[id]=!_bCatOpen[id];
  if(_bCatFilter===id&&!_bCatOpen[id])_bCatFilter=null;
  bRenderSb();
}
function bSetCat(id){_bCatFilter=_bCatFilter===id?null:id;bRenderSb();renderSidebar();}
function bSetPostCat(postId,catId){
  const p=_bPosts.find(x=>x.id===postId);if(!p)return;
  p.category=catId||null;p.updatedAt=today();_bSave();bRenderSb();
}

function renderBoard(){
  _bLoad();_bCatLoad();
  const p=document.getElementById('page-board');
  p.innerHTML=`<div class="board-wrap">
    <div class="board-sb">
      <div class="board-sb-hd">
        <span style="font-size:13px;font-weight:700;color:var(--tx)">게시판</span>
        <button class="btn btn-p btn-sm" onclick="bNewPost()">+ 새 글</button>
      </div>
      <div class="board-search-box"><input placeholder="검색..." oninput="bSetSearch(this.value)"></div>
      <div id="b-cats" class="bcat-section"></div>
      <div id="b-tags" class="board-tags-row"></div>
      <div id="b-list" class="board-list-wrap"></div>
    </div>
    <div class="board-editor-area" id="b-editor">
      <div style="color:var(--sub);font-size:14px;text-align:center;padding-top:80px">글을 선택하거나 새 글을 작성하세요.</div>
    </div>
  </div>`;
  bRenderSb();
  if(_bActiveId&&_bPosts.find(x=>x.id===_bActiveId))bOpenPost(_bActiveId);
}

function bPostLiHtml(p){
  return `<div class="board-li${_bActiveId===p.id?' active':''}" onclick="bOpenPost('${p.id}')">
    <div class="board-li-title">${p.icon?p.icon+' ':''}${p.title||'제목 없음'}</div>
    <div class="board-li-meta">${p.updatedAt||p.createdAt||''}${(p.tags||[]).length?' · '+p.tags.join(', '):''}</div>
  </div>`;
}
function bRenderSb(){
  const listEl=document.getElementById('b-list'),tagsEl=document.getElementById('b-tags'),catsEl=document.getElementById('b-cats');
  if(!listEl)return;
  // categories panel
  if(catsEl){
    let html=`<div class="bcat-all${!_bCatFilter?' on':''}" onclick="bSetCat(null)">전체</div>`;
    _bCategories.forEach(c=>{
      const open=!!_bCatOpen[c.id];
      const catPosts=_bPosts.filter(p=>p.category===c.id).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
      html+=`<div class="bcat-row${_bCatFilter===c.id?' on':''}" onclick="bToggleCat('${c.id}')">
        <span class="bcat-arrow">${open?'▾':'▸'}</span>
        <span class="bcat-name">${c.name}</span>
        ${isAdmin()?`<span class="bcat-del" onclick="bDeleteCategory('${c.id}',event)" title="삭제">×</span>`:''}
      </div>`;
      if(open){
        html+=`<div class="bcat-posts">${catPosts.length?catPosts.map(bPostLiHtml).join(''):'<div style="color:var(--sub);font-size:12px;padding:8px 14px">글 없음</div>'}</div>`;
      }
    });
    if(isAdmin())html+=`<div class="bcat-add" onclick="bAddCategory()">+ 카테고리 추가</div>`;
    catsEl.innerHTML=html;
  }
  // tags
  const allTags=[...new Set(_bPosts.flatMap(p=>p.tags||[]))];
  tagsEl.innerHTML=allTags.map(t=>`<span class="btag${_bTagFilter===t?' on':''}" onclick="bSetTag('${t.replace(/'/g,"\\'")}')">${t}</span>`).join('');
  tagsEl.style.display=allTags.length?'flex':'none';
  // flat post list (uncategorized or all when no filter)
  let posts=[..._bPosts].sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
  if(_bSearch)posts=posts.filter(p=>(p.title||'').includes(_bSearch)||(p.blocks||[]).some(b=>b.content&&b.content.includes(_bSearch)));
  if(_bTagFilter)posts=posts.filter(p=>(p.tags||[]).includes(_bTagFilter));
  if(_bCatFilter)posts=[];  // when cat filter active, posts shown in cat section above
  else if(!_bSearch&&!_bTagFilter)posts=posts.filter(p=>!p.category);
  listEl.innerHTML=posts.length?posts.map(bPostLiHtml).join(''):'';
  if(!_bCatFilter&&!_bSearch&&!_bTagFilter)listEl.style.borderTop=_bCategories.length?'':'none';
}

function bSetSearch(v){_bSearch=v;bRenderSb()}
function bSetTag(t){_bTagFilter=_bTagFilter===t?null:t;bRenderSb()}

let _bEditMode=false; // 게시판 글 보기/편집 모드. 글을 열 때마다 기본은 '보기'로 시작함
function bOpenPost(id){
  if(_bActiveId!==id)_bEditMode=false; // 다른 글로 넘어갈 때만 보기 모드로 리셋 (같은 글에서 토글할 땐 유지)
  _bActiveId=id;bRenderSb();
  const post=_bPosts.find(x=>x.id===id);if(!post)return;
  const el=document.getElementById('b-editor');if(!el)return;
  el.innerHTML=`<div style="max-width:700px;margin:0 auto">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <span style="font-size:38px;cursor:${_bEditMode?'pointer':'default'};line-height:1" ${_bEditMode?`onclick="bPickIcon('${id}')"`:''}>${post.icon||'📄'}</span>
      <input class="board-title-input" value="${(post.title||'').replace(/"/g,'&quot;')}" placeholder="제목 없음" oninput="bUpdateTitle('${id}',this.value)" ${_bEditMode?'':'readonly'}>
    </div>
    <div style="font-size:12px;color:var(--sub);margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span>${post.createdAt||''}</span>
      ${_bEditMode?`<select class="bcat-select" style="width:auto;padding:2px 6px;font-size:12px" onchange="bSetPostCat('${id}',this.value)">
        <option value="">카테고리 없음</option>
        ${_bCategories.map(c=>`<option value="${c.id}"${post.category===c.id?' selected':''}>${c.name}</option>`).join('')}
      </select>`:(_bCategories.find(c=>c.id===post.category)?`<span class="chip ch-gray">${esc(_bCategories.find(c=>c.id===post.category).name)}</span>`:'')}
      ${(post.tags||[]).map(t=>`<span class="btag on">${esc(t)}${_bEditMode?`<button onclick="bRemoveTag('${id}','${t.replace(/'/g,"\\'")}');event.stopPropagation()" style="background:none;border:none;cursor:pointer;color:#999;padding:0 0 0 2px;font-size:10px">×</button>`:''}</span>`).join('')}
      ${_bEditMode?`<button class="btn-g" style="font-size:11px" onclick="bAddTag('${id}')">+ 태그</button>`:''}
      <div style="margin-left:auto;display:flex;gap:6px">
        <button class="btn btn-o btn-sm" onclick="bToggleEditMode('${id}')">${_bEditMode?'수정 완료':'수정'}</button>
        ${_bEditMode?`<button class="btn btn-d btn-sm" onclick="bDeletePost('${id}')">글 삭제</button>`:''}
      </div>
    </div>
    <div id="b-blocks">${bRenderBlocks(post.blocks||[],id)}</div>
    ${_bEditMode?`<div style="padding:4px 0 32px 32px"><button class="btn-g" style="font-size:13px;color:var(--sub)" onclick="bAddBlock(null,'${id}','paragraph')">+ 블록 추가</button></div>`:''}
  </div>`;
  const tInput=el.querySelector('.board-title-input');
  if(_bEditMode&&tInput&&!post.title)setTimeout(()=>tInput.focus(),40);
}
function bToggleEditMode(postId){_bEditMode=!_bEditMode;bOpenPost(postId);}

function bRenderBlocks(blocks,postId){
  return (blocks||[]).map(blk=>bBlockHtml(blk,postId)).join('');
}

function bBlockHtml(blk,postId){
  const editing=_bEditMode;
  if(blk.type==='divider'){
    if(!editing)return `<div class="bk-wrap" data-id="${blk.id}"><div class="bk-divider"></div></div>`;
    return `<div class="bk-wrap" data-id="${blk.id}" draggable="true" ondragstart="bDragStart(event,'${blk.id}')" ondragover="bDragOver(event,'${blk.id}')" ondrop="bDrop(event,'${blk.id}','${postId}')">
      <div class="bk-actions"><span class="bk-handle">⠿</span><span class="bk-add-btn" onclick="bAddBlock('${blk.id}','${postId}','paragraph')">+</span></div>
      <div class="bk-divider"></div>
      <button class="btn-g" style="font-size:11px;align-self:center" onclick="bDelBlock('${blk.id}','${postId}')">×</button></div>`;
  }
  if(blk.type==='table'){
    if(!blk.tableData||!blk.tableData.length)blk.tableData=[['','',''],['','',''],['','','']];
    const rows=blk.tableData;
    const tRows=rows.map((row,ri)=>`<tr>${row.map((cell,ci)=>{
      const tag=ri===0?'th':'td';
      return editing
        ?`<${tag} contenteditable="true" onblur="bTblCell(event,'${blk.id}','${postId}',${ri},${ci})">${cell}</${tag}>`
        :`<${tag}>${cell}</${tag}>`;
    }).join('')}</tr>`).join('');
    if(!editing)return `<div class="bk-wrap" data-id="${blk.id}"><div style="overflow-x:auto;padding:2px 0"><table class="bk-table"><tbody>${tRows}</tbody></table></div></div>`;
    return `<div class="bk-wrap" data-id="${blk.id}" draggable="true" ondragstart="bDragStart(event,'${blk.id}')" ondragover="bDragOver(event,'${blk.id}')" ondrop="bDrop(event,'${blk.id}','${postId}')">
      <div class="bk-actions"><span class="bk-handle">⠿</span><span class="bk-add-btn" onclick="bAddBlock('${blk.id}','${postId}','paragraph')">+</span></div>
      <div style="overflow-x:auto;padding:2px 0">
        <table class="bk-table"><tbody>${tRows}</tbody></table>
        <div style="display:flex;gap:4px;margin-top:4px">
          <button class="btn-g" style="font-size:11px" onclick="bTblAddRow('${blk.id}','${postId}')">+ 행</button>
          <button class="btn-g" style="font-size:11px" onclick="bTblAddCol('${blk.id}','${postId}')">+ 열</button>
          <button class="btn-g" style="font-size:11px" onclick="bTblDelRow('${blk.id}','${postId}')">− 행</button>
          <button class="btn-g" style="font-size:11px" onclick="bTblDelCol('${blk.id}','${postId}')">− 열</button>
          <button class="btn-g" style="font-size:11px;margin-left:auto" onclick="bDelBlock('${blk.id}','${postId}')">×</button>
        </div>
      </div></div>`;
  }
  const ph={paragraph:'내용 입력... (/ 로 블록 변경)',heading1:'제목 1',heading2:'제목 2',heading3:'제목 3',bulletedList:'• 항목',numberedList:'1. 항목',toggle:'▶ 토글',quote:'인용구',code:'코드 입력'}[blk.type]||'';
  if(!editing){
    // 보기 모드: placeholder도, 빈 줄이면 그냥 빈 공백으로만 남고 안내 문구는 절대 안 보임
    return `<div class="bk-wrap" data-id="${blk.id}">
    <div class="bk-content" data-type="${blk.type}" contenteditable="false">${linkifyHtml(blk.content||'')}</div></div>`;
  }
  return `<div class="bk-wrap" data-id="${blk.id}" draggable="true" ondragstart="bDragStart(event,'${blk.id}')" ondragover="bDragOver(event,'${blk.id}')" ondrop="bDrop(event,'${blk.id}','${postId}')">
    <div class="bk-actions"><span class="bk-handle">⠿</span><span class="bk-add-btn" onclick="event.stopPropagation();bShowAddMenu('${blk.id}','${postId}')">+</span></div>
    <div class="bk-content" data-type="${blk.type}" data-ph="${ph}" contenteditable="true"
      oninput="bContentInput(event,'${blk.id}','${postId}')"
      onkeydown="bKeydown(event,'${blk.id}','${postId}')"
      onmouseup="bSelChange()">${blk.content||''}</div></div>`;
}

function bUpdateTitle(postId,val){
  const p=_bPosts.find(x=>x.id===postId);if(!p)return;
  p.title=val;p.updatedAt=today();_bSave();bRenderSb();
}

function bNewPost(){
  const post={id:_bNewId(),title:'',icon:'',tags:[],createdAt:today(),updatedAt:today(),
    blocks:[{id:_bNewId(),type:'paragraph',content:''}]};
  _bPosts.unshift(post);_bSave();_bActiveId=post.id;bRenderSb();bOpenPost(post.id);
}

function bDeletePost(id){
  if(!confirm('이 글을 삭제하시겠습니까?'))return;
  _bPosts=_bPosts.filter(x=>x.id!==id);
  if(_bActiveId===id)_bActiveId=null;
  _bSave();renderBoard();
}

function bContentInput(e,blkId,postId){
  const el=e.target;
  const p=_bPosts.find(x=>x.id===postId);if(!p)return;
  const blk=p.blocks.find(x=>x.id===blkId);if(!blk)return;
  const txt=_cleanEditText(el.innerText).trim();
  if(txt==='/'||(_slashId===blkId&&txt.startsWith('/'))){
    if(txt==='/'){_slashId=blkId;_slashQ='';_slashSel=0;bShowSlash(el,postId);}
    else if(_slashId===blkId){_slashQ=txt.slice(1).toLowerCase();bUpdateSlash();}
    return;
  }
  if(_slashId===blkId)bHideSlash();
  blk.content=el.innerHTML;p.updatedAt=today();_bSave();
}

function bKeydown(e,blkId,postId){
  if(_slashId===blkId){
    if(e.key==='ArrowDown'){e.preventDefault();bSlashNav(1);return}
    if(e.key==='ArrowUp'){e.preventDefault();bSlashNav(-1);return}
    if(e.key==='Enter'){e.preventDefault();bSlashPick(blkId,postId);return}
    if(e.key==='Escape'){bHideSlash();return}
  }
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    const el=e.target;
    const p=_bPosts.find(x=>x.id===postId);if(!p)return;
    const blk=p.blocks.find(x=>x.id===blkId);if(!blk)return;
    blk.content=el.innerHTML;
    bInsertAfter(blkId,postId,'paragraph');
    return;
  }
  if(e.key==='Backspace'){
    const el=e.target;
    if(!_cleanEditText(el.innerText).trim()){e.preventDefault();bDelBlock(blkId,postId);}
  }
  if((e.ctrlKey||e.metaKey)){
    if(e.key==='b'){e.preventDefault();document.execCommand('bold');}
    else if(e.key==='i'){e.preventDefault();document.execCommand('italic');}
    else if(e.key==='u'){e.preventDefault();document.execCommand('underline');}
  }
}

function bInsertAfter(blkId,postId,type){
  const p=_bPosts.find(x=>x.id===postId);if(!p)return;
  const idx=p.blocks.findIndex(x=>x.id===blkId);
  const nb={id:_bNewId(),type,content:''};
  p.blocks.splice(idx+1,0,nb);p.updatedAt=today();_bSave();
  const bEl=document.getElementById('b-blocks');
  if(bEl)bEl.innerHTML=bRenderBlocks(p.blocks,postId);
  setTimeout(()=>{const ne=document.querySelector(`[data-id="${nb.id}"] .bk-content`);if(ne)ne.focus();},20);
}

function bDelBlock(blkId,postId){
  const p=_bPosts.find(x=>x.id===postId);if(!p)return;
  if(p.blocks.length<=1)return;
  const idx=p.blocks.findIndex(x=>x.id===blkId);
  p.blocks.splice(idx,1);p.updatedAt=today();_bSave();
  const bEl=document.getElementById('b-blocks');
  if(bEl)bEl.innerHTML=bRenderBlocks(p.blocks,postId);
  const pi=Math.max(0,idx-1);
  setTimeout(()=>{const pe=document.querySelector(`[data-id="${p.blocks[pi]?.id}"] .bk-content`);if(pe){pe.focus();const r=document.createRange();r.selectNodeContents(pe);r.collapse(false);const s=window.getSelection();s.removeAllRanges();s.addRange(r);}},20);
}

function bAddBlock(afterId,postId,type){
  if(afterId)bInsertAfter(afterId,postId,type);
  else{const p=_bPosts.find(x=>x.id===postId);if(!p)return;const nb={id:_bNewId(),type,content:''};p.blocks.push(nb);p.updatedAt=today();_bSave();const bEl=document.getElementById('b-blocks');if(bEl)bEl.innerHTML=bRenderBlocks(p.blocks,postId);setTimeout(()=>{const ne=document.querySelector(`[data-id="${nb.id}"] .bk-content`);if(ne)ne.focus();},20);}
}

// Slash menu
const B_SLASH=[
  {type:'paragraph',icon:'T',label:'문단'},{type:'heading1',icon:'H1',label:'제목 1'},
  {type:'heading2',icon:'H2',label:'제목 2'},{type:'heading3',icon:'H3',label:'제목 3'},
  {type:'bulletedList',icon:'•',label:'글머리 기호'},{type:'numberedList',icon:'1.',label:'번호 목록'},
  {type:'quote',icon:'❝',label:'인용구'},{type:'code',icon:'</>',label:'코드 블록'},
  {type:'toggle',icon:'▶',label:'토글'},{type:'divider',icon:'—',label:'구분선'},
  {type:'table',icon:'⊞',label:'표'},
];

function bShowSlash(el,postId){
  let m=document.getElementById('slash-menu');
  if(!m){m=document.createElement('div');m.id='slash-menu';m.className='slash-menu';document.body.appendChild(m);}
  m._postId=postId;
  const rect=el.getBoundingClientRect();
  m.style.top=(rect.bottom+2)+'px';m.style.left=rect.left+'px';m.style.display='block';
  bUpdateSlash();
}
function bUpdateSlash(){
  const m=document.getElementById('slash-menu');if(!m)return;
  const q=_slashQ;
  const items=B_SLASH.filter(x=>!q||x.label.includes(q)||x.type.includes(q));
  _slashSel=0;
  m.innerHTML=items.map((x,i)=>`<div class="slash-item${i===0?' sel':''}" data-type="${x.type}">
    <span style="width:28px;font-size:12px;font-weight:700;color:var(--sub);text-align:center">${x.icon}</span>${x.label}</div>`).join('');
  m.querySelectorAll('.slash-item').forEach(it=>it.addEventListener('mousedown',e=>{e.preventDefault();const bid=_slashId;const pid=m._postId;if(bid)bChangeBlockType(bid,pid,it.dataset.type);bHideSlash();}));
}
function bSlashNav(d){
  const m=document.getElementById('slash-menu');if(!m)return;
  const items=m.querySelectorAll('.slash-item');
  items[_slashSel]?.classList.remove('sel');
  _slashSel=Math.max(0,Math.min(items.length-1,_slashSel+d));
  items[_slashSel]?.classList.add('sel');
  items[_slashSel]?.scrollIntoView({block:'nearest'});
}
function bSlashPick(blkId,postId){
  const m=document.getElementById('slash-menu');if(!m)return;
  const sel=m.querySelector('.slash-item.sel');
  if(sel)bChangeBlockType(blkId,postId,sel.dataset.type);
  bHideSlash();
}
function bTblCell(e,blkId,postId,r,c){
  const p=_bPosts.find(x=>x.id===postId);if(!p)return;
  const blk=p.blocks.find(x=>x.id===blkId);if(!blk||!blk.tableData)return;
  blk.tableData[r][c]=e.target.innerHTML;p.updatedAt=today();_bSave();
}
function bTblAddRow(blkId,postId){
  const p=_bPosts.find(x=>x.id===postId);if(!p)return;
  const blk=p.blocks.find(x=>x.id===blkId);if(!blk||!blk.tableData)return;
  const cols=blk.tableData[0]?.length||3;
  blk.tableData.push(Array(cols).fill(''));p.updatedAt=today();_bSave();
  const bEl=document.getElementById('b-blocks');if(bEl)bEl.innerHTML=bRenderBlocks(p.blocks,postId);
}
function bTblAddCol(blkId,postId){
  const p=_bPosts.find(x=>x.id===postId);if(!p)return;
  const blk=p.blocks.find(x=>x.id===blkId);if(!blk||!blk.tableData)return;
  blk.tableData.forEach(row=>row.push(''));p.updatedAt=today();_bSave();
  const bEl=document.getElementById('b-blocks');if(bEl)bEl.innerHTML=bRenderBlocks(p.blocks,postId);
}
function bTblDelRow(blkId,postId){
  const p=_bPosts.find(x=>x.id===postId);if(!p)return;
  const blk=p.blocks.find(x=>x.id===blkId);if(!blk||!blk.tableData||blk.tableData.length<=1)return;
  blk.tableData.pop();p.updatedAt=today();_bSave();
  const bEl=document.getElementById('b-blocks');if(bEl)bEl.innerHTML=bRenderBlocks(p.blocks,postId);
}
function bTblDelCol(blkId,postId){
  const p=_bPosts.find(x=>x.id===postId);if(!p)return;
  const blk=p.blocks.find(x=>x.id===blkId);if(!blk||!blk.tableData||blk.tableData[0]?.length<=1)return;
  blk.tableData.forEach(row=>row.pop());p.updatedAt=today();_bSave();
  const bEl=document.getElementById('b-blocks');if(bEl)bEl.innerHTML=bRenderBlocks(p.blocks,postId);
}
function bChangeBlockType(blkId,postId,type){
  const p=_bPosts.find(x=>x.id===postId);if(!p)return;
  const blk=p.blocks.find(x=>x.id===blkId);if(!blk)return;
  blk.type=type;blk.content='';
  if(type==='table'&&!blk.tableData)blk.tableData=[['','',''],['','',''],['','','']];
  p.updatedAt=today();_bSave();
  const bEl=document.getElementById('b-blocks');
  if(bEl)bEl.innerHTML=bRenderBlocks(p.blocks,postId);
  setTimeout(()=>{const ne=document.querySelector(`[data-id="${blkId}"] .bk-content`);if(ne)ne.focus();},20);
}
function bHideSlash(){_slashId=null;_slashQ='';const m=document.getElementById('slash-menu');if(m)m.style.display='none';}

// + Add menu (shows slash menu below clicked block)
function bShowAddMenu(blkId,postId){
  const el=document.querySelector(`[data-id="${blkId}"] .bk-content`);
  if(el){_slashId=blkId;_slashQ='';_slashSel=0;bShowSlash(el,postId);}
}

// Selection format toolbar
function bSelChange(){
  setTimeout(()=>{
    const sel=window.getSelection();
    if(!sel||sel.isCollapsed){bHideFmt();return}
    const range=sel.getRangeAt(0);
    const rect=range.getBoundingClientRect();
    if(!rect.width){bHideFmt();return}
    let tb=document.getElementById('fmt-toolbar');
    if(!tb){
      tb=document.createElement('div');tb.id='fmt-toolbar';tb.className='fmt-toolbar';
      [['B','볼드'],['I','이탤릭'],['U','밑줄'],['code','코드']].forEach(([cmd,lbl])=>{
        const btn=document.createElement('button');btn.className='fmt-btn';
        btn.textContent=lbl;btn.onmousedown=e=>{e.preventDefault();bApplyFmt(cmd);};
        tb.appendChild(btn);
      });
      document.body.appendChild(tb);
    }
    tb.style.top=(rect.top-44+window.scrollY)+'px';
    tb.style.left=(rect.left+rect.width/2-tb.offsetWidth/2||0)+window.scrollX+'px';
    tb.style.display='flex';
  },10);
}
function bHideFmt(){const t=document.getElementById('fmt-toolbar');if(t)t.style.display='none';}
function bApplyFmt(cmd){
  if(cmd==='B')document.execCommand('bold');
  else if(cmd==='I')document.execCommand('italic');
  else if(cmd==='U')document.execCommand('underline');
  else if(cmd==='code'){const txt=window.getSelection()?.toString();if(txt)document.execCommand('insertHTML',false,`<code style="background:var(--hover);padding:1px 5px;border-radius:3px;font-family:monospace;font-size:.88em">${txt}</code>`);}
  // save
  const bEl=document.activeElement?.closest('.bk-wrap');
  if(bEl){const bid=bEl.dataset.id;const p=_bPosts.find(x=>x.id===_bActiveId);if(p){const blk=p.blocks.find(x=>x.id===bid);if(blk){blk.content=bEl.querySelector('.bk-content')?.innerHTML||'';_bSave();}}}
}

// Drag & drop
function bDragStart(e,id){_bDragId=id;e.dataTransfer.effectAllowed='move';setTimeout(()=>e.target.style.opacity='.4',0);}
function bDragOver(e,id){e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('.bk-wrap').forEach(el=>el.style.borderTop='');if(id!==_bDragId){const el=document.querySelector(`[data-id="${id}"]`);if(el)el.style.borderTop='2px solid var(--ac)';}}
function bDrop(e,targetId,postId){
  e.preventDefault();
  document.querySelectorAll('.bk-wrap').forEach(el=>{el.style.opacity='';el.style.borderTop='';});
  if(!_bDragId||_bDragId===targetId)return;
  const p=_bPosts.find(x=>x.id===postId);if(!p)return;
  const si=p.blocks.findIndex(x=>x.id===_bDragId),ti=p.blocks.findIndex(x=>x.id===targetId);
  if(si<0||ti<0)return;
  const[blk]=p.blocks.splice(si,1);p.blocks.splice(ti,0,blk);
  p.updatedAt=today();_bSave();
  const bEl=document.getElementById('b-blocks');if(bEl)bEl.innerHTML=bRenderBlocks(p.blocks,postId);
  _bDragId=null;
}

// Tags, icon, cover
function bAddTag(postId){const t=prompt('태그 입력:');if(!t?.trim())return;const p=_bPosts.find(x=>x.id===postId);if(!p)return;if(!p.tags)p.tags=[];if(!p.tags.includes(t.trim()))p.tags.push(t.trim());_bSave();bOpenPost(postId);bRenderSb();}
function bRemoveTag(postId,tag){const p=_bPosts.find(x=>x.id===postId);if(!p)return;p.tags=(p.tags||[]).filter(t=>t!==tag);_bSave();bOpenPost(postId);bRenderSb();}
function bPickIcon(postId){const icons='📄📝📊💡🔗📌⭐🎨🔧📐💬📅🗂🏆🚀📋🎯📎🗒🔖';const i=prompt(`아이콘 (이모지):\n${icons}`)||'📄';const p=_bPosts.find(x=>x.id===postId);if(!p)return;p.icon=[...i.trim()][0]||'📄';_bSave();bOpenPost(postId);bRenderSb();}

document.addEventListener('click',e=>{
  // 슬래시 메뉴가 열려있는 블록이 아닌 다른 곳(다른 블록 포함)을 클릭하면 메뉴를 닫음.
  // (예전엔 "다른 블록 안"을 클릭해도 닫히지 않아서, 이후 Enter/방향키 입력이 엉뚱한 블록에 적용되는 원인이 됐음)
  if(_slashId){

let _pPosts=[],_pActiveId=null,_pSearch='',_pStatusFilter=null,_pDragId=null;
const PRJ_STATUSES=['진행중','완료','대기','보류'];
// 프로젝트 데이터도 게시판과 동일한 이유로 Firestore(appdata/projects 문서)로 전환.
let _projectSaveTimer=null;
function _pLoad(){ /* 앱 시작 시 loadAppData()에서 한 번만 불러옴 */ }
function _pSave(){
  if(_projectSaveTimer)clearTimeout(_projectSaveTimer);
  _projectSaveTimer=setTimeout(saveProjectData,1500);
}
async function saveProjectData(){
  try{
    const db=window._db;
    if(!db) throw new Error('Firebase 미준비');
    await db.collection('appdata').doc('projects').set({posts:_pPosts});
  }catch(e){
    try{localStorage.setItem('nds_projects',JSON.stringify(_pPosts));}catch{}
    console.warn('프로젝트 Firestore 저장 실패, localStorage 백업 사용:', e);
  }
}
async function loadProjectData(){
  try{
    const db=window._db;
    if(!db) throw new Error('Firebase 미준비');
    const snap=await db.collection('appdata').doc('projects').get();
    if(snap.exists){
      _pPosts=snap.data().posts||[];
    } else {
      try{_pPosts=JSON.parse(localStorage.getItem('nds_projects')||'[]');}catch{_pPosts=[];}
      if(_pPosts.length)await saveProjectData();
    }
  }catch(e){
    try{_pPosts=JSON.parse(localStorage.getItem('nds_projects')||'[]');}catch{_pPosts=[];}
    console.warn('프로젝트 Firestore 로드 실패, localStorage 사용:', e);
  }
}

let _pCalBase=null;
function pCalRenderAll(postId){
  const p=_pPosts.find(x=>x.id===postId);if(!p)return;
  if(!p.calEvents)p.calEvents=[];
  if(!_pCalBase){const n=new Date();_pCalBase=new Date(n.getFullYear(),n.getMonth(),1);}
  const label=document.getElementById('p-cal-label');
  if(label){
    const m2=new Date(_pCalBase.getFullYear(),_pCalBase.getMonth()+2,1);
    label.textContent=_pCalBase.getFullYear()===m2.getFullYear()
      ?`${_pCalBase.getFullYear()}년 ${_pCalBase.getMonth()+1}월 ~ ${m2.getMonth()+1}월`
      :`${_pCalBase.getFullYear()}년 ${_pCalBase.getMonth()+1}월 ~ ${m2.getFullYear()}년 ${m2.getMonth()+1}월`;
  }
  for(let i=0;i<3;i++){
    const mDate=new Date(_pCalBase.getFullYear(),_pCalBase.getMonth()+i,1);
    const el=document.getElementById(`p-cal-${i}`);
    if(!el)continue;
    const y=mDate.getFullYear(),mo=mDate.getMonth();
    let html=`<div style="font-size:11.5px;font-weight:700;margin-bottom:5px;color:var(--tx)">${mo+1}월</div>`;
    html+=buildMonthGridHtml(p.calEvents,mDate,
      ds=>`openAddProjectEvent('${postId}','${ds}')`,
      eid=>`openProjectEventDetail('${postId}',${eid})`,
      true);
    el.innerHTML=html;
  }
}
function pCalPrev(postId){_pCalBase=new Date(_pCalBase.getFullYear(),_pCalBase.getMonth()-1,1);pCalRenderAll(postId);}
function pCalNext(postId){_pCalBase=new Date(_pCalBase.getFullYear(),_pCalBase.getMonth()+1,1);pCalRenderAll(postId);}
function pCalToday(postId){const n=new Date();_pCalBase=new Date(n.getFullYear(),n.getMonth(),1);pCalRenderAll(postId);}

function saveProjectEvent(postId,id){

function pRenderBlocks(blocks,postId){
  return (blocks||[]).map(blk=>pBlockHtml(blk,postId)).join('');

function pBlockHtml(blk,postId){
  const editing=_pEditMode;
  if(blk.type==='divider'){
    if(!editing)return `<div class="bk-wrap" data-id="${blk.id}"><div class="bk-divider"></div></div>`;
    return `<div class="bk-wrap" data-id="${blk.id}" draggable="true" ondragstart="pDragStart(event,'${blk.id}')" ondragover="pDragOver(event,'${blk.id}')" ondrop="pDrop(event,'${blk.id}','${postId}')">
      <div class="bk-actions"><span class="bk-handle">⠿</span><span class="bk-add-btn" onclick="pAddBlock('${blk.id}','${postId}','paragraph')">+</span></div>
      <div class="bk-divider"></div>
      <button class="btn-g" style="font-size:11px;align-self:center" onclick="pDelBlock('${blk.id}','${postId}')">×</button></div>`;
  }
  if(blk.type==='image'){
    if(!editing){
      return `<div class="bk-wrap" data-id="${blk.id}"><div style="width:100%">
        ${blk.imageData?`<img src="${blk.imageData}" style="max-width:100%;border-radius:6px;display:block">`:''}
        ${blk.caption?`<div style="font-size:12px;color:var(--sub);margin-top:4px">${esc(blk.caption)}</div>`:''}
      </div></div>`;
    }
    return `<div class="bk-wrap" data-id="${blk.id}" draggable="true" ondragstart="pDragStart(event,'${blk.id}')" ondragover="pDragOver(event,'${blk.id}')" ondrop="pDrop(event,'${blk.id}','${postId}')">
      <div class="bk-actions"><span class="bk-handle">⠿</span><span class="bk-add-btn" onclick="pAddBlock('${blk.id}','${postId}','paragraph')">+</span></div>
      <div style="width:100%">
        ${blk.imageData?`<img src="${blk.imageData}" style="max-width:100%;border-radius:6px;display:block">`
          :`<label style="display:flex;align-items:center;justify-content:center;height:120px;border:2px dashed var(--bd);border-radius:8px;cursor:pointer;color:var(--sub);font-size:13px;gap:8px">
            📷 이미지 업로드<input type="file" style="display:none" accept="image/*" onchange="pImgUpload(event,'${blk.id}','${postId}')"></label>`}
        <div style="display:flex;gap:6px;align-items:center;margin-top:4px">
          ${blk.imageData?`<label class="btn-g" style="cursor:pointer;font-size:11px">변경<input type="file" style="display:none" accept="image/*" onchange="pImgUpload(event,'${blk.id}','${postId}')"></label>`:''}
          <input style="flex:1;border:none;border-bottom:1px solid var(--bd);font-size:12px;color:var(--sub);background:transparent;outline:none" placeholder="캡션 입력..." value="${(blk.caption||'').replace(/"/g,'&quot;')}" onblur="pSaveCaption(event,'${blk.id}','${postId}')">
          <button class="btn-g" style="font-size:11px" onclick="pDelBlock('${blk.id}','${postId}')">×</button>
        </div>
      </div></div>`;
  }
  if(blk.type==='table'){
    if(!blk.tableData||!blk.tableData.length)blk.tableData=[['','',''],['','',''],['','','']];
    const rows=blk.tableData;
    const tRows=rows.map((row,ri)=>`<tr>${row.map((cell,ci)=>{
      const tag=ri===0?'th':'td';
      return editing
        ?`<${tag} contenteditable="true" onblur="pTblCell(event,'${blk.id}','${postId}',${ri},${ci})">${cell}</${tag}>`
        :`<${tag}>${cell}</${tag}>`;
    }).join('')}</tr>`).join('');
    if(!editing)return `<div class="bk-wrap" data-id="${blk.id}"><div style="overflow-x:auto;padding:2px 0"><table class="bk-table"><tbody>${tRows}</tbody></table></div></div>`;
    return `<div class="bk-wrap" data-id="${blk.id}" draggable="true" ondragstart="pDragStart(event,'${blk.id}')" ondragover="pDragOver(event,'${blk.id}')" ondrop="pDrop(event,'${blk.id}','${postId}')">
      <div class="bk-actions"><span class="bk-handle">⠿</span><span class="bk-add-btn" onclick="pAddBlock('${blk.id}','${postId}','paragraph')">+</span></div>
      <div style="overflow-x:auto;padding:2px 0">
        <table class="bk-table"><tbody>${tRows}</tbody></table>
        <div style="display:flex;gap:4px;margin-top:4px">
          <button class="btn-g" style="font-size:11px" onclick="pTblAddRow('${blk.id}','${postId}')">+ 행</button>
          <button class="btn-g" style="font-size:11px" onclick="pTblAddCol('${blk.id}','${postId}')">+ 열</button>
          <button class="btn-g" style="font-size:11px" onclick="pTblDelRow('${blk.id}','${postId}')">− 행</button>
          <button class="btn-g" style="font-size:11px" onclick="pTblDelCol('${blk.id}','${postId}')">− 열</button>
          <button class="btn-g" style="font-size:11px;margin-left:auto" onclick="pDelBlock('${blk.id}','${postId}')">×</button>
        </div>
      </div></div>`;
  }
  const ph={paragraph:'내용 입력... (/ 로 블록 변경)',heading1:'제목 1',heading2:'제목 2',heading3:'제목 3',bulletedList:'• 항목',numberedList:'1. 항목',toggle:'▶ 토글',quote:'인용구',code:'코드 입력'}[blk.type]||'';
  if(!editing){
    return `<div class="bk-wrap" data-id="${blk.id}">
    <div class="bk-content" data-type="${blk.type}" contenteditable="false">${linkifyHtml(blk.content||'')}</div></div>`;
  }
  return `<div class="bk-wrap" data-id="${blk.id}" draggable="true" ondragstart="pDragStart(event,'${blk.id}')" ondragover="pDragOver(event,'${blk.id}')" ondrop="pDrop(event,'${blk.id}','${postId}')">
    <div class="bk-actions"><span class="bk-handle">⠿</span><span class="bk-add-btn" onclick="event.stopPropagation();pShowAddMenu('${blk.id}','${postId}')">+</span></div>
    <div class="bk-content" data-type="${blk.type}" data-ph="${ph}" contenteditable="true"
      oninput="pContentInput(event,'${blk.id}','${postId}')"
      onkeydown="pKeydown(event,'${blk.id}','${postId}')"
      onmouseup="bSelChange()">${blk.content||''}</div></div>`;
}

let _pSlashId=null,_pSlashQ='',_pSlashSel=0;

function pAddTag(postId){const t=prompt('태그 입력:');if(!t?.trim())return;const p=_pPosts.find(x=>x.id===postId);if(!p)return;if(!p.tags)p.tags=[];if(!p.tags.includes(t.trim()))p.tags.push(t.trim());_pSave();pOpenPost(postId);pRenderSb();}
function pRemoveTag(postId,tag){const p=_pPosts.find(x=>x.id===postId);if(!p)return;p.tags=(p.tags||[]).filter(t=>t!==tag);_pSave();pOpenPost(postId);pRenderSb();}
function pPickIcon(postId){const icons='🗃📁📂🚀🎯💡🔧📊📋🏆⭐🎨🔗📌📅💬🗂📐🔖';const i=prompt(`아이콘 (이모지):\n${icons}`)||'🗃';const p=_pPosts.find(x=>x.id===postId);if(!p)return;p.icon=[...i.trim()][0]||'🗃';_pSave();pOpenPost(postId);pRenderSb();}
function pImgUpload(e,blkId,postId){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{const p=_pPosts.find(x=>x.id===postId);if(!p)return;const blk=p.blocks.find(x=>x.id===blkId);if(!blk)return;blk.imageData=ev.target.result;p.updatedAt=today();_pSave();const bEl=document.getElementById('p-blocks');if(bEl)bEl.innerHTML=pRenderBlocks(p.blocks,postId);};r.readAsDataURL(file);}
function pSaveCaption(e,blkId,postId){const p=_pPosts.find(x=>x.id===postId);if(!p)return;const blk=p.blocks.find(x=>x.id===blkId);if(!blk)return;blk.caption=e.target.value;p.updatedAt=today();_pSave();}

function pTblCell(e,blkId,postId,r,c){
  const p=_pPosts.find(x=>x.id===postId);if(!p)return;
  const blk=p.blocks.find(x=>x.id===blkId);if(!blk||!blk.tableData)return;
  blk.tableData[r][c]=e.target.innerHTML;p.updatedAt=today();_pSave();
}
function pTblAddRow(blkId,postId){const p=_pPosts.find(x=>x.id===postId);if(!p)return;const blk=p.blocks.find(x=>x.id===blkId);if(!blk||!blk.tableData)return;const cols=blk.tableData[0]?.length||3;blk.tableData.push(Array(cols).fill(''));p.updatedAt=today();_pSave();const bEl=document.getElementById('p-blocks');if(bEl)bEl.innerHTML=pRenderBlocks(p.blocks,postId);}
function pTblAddCol(blkId,postId){const p=_pPosts.find(x=>x.id===postId);if(!p)return;const blk=p.blocks.find(x=>x.id===blkId);if(!blk||!blk.tableData)return;blk.tableData.forEach(row=>row.push(''));p.updatedAt=today();_pSave();const bEl=document.getElementById('p-blocks');if(bEl)bEl.innerHTML=pRenderBlocks(p.blocks,postId);}
function pTblDelRow(blkId,postId){const p=_pPosts.find(x=>x.id===postId);if(!p)return;const blk=p.blocks.find(x=>x.id===blkId);if(!blk||!blk.tableData||blk.tableData.length<=1)return;blk.tableData.pop();p.updatedAt=today();_pSave();const bEl=document.getElementById('p-blocks');if(bEl)bEl.innerHTML=pRenderBlocks(p.blocks,postId);}
function pTblDelCol(blkId,postId){const p=_pPosts.find(x=>x.id===postId);if(!p)return;const blk=p.blocks.find(x=>x.id===blkId);if(!blk||!blk.tableData||blk.tableData[0]?.length<=1)return;blk.tableData.forEach(row=>row.pop());p.updatedAt=today();_pSave();const bEl=document.getElementById('p-blocks');if(bEl)bEl.innerHTML=pRenderBlocks(p.blocks,postId);}

function pContentInput(e,blkId,postId){
  const el=e.target;
  const p=_pPosts.find(x=>x.id===postId);if(!p)return;
  const blk=p.blocks.find(x=>x.id===blkId);if(!blk)return;
  const txt=_cleanEditText(el.innerText).trim();
  if(txt==='/'||(_pSlashId===blkId&&txt.startsWith('/'))){
    if(txt==='/'){_pSlashId=blkId;_pSlashQ='';_pSlashSel=0;pShowSlash(el,postId);}
    else if(_pSlashId===blkId){_pSlashQ=txt.slice(1).toLowerCase();pUpdateSlash();}
    return;
  }
  if(_pSlashId===blkId)pHideSlash();
  blk.content=el.innerHTML;p.updatedAt=today();_pSave();
}
function pKeydown(e,blkId,postId){
  if(_pSlashId===blkId){
    if(e.key==='ArrowDown'){e.preventDefault();pSlashNav(1);return}
    if(e.key==='ArrowUp'){e.preventDefault();pSlashNav(-1);return}
    if(e.key==='Enter'){e.preventDefault();pSlashPick(blkId,postId);return}
    if(e.key==='Escape'){pHideSlash();return}
  }
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    const el=e.target;
    const p=_pPosts.find(x=>x.id===postId);if(!p)return;
    const blk=p.blocks.find(x=>x.id===blkId);if(!blk)return;
    blk.content=el.innerHTML;
    pInsertAfter(blkId,postId,'paragraph');return;
  }
  if(e.key==='Backspace'){
    const el=e.target;
    if(!_cleanEditText(el.innerText).trim()){e.preventDefault();pDelBlock(blkId,postId);}
  }
  if((e.ctrlKey||e.metaKey)){
    if(e.key==='b'){e.preventDefault();document.execCommand('bold');}
    else if(e.key==='i'){e.preventDefault();document.execCommand('italic');}
    else if(e.key==='u'){e.preventDefault();document.execCommand('underline');}
  }
}
function pInsertAfter(blkId,postId,type){
  const p=_pPosts.find(x=>x.id===postId);if(!p)return;
  const idx=p.blocks.findIndex(x=>x.id===blkId);
  const nb={id:_pNewId(),type,content:''};
  p.blocks.splice(idx+1,0,nb);p.updatedAt=today();_pSave();
  const bEl=document.getElementById('p-blocks');
  if(bEl)bEl.innerHTML=pRenderBlocks(p.blocks,postId);
  setTimeout(()=>{const ne=document.querySelector(`[data-id="${nb.id}"] .bk-content`);if(ne)ne.focus();},20);
}
function pDelBlock(blkId,postId){
  const p=_pPosts.find(x=>x.id===postId);if(!p)return;
  if(p.blocks.length<=1)return;
  const idx=p.blocks.findIndex(x=>x.id===blkId);
  p.blocks.splice(idx,1);p.updatedAt=today();_pSave();
  const bEl=document.getElementById('p-blocks');
  if(bEl)bEl.innerHTML=pRenderBlocks(p.blocks,postId);
  const pi=Math.max(0,idx-1);
  setTimeout(()=>{const pe=document.querySelector(`[data-id="${p.blocks[pi]?.id}"] .bk-content`);if(pe){pe.focus();const r=document.createRange();r.selectNodeContents(pe);r.collapse(false);const s=window.getSelection();s.removeAllRanges();s.addRange(r);}},20);
}
function pAddBlock(afterId,postId,type){
  if(afterId)pInsertAfter(afterId,postId,type);
  else{const p=_pPosts.find(x=>x.id===postId);if(!p)return;const nb={id:_pNewId(),type,content:''};p.blocks.push(nb);p.updatedAt=today();_pSave();const bEl=document.getElementById('p-blocks');if(bEl)bEl.innerHTML=pRenderBlocks(p.blocks,postId);setTimeout(()=>{const ne=document.querySelector(`[data-id="${nb.id}"] .bk-content`);if(ne)ne.focus();},20);}
}
function pChangeBlockType(blkId,postId,type){
  const p=_pPosts.find(x=>x.id===postId);if(!p)return;
  const blk=p.blocks.find(x=>x.id===blkId);if(!blk)return;
  blk.type=type;blk.content='';
  if(type==='table'&&!blk.tableData)blk.tableData=[['','',''],['','',''],['','','']];
  if(type==='image'){blk.imageData=null;blk.caption='';}
  p.updatedAt=today();_pSave();
  const bEl=document.getElementById('p-blocks');
  if(bEl)bEl.innerHTML=pRenderBlocks(p.blocks,postId);
  setTimeout(()=>{const ne=document.querySelector(`[data-id="${blkId}"] .bk-content`);if(ne)ne.focus();},20);
}
function pShowAddMenu(blkId,postId){
  const el=document.querySelector(`[data-id="${blkId}"] .bk-content`);
  if(el){_pSlashId=blkId;_pSlashQ='';_pSlashSel=0;pShowSlash(el,postId);}
}
function pShowSlash(el,postId){
  let m=document.getElementById('p-slash-menu');
  if(!m){m=document.createElement('div');m.id='p-slash-menu';m.className='slash-menu';document.body.appendChild(m);}
  m._postId=postId;
  const rect=el.getBoundingClientRect();
  m.style.top=(rect.bottom+2)+'px';m.style.left=rect.left+'px';m.style.display='block';
  pUpdateSlash();
}
function pUpdateSlash(){
  const m=document.getElementById('p-slash-menu');if(!m)return;
  const q=_pSlashQ;
  const items=P_SLASH.filter(x=>!q||x.label.includes(q)||x.type.includes(q));
  _pSlashSel=0;
  m.innerHTML=items.map((x,i)=>`<div class="slash-item${i===0?' sel':''}" data-type="${x.type}">
    <span style="width:28px;font-size:12px;font-weight:700;color:var(--sub);text-align:center">${x.icon}</span>${x.label}</div>`).join('');
  m.querySelectorAll('.slash-item').forEach(it=>it.addEventListener('mousedown',e=>{e.preventDefault();const bid=_pSlashId;const pid=m._postId;if(bid)pChangeBlockType(bid,pid,it.dataset.type);pHideSlash();}));
}
function pSlashNav(d){
  const m=document.getElementById('p-slash-menu');if(!m)return;
  const items=m.querySelectorAll('.slash-item');
  items[_pSlashSel]?.classList.remove('sel');
  _pSlashSel=Math.max(0,Math.min(items.length-1,_pSlashSel+d));
  items[_pSlashSel]?.classList.add('sel');
  items[_pSlashSel]?.scrollIntoView({block:'nearest'});
}
function pSlashPick(blkId,postId){
  const m=document.getElementById('p-slash-menu');if(!m)return;
  const sel=m.querySelector('.slash-item.sel');
  if(sel)pChangeBlockType(blkId,postId,sel.dataset.type);
  pHideSlash();
}
function pHideSlash(){_pSlashId=null;_pSlashQ='';const m=document.getElementById('p-slash-menu');if(m)m.style.display='none';}

let _pDragIdV=null;
function pDragStart(e,id){_pDragIdV=id;e.dataTransfer.effectAllowed='move';setTimeout(()=>e.target.style.opacity='.4',0);}
function pDragOver(e,id){e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('.bk-wrap').forEach(el=>el.style.borderTop='');if(id!==_pDragIdV){const el=document.querySelector(`[data-id="${id}"]`);if(el)el.style.borderTop='2px solid var(--ac)';}}
function pDrop(e,targetId,postId){
  e.preventDefault();
  document.querySelectorAll('.bk-wrap').forEach(el=>{el.style.borderTop='';el.style.opacity='1';});
  if(!_pDragIdV||_pDragIdV===targetId)return;
  const p=_pPosts.find(x=>x.id===postId);if(!p)return;
  const fi=p.blocks.findIndex(x=>x.id===_pDragIdV);
  const ti=p.blocks.findIndex(x=>x.id===targetId);
  if(fi<0||ti<0)return;
  const [moved]=p.blocks.splice(fi,1);
  p.blocks.splice(ti,0,moved);
  p.updatedAt=today();_pSave();
  const bEl=document.getElementById('p-blocks');if(bEl)bEl.innerHTML=pRenderBlocks(p.blocks,postId);
  _pDragIdV=null;
}

document.addEventListener('click',e=>{
  if(_pSlashId){
    const ownerEl=document.querySelector(`[data-id="${_pSlashId}"] .bk-content`);
    if(e.target!==ownerEl && !e.target.closest('#p-slash-menu')) pHideSlash();
  }
});

// ─── SETTLEMENT (정산 리스트) ──────────────────────
// 노션 표처럼 셀을 바로 클릭해서 편집하는 간단한 표. 텍스트 칸은 contenteditable
// div를 써서 내용이 길어지면 셀 폭은 고정된 채 자동으로 줄바꿈되도록 함(입력창은
// 원래 한 줄로만 표시되는 한계가 있어서 이 방식으로 바꿈). 입력할 때마다 전체를
// 다시 그리면 커서 위치가 튀므로, 텍스트 칸은 blur(포커스 아웃) 시점에만 저장함.
let _stTab='pending'; // 'pending'(정산 리스트) | 'done'(정산 완료)
function renderSettlement(){
  const p=document.getElementById('page-settlement');
  const list=S.settlements.filter(s=>_stTab==='pending'?!s.done:!!s.done);
  const cell=(s,field,ph)=>`<div class="st-cell" contenteditable="true" data-ph="${ph}" onblur="stSetField(${s.id},'${field}',this.innerText.trim())">${esc(s[field]||'')}</div>`;
  const rowHtml=s=>`<tr data-sid="${s.id}">
    <td style="text-align:center"><input type="checkbox" style="width:auto;accent-color:var(--ac)" ${s.done?'checked':''} onchange="stToggleDone(${s.id},this.checked)"></td>
    <td>${cell(s,'content','내용')}</td>
    <td>${cell(s,'name','이름')}</td>
    <td><input value="${esc(s.amount||'').replace(/"/g,'&quot;')}" placeholder="금액" inputmode="numeric" oninput="stFormatAmount(this)" onblur="stSetField(${s.id},'amount',this.value)" style="border:none;background:transparent;text-align:center;width:100%"></td>
    <td>${cell(s,'tax','예: 3.3%')}</td>
    <td>${cell(s,'account','계좌번호')}</td>
    <td>${cell(s,'note','비고')}</td>
    <td style="text-align:center"><button class="btn-g" onclick="stDeleteRow(${s.id})" title="행 삭제">×</button></td>
  </tr>`;
  const rows=list.map(rowHtml).join('');
  p.innerHTML=`<div class="tabs" style="margin-top:4px">
    <button class="tab-btn${_stTab==='pending'?' act':''}" onclick="stSwitchTab('pending')">정산 리스트</button>
    <button class="tab-btn${_stTab==='done'?' act':''}" onclick="stSwitchTab('done')">정산 완료</button>
  </div>
  <div class="card" style="padding:0;overflow-x:auto">
    <table class="st-table-fixed">
      <colgroup>
        <col style="width:56px"><col style="width:26%"><col style="width:8%"><col style="width:11%">
        <col style="width:11%"><col style="width:14%"><col style="width:18%"><col style="width:40px">
      </colgroup>
      <thead><tr><th style="text-align:center">정산</th><th style="text-align:center">내용</th><th style="text-align:center">이름</th><th style="text-align:center">금액</th><th style="text-align:center">세금 처리 방식</th><th style="text-align:center">계좌번호</th><th style="text-align:center">비고</th><th></th></tr></thead>
      <tbody>${rows||'<tr><td colspan="8" style="color:var(--sub);text-align:center;padding:24px">항목이 없습니다</td></tr>'}</tbody>
    </table>
    <div style="padding:8px 10px;border-top:1px solid var(--bd)"><button class="btn-g" onclick="stAddRow()">+ 내용 추가</button></div>
  </div>`;
}
// 금액 입력칸에 숫자만 남기고 천 단위마다 콤마를 자동으로 넣어줌
function stFormatAmount(el){
  const digits=el.value.replace(/[^\d]/g,'');
  const withComma=digits?Number(digits).toLocaleString('ko-KR'):'';
  el.value=withComma;
}
function stSwitchTab(tab){_stTab=tab;renderSettlement();}
function stAddRow(){
  S.settlements.push({id:newId(),content:'',name:'',amount:'',done:_stTab==='done',tax:'',account:'',note:''});
  renderSettlement();
  saveAppData().catch(()=>{});
}
function stSetField(id,field,value){
  const s=S.settlements.find(x=>x.id===id);if(!s)return;
  if(s[field]===value)return; // 변경 없으면 저장 스킵
  s[field]=value;
  saveAppData().catch(()=>{});
}
function stToggleDone(id,checked){
  const s=S.settlements.find(x=>x.id===id);if(!s)return;
  s.done=checked;
  renderSettlement(); // 체크하면 목록에서 사라지고 반대편 탭으로 이동해야 하므로 다시 그림
  saveAppData().catch(()=>{});
}
function stDeleteRow(id){
  if(!confirm('이 행을 삭제하시겠습니까?'))return;
  S.settlements=S.settlements.filter(x=>x.id!==id);
  renderSettlement();
  saveAppData().catch(()=>{});
}

// ─── DATA PERSISTENCE (Firestore) ──────────────────
const PERSIST_KEYS=['events','etypes','etypeColors','employees','interns','internSchedules','internSchedHistory','internTimetable','notices','workLogs','workIssues','navLabels','nid','settlements'];

// Firestore에 저장
async function saveAppData(){
  try{
    const db=window._db;
    if(!db) throw new Error('Firebase 미준비');
    const d={};
    PERSIST_KEYS.forEach(k=>{d[k]=S[k]});
    await db.collection('appdata').doc('main').set(d);
  }catch(e){
    try{
      const d={};PERSIST_KEYS.forEach(k=>{d[k]=S[k]});
      localStorage.setItem('nds_data',JSON.stringify(d));
    }catch{}
    console.warn('Firestore 저장 실패, localStorage 백업 사용:', e);
  }
}

// Firestore에서 불러오기
async function loadAppData(){
  try{
    const db=window._db;
    if(!db) throw new Error('Firebase 미준비');
    const snap = await db.collection('appdata').doc('main').get();
    if(snap.exists){
      const d = snap.data();
      PERSIST_KEYS.forEach(k=>{if(d[k]!==undefined)S[k]=d[k]});
      console.log('✅ Firestore에서 데이터 로드 완료');
    } else {
      // Firestore에 데이터 없으면 localStorage에서 마이그레이션
      const raw=localStorage.getItem('nds_data');
      if(raw){
        const d=JSON.parse(raw);
        PERSIST_KEYS.forEach(k=>{if(d[k]!==undefined)S[k]=d[k]});
        await saveAppData();
        console.log('✅ localStorage → Firestore 마이그레이션 완료');
      }
    }
  }catch(e){
    try{
      const raw=localStorage.getItem('nds_data');
      if(raw){
        const d=JSON.parse(raw);
        PERSIST_KEYS.forEach(k=>{if(d[k]!==undefined)S[k]=d[k]});
      }
    }catch{}
    console.warn('Firestore 로드 실패, localStorage 사용:', e);
  }
  // 게시판/프로젝트 데이터도 함께 로드 (예전엔 localStorage 전용이라 기기마다 따로 놀았던 부분)
  await loadBoardData();
  await loadProjectData();
  migrateSchedHistoryToWeekKey();
  // 예전 버전에서 자동으로 만들어졌던 빈 정산 행을 1회 정리
  if(Array.isArray(S.settlements)){
    S.settlements=S.settlements.filter(s=>s.content||s.name||s.amount||s.tax||s.account||s.note);
  }
}
// 구버전(fromWeek 상대 오프셋) 근무스케줄 데이터를 절대 날짜 기준(weekKey)으로 1회 영구 변환.
// 상대 오프셋은 시간이 지나면 가리키는 주가 달라져 데이터가 보이지 않게 되므로,
// 로드 시점을 기준으로 한 번 변환해 저장해두면 이후로는 항상 정확하게 유지된다.
function migrateSchedHistoryToWeekKey(){
  let changed=false;
  Object.keys(S.internSchedHistory||{}).forEach(name=>{
    const list=S.internSchedHistory[name];
    if(!Array.isArray(list))return;
    list.forEach(e=>{
      if(!e.weekKey&&e.fromWeek!==undefined){
        e.weekKey=legacyFromWeekToKey(e.fromWeek);
        delete e.fromWeek;
        changed=true;
      }
    });
    list.sort((a,b)=>(a.weekKey||'').localeCompare(b.weekKey||''));
  });
  if(changed)saveAppData().catch(()=>{});
}

// ─── SIDEBAR RESIZE ────────────────────────────────
(function initSbResize(){
  const handle=document.getElementById('sb-resizer');
  if(!handle)return;
  let startX,startW;
  handle.addEventListener('mousedown',e=>{
    startX=e.clientX;
    startW=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sw'))||220;
    handle.classList.add('dragging');
    document.body.style.userSelect='none';
    document.body.style.cursor='col-resize';
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
    e.preventDefault();
  });
  function onMove(e){
    const w=Math.min(380,Math.max(160,startW+(e.clientX-startX)));
    document.documentElement.style.setProperty('--sw',w+'px');
  }
  function onUp(){
    handle.classList.remove('dragging');
    document.body.style.userSelect='';
    document.body.style.cursor='';
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    localStorage.setItem('nds_sb_width',getComputedStyle(document.documentElement).getPropertyValue('--sw').trim());
  }
})();

// ─── INIT ──────────────────────────────────────────
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

async function _initApp(){
  // 로딩 표시
  document.getElementById('login-page').innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--sub);font-size:14px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="margin-bottom:12px;animation:spinLoader .8s linear infinite;color:var(--sub2)"><path d="M12 3a9 9 0 1 0 9 9"/></svg>
      데이터를 불러오는 중...
    </div>`;

  const savedSw=localStorage.getItem('nds_sb_width');
  if(savedSw)document.documentElement.style.setProperty('--sw',savedSw);

  // Firebase Auth 상태가 확정될 때까지 대기.
  // (브라우저에 이전 익명 로그인 세션이 남아있는 경우, 이 시점에 자동으로 복원됨)
  const authUser = await new Promise(resolve=>{
    const unsub=firebase.auth().onAuthStateChanged(u=>{unsub();resolve(u);});
  });

  let sessionUser=null;
  try{const u=sessionStorage.getItem('nds_user');if(u)sessionUser=JSON.parse(u);}catch{sessionStorage.removeItem('nds_user');}

  if(authUser && sessionUser){
    // 이미 인증되어 있고, 앱 로그인 세션(인턴의 경우 이름 선택까지 완료된 상태)도 남아있는 경우
    // → 데이터를 불러오고 바로 앱 시작
    await loadAppData();
    S.user=sessionUser;
    startApp();
    renderLoginForm();
  } else if(authUser && !sessionUser){
    // Firebase 인증은 남아있지만(공용 인턴 계정 등) 이름 선택 세션이 없는 경우
    // → 데이터를 불러오고 역할을 확인해 필요하면 이름 선택 화면부터 다시 보여줌
    await loadAppData();
    const profile = await fetchUserProfile(authUser.uid);
    if(profile && profile.role==='intern'){
      showInternNamePicker();
    } else if(profile){
      S.user = profile;
      sessionStorage.setItem('nds_user',JSON.stringify(S.user));
      startApp();
      renderLoginForm();
    } else {
      firebase.auth().signOut();
      renderLoginForm();
    }
  } else {
    // 인증 전 상태 → 로그인 화면만 표시. 실제 데이터는 doLogin() 성공 후 불러옴.
    sessionStorage.removeItem('nds_user');
    renderLoginForm();
  }

  // 자동 저장 (게시판/프로젝트는 디바운스 대기 중일 수 있으므로 함께 즉시 저장해 유실 방지)
  function saveEverything(){
    saveAppData();
    if(_boardSaveTimer){clearTimeout(_boardSaveTimer);_boardSaveTimer=null;}
    saveBoardData();
    if(_projectSaveTimer){clearTimeout(_projectSaveTimer);_projectSaveTimer=null;}
    saveProjectData();
  }
  window.addEventListener('beforeunload',saveEverything);
  setInterval(saveEverything,30000);

  // 화면 회전/리사이즈 시 근무스케줄 타임테이블 폭 재계산
  let _resizeTimer=null;
  window.addEventListener('resize',()=>{
    if(_resizeTimer)clearTimeout(_resizeTimer);
    _resizeTimer=setTimeout(()=>{
      if(S.page==='workschedule')renderWSTable();
      if(S.page==='interns'){
        const panel2=document.getElementById('intern-panel2');
        if(panel2&&panel2.style.display!=='none')panel2.innerHTML=buildInternGrid('work');
      }
    },200);
  });
}

// Firebase 준비 완료 후 앱 시작
function _startWhenReady(){
  if(window._db){
    _initApp();
  } else {
    // _db가 아직 없으면 최대 3초 대기
    let attempts = 0;
    const check = setInterval(()=>{
      attempts++;
      if(window._db){
        clearInterval(check);
        _initApp();
      } else if(attempts > 30){
        clearInterval(check);
        console.warn("Firebase 대기 초과, 앱 시작");
        _initApp();
      }
    }, 100);
  }
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', _startWhenReady);
} else {
  _startWhenReady();
}
</script>
