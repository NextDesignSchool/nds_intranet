<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NDS 인트라넷</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#F5F5F3;--card:#fff;--bd:#E8E8E4;--ac:#5046E4;--gr:#2E7D46;--or:#B45309;--re:#D94444;--tx:#1a1a1a;--sub:#aaa;--sw:224px}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,textarea,select{font-family:inherit;outline:none;border:1px solid var(--bd);border-radius:6px;padding:8px 10px;width:100%;font-size:14px;color:var(--tx);background:#fff}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
#login-page{display:flex;align-items:center;justify-content:center;min-height:100vh}
.lbox{background:var(--card);padding:40px;border-radius:12px;width:360px;box-shadow:0 8px 40px rgba(0,0,0,.1)}
.lbox h1{font-size:22px;font-weight:700;margin-bottom:6px}
.lbox p{color:var(--sub);font-size:14px;margin-bottom:28px}
.lbox .lf{margin-bottom:16px}
.lbox label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.lbtn{width:100%;padding:12px;background:var(--ac);color:#fff;border-radius:8px;font-size:15px;font-weight:600;margin-top:8px}
.lerr{color:var(--re);font-size:13px;margin-top:10px;display:none}
#app{display:none;min-height:100vh}
#sb{position:fixed;top:0;left:0;width:var(--sw);height:100vh;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;z-index:100;overflow:hidden}
.sb-logo{padding:20px;border-bottom:1px solid var(--bd);flex-shrink:0}
.sb-logo span{font-size:13.5px;font-weight:800;color:var(--tx);line-height:1.4}
.sb-nav{flex:1;overflow-y:auto;padding:10px 0}
.nav-sec-title{font-size:11px;font-weight:600;color:var(--sub);padding:10px 18px 4px;letter-spacing:.5px}
.nv{display:flex;align-items:center;gap:8px;padding:9px 18px;font-size:14px;cursor:pointer;transition:background .12s;border-radius:0}
.nv:hover{background:#f0f0ee}
.nv.active{background:#ede9ff;color:var(--ac);font-weight:600}
.nv svg{width:15px;height:15px;flex-shrink:0;opacity:.6}
.nv.active svg{opacity:1}
.sb-foot{padding:14px 16px;border-top:1px solid var(--bd);flex-shrink:0}
.uinfo .uname{font-size:14px;font-weight:600}
.uinfo .urole{font-size:12px;color:var(--sub);margin-top:2px}
.lout-btn{width:100%;margin-top:10px;padding:8px;background:#f5f5f3;border:1px solid var(--bd);border-radius:7px;font-size:13px;color:var(--tx)}
.lout-btn:hover{background:#fde8e8;color:var(--re);border-color:var(--re)}
#main{margin-left:var(--sw);min-height:100vh;display:flex;flex-direction:column}
#topbar{background:var(--card);border-bottom:1px solid var(--bd);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
#topbar h2{font-size:17px;font-weight:700}
#topbar .tdate{font-size:13px;color:var(--sub)}
#content{padding:24px 28px;flex:1}
.page{display:none}
.page.active{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:20px}
.ctitle{font-size:14px;font-weight:700;margin-bottom:14px}
.btn{padding:7px 14px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .12s;display:inline-flex;align-items:center;gap:5px}
.btn-p{background:var(--ac);color:#fff}
.btn-p:hover{opacity:.88}
.btn-o{background:#fff;border-color:var(--bd);color:var(--tx)}
.btn-o:hover{border-color:var(--ac);color:var(--ac)}
.btn-d{background:var(--re);color:#fff}
.btn-d:hover{opacity:.88}
.btn-sm{padding:4px 9px;font-size:12px;border-radius:5px}
.btn-g{background:transparent;border:none;color:var(--sub);padding:4px 8px;font-size:12px}
.btn-g:hover{color:var(--tx)}
.chip{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.ch-p{background:#ede9ff;color:var(--ac)}
.ch-g{background:#e6f4ec;color:var(--gr)}
.ch-o{background:#fef3e2;color:var(--or)}
.ch-r{background:#fde8e8;color:var(--re)}
.ch-gray{background:#f0f0ee;color:#666}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 12px;text-align:left;font-size:13px;border-bottom:1px solid var(--bd)}
th{font-weight:600;color:#555;background:#fafaf8;white-space:nowrap}
td{background:#fff}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafaf8}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.mo-box{background:#fff;border-radius:12px;width:100%;max-width:520px;box-shadow:0 8px 40px rgba(0,0,0,.14);max-height:92vh;overflow-y:auto}
.mo-box.lg{max-width:720px}
.mo-box.sm{max-width:380px}
.mo-box.xl{max-width:860px}
.mo-hd{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1;padding-bottom:14px;border-bottom:1px solid var(--bd)}
.mo-hd h3{font-size:16px;font-weight:700}
.mo-cl{background:none;border:none;font-size:22px;color:var(--sub);cursor:pointer;line-height:1;padding:2px 6px}
.mo-bd{padding:20px 24px}
.mo-ft{padding:0 24px 20px;display:flex;gap:8px;justify-content:flex-end}
.fr{margin-bottom:14px}
.fr label{display:block;font-size:13px;font-weight:500;margin-bottom:5px;color:#444}
.fr-row{display:flex;gap:12px}
.fr-row>*{flex:1}
.cal-hd{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.cal-hd h3{font-size:14px;font-weight:700;flex:1;text-align:left}
.cal-nav{background:none;border:1px solid var(--bd);border-radius:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px}
.cal-nav:hover{background:#f0f0ee}
.cal-grid-outer{border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.cal-header-row{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--bd);background:#fafaf8}
.cal-dn{padding:5px;text-align:center;font-size:12px;font-weight:600;color:var(--sub)}
.cal-week{border-bottom:1px solid var(--bd)}
.cal-week:last-child{border-bottom:none}
.cal-cells{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:46px}
.cal-cell{background:var(--card);overflow:hidden;padding:4px;cursor:pointer;position:relative;border-right:1px solid var(--bd)}
.cal-evlayer{position:relative;height:88px;overflow:hidden;background-color:var(--card);background-image:linear-gradient(to bottom,#E8E8E4,#E8E8E4),linear-gradient(to bottom,#E8E8E4,#E8E8E4),linear-gradient(to bottom,#E8E8E4,#E8E8E4),linear-gradient(to bottom,#E8E8E4,#E8E8E4),linear-gradient(to bottom,#E8E8E4,#E8E8E4),linear-gradient(to bottom,#E8E8E4,#E8E8E4);background-size:1px 100%;background-position:calc(100%/7) 0,calc(100%/7*2) 0,calc(100%/7*3) 0,calc(100%/7*4) 0,calc(100%/7*5) 0,calc(100%/7*6) 0;background-repeat:no-repeat}
.cal-cells .cal-cell:last-child{border-right:none}
.cal-cell:hover{background:#f7f7ff}
.cal-cell.om{background:#f9f9f7;opacity:.6}
.cal-cell.td{background:#f0eeff}
.board-wrap{display:flex;height:calc(100vh - 112px);background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.board-sb{width:250px;border-right:1px solid var(--bd);display:flex;flex-direction:column;background:#fafaf8;flex-shrink:0}
.board-sb-hd{padding:12px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.board-list-wrap{flex:1;overflow-y:auto;padding:4px 0}
.board-li{padding:9px 14px;cursor:pointer;transition:background .1s;border-radius:0}
.board-li:hover{background:#eeede9}
.board-li.active{background:#ede9ff}
.board-li-title{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)}
.board-li.active .board-li-title{color:var(--ac)}
.board-li-meta{font-size:11px;color:var(--sub);margin-top:2px}
.board-editor-area{flex:1;overflow-y:auto;padding:36px 52px}
.board-title-input{font-size:28px;font-weight:700;border:none;outline:none;width:100%;color:var(--tx);background:transparent;padding:4px 0;font-family:inherit}
.board-title-input::placeholder{color:var(--sub)}
.bk-wrap{position:relative;display:flex;align-items:flex-start;gap:0;margin:1px 0;padding-left:32px}
.bk-wrap:hover .bk-actions{opacity:1}
.bk-actions{position:absolute;left:0;top:3px;display:flex;gap:1px;opacity:0;transition:opacity .12s;z-index:10}
.bk-handle{width:15px;font-size:11px;color:var(--sub);cursor:grab;padding:2px 1px;user-select:none;display:flex;align-items:center;justify-content:center}
.bk-add-btn{width:15px;font-size:14px;color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.bk-add-btn:hover{color:var(--ac)}
.bk-content{flex:1;outline:none;min-height:1.5em;padding:2px 4px;border-radius:4px;line-height:1.65;font-size:15px;word-break:break-word;color:var(--tx)}
.bk-content:empty::before{content:attr(data-ph);color:#bbb;pointer-events:none}
.bk-content[data-type=heading1]{font-size:26px;font-weight:700;line-height:1.3}
.bk-content[data-type=heading2]{font-size:22px;font-weight:700;line-height:1.3}
.bk-content[data-type=heading3]{font-size:18px;font-weight:600;line-height:1.3}
.bk-content[data-type=quote]{border-left:3px solid var(--bd);padding-left:12px;color:#666;font-style:italic}
.bk-content[data-type=code]{font-family:monospace;background:#f4f4f2;padding:10px 14px;border-radius:6px;font-size:13px;white-space:pre-wrap}
.bk-divider{flex:1;height:1px;background:var(--bd);margin:10px 0;align-self:center}
.slash-menu{position:fixed;background:#fff;border:1px solid var(--bd);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.12);z-index:3000;min-width:200px;max-height:280px;overflow-y:auto;display:none}
.slash-item{padding:7px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px}
.slash-item:hover,.slash-item.sel{background:#f0f0ee}
.fmt-toolbar{position:fixed;background:#222;border-radius:7px;padding:4px 6px;display:none;gap:2px;z-index:3001;box-shadow:0 4px 14px rgba(0,0,0,.22);align-items:center}
.fmt-btn{background:none;border:none;color:#fff;padding:3px 8px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:700}
.fmt-btn:hover{background:rgba(255,255,255,.18)}
.board-search-box{padding:8px 12px;border-bottom:1px solid var(--bd)}
.board-search-box input{background:#eeecea;border:none;border-radius:6px;font-size:12px;padding:5px 9px;width:100%;outline:none}
.board-tags-row{padding:6px 12px;display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--bd)}
.btag{padding:2px 8px;border-radius:10px;font-size:11px;background:#eeecea;color:#666;cursor:pointer;border:1px solid transparent}
.btag.on{background:#ede9ff;color:var(--ac);border-color:var(--ac)}
.bk-table{width:100%;border-collapse:collapse;font-size:14px;margin:2px 0}
.bk-table td,.bk-table th{border:1px solid var(--bd);padding:6px 10px;min-width:64px;vertical-align:top;outline:none}
.bk-table th{background:#fafaf8;font-weight:600}
.bk-table td:focus{background:#f0eeff}
.prj-status{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;display:inline-block}
.ps-진행중{background:#e6f4ec;color:#2E7D46}.ps-완료{background:#ede9ff;color:var(--ac)}
.ps-대기{background:#fef3e2;color:#B45309}.ps-보류{background:#fde8e8;color:#D94444}
.dnum{font-size:13px;font-weight:600;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:2px}
.cal-cell.td .dnum{background:var(--ac);color:#fff}
.cal-cell.sun .dnum{color:var(--re)}
.cal-cell.sat .dnum{color:#4466bb}
.cal-ev{font-size:12px;font-weight:600;padding:1px 4px;border-radius:3px;margin-bottom:1px;overflow:hidden;word-break:break-word;white-space:normal;cursor:pointer}
.ev-행사{background:#ede9ff;color:var(--ac)}
.ev-미팅{background:#e6f4ec;color:var(--gr)}
.ev-외근{background:#fef3e2;color:var(--or)}
.ev-휴가{background:#fde8e8;color:var(--re)}
.ev-공휴일{background:#fde8e8;color:var(--re)}
.dash-grid{display:grid;grid-template-columns:1fr 320px;gap:20px}
.right-col{display:flex;flex-direction:column;gap:16px}
.board-item{padding:12px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.board-item:last-child{border-bottom:none}
.board-item:hover .bi-title{color:var(--ac)}
.bi-title{font-size:14px;font-weight:600;margin-bottom:3px}
.bi-meta{font-size:12px;color:var(--sub)}
.emp-grid,.intern-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.st-table{width:100%;border-collapse:collapse;table-layout:fixed}
.st-table th,.st-table td{border:1px solid var(--bd);padding:0;text-align:center}
.st-table th{background:#fafaf8;font-size:12px;font-weight:600;padding:6px 4px;overflow:hidden}
.st-table tr:last-child td{border-bottom:1px solid var(--bd)}
.stime{font-size:11px;color:var(--sub);background:#fafaf8;padding:0 4px;min-width:48px;height:48px;text-align:center;vertical-align:middle}
.sslot{height:48px;position:relative;cursor:pointer;vertical-align:middle}
.sslot:hover{background:#f7f7ff}
.ichip{display:inline-flex;align-items:center;justify-content:center;padding:3px 10px;border-radius:5px;font-size:13px;font-weight:600;margin:2px;cursor:pointer;white-space:nowrap}
.tabs{display:flex;border-bottom:2px solid var(--bd);margin-bottom:16px}
.tab-btn{padding:8px 14px;font-size:13px;font-weight:500;background:none;border:none;cursor:pointer;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-2px}
.tab-btn.act{color:var(--ac);border-bottom-color:var(--ac);font-weight:600}
.cmt{padding:10px 0;border-bottom:1px solid var(--bd)}
.cmt:last-child{border-bottom:none}
.cmt-meta{font-size:11px;color:var(--sub);margin-bottom:3px}
.cmt-text{font-size:13px}
.cmt-form{display:flex;gap:8px;margin-top:14px}
.cmt-form input{flex:1}
.drop-zone{border:2px dashed var(--bd);border-radius:8px;padding:28px;text-align:center;color:var(--sub);font-size:13px;cursor:pointer}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--ac);color:var(--ac)}
.tg-table{width:100%;border-collapse:collapse}
.tg-table th,.tg-table td{border:1px solid var(--bd);text-align:center;font-size:12px;padding:0}
.tg-table th{background:#fafaf8;padding:5px;font-weight:600}
.tg-cell{height:30px;cursor:pointer}
.tg-cell:hover{background:#f0eeff}
.tg-cell.sel{background:#ede9ff;color:var(--ac);font-weight:600}
#menu-toggle{display:none;position:fixed;top:12px;left:12px;z-index:200;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:16px}
.pg-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.pg-hd h3{font-size:16px;font-weight:700}
.leave-bar{display:flex;gap:16px;margin-bottom:8px}
.leave-item{text-align:center;flex:1;padding:10px;background:#fafaf8;border-radius:8px;border:1px solid var(--bd)}
.leave-item .lval{font-size:20px;font-weight:700;color:var(--ac)}
.leave-item .llabel{font-size:11px;color:var(--sub);margin-top:2px}
@media(max-width:900px){.dash-grid{grid-template-columns:1fr}.right-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}}
@media(max-width:768px){#menu-toggle{display:block}#sb{transform:translateX(-100%);transition:transform .25s}#sb.open{transform:translateX(0)}#main{margin-left:0}#topbar{padding-left:52px}#content{padding:16px}.emp-grid,.intern-grid{grid-template-columns:1fr}}
@media(max-width:600px){.right-col{display:flex;flex-direction:column}}
</style>
</head>
<body>

<div id="login-page">
<div class="lbox">
  <h1>NDS 인트라넷</h1>
  <p>비밀번호를 입력해 로그인하세요</p>
  <div class="lf"><label>비밀번호</label><input type="password" id="pw-input" placeholder="비밀번호 입력"></div>
  <button class="lbtn" onclick="doLogin()">로그인</button>
  <div class="lerr" id="lerr">비밀번호가 올바르지 않습니다.</div>
</div>
</div>

<div id="app">
  <button id="menu-toggle" onclick="toggleSidebar()">☰</button>
  <aside id="sb">
    <div class="sb-logo"><span style="cursor:pointer" onclick="navigate('home')">Next Design School</span></div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-foot">
      <div class="uinfo">
        <div class="uname" id="u-name"></div>
        <div class="urole" id="u-role"></div>
      </div>
      <button class="lout-btn" onclick="doLogout()">로그아웃</button>
    </div>
  </aside>
  <div id="main">
    <div id="topbar">
      <h2 id="pg-title">홈 대시보드</h2>
      <span class="tdate" id="top-date"></span>
    </div>
    <div id="content">
      <div class="page" id="page-home"></div>
      <div class="page" id="page-schedule"></div>
      <div class="page" id="page-employees"></div>
      <div class="page" id="page-board"></div>
      <div class="page" id="page-projects"></div>
      <div class="page" id="page-interns"></div>
      <div class="page" id="page-workschedule"></div>
      <div class="page" id="page-notice"></div>
      <div class="page" id="page-worklog"></div>
    </div>
  </div>
</div>

<div class="mo" id="modal" style="display:none" onclick="modalBgClick(event)">
  <div class="mo-box" id="modal-box"></div>
</div>

// ─── HOLIDAY API ──────────────────────────────────
const HOL_KEY='fbcc88a6bd5c51ff9615e71d4c178d55789d6b464ca8ef1c92a181075c7437a8';
const HOL_BASE='https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getRestDeInfo';
const HOL_PROXY='https://cors-anywhere.herokuapp.com/'+HOL_BASE;

async function fetchHolidays(y,m){
  const ym=`${y}-${p2(m)}`;
  if(S.holidayCache[ym]!==undefined)return;
  S.holidayCache[ym]=null;
  const params=`serviceKey=${HOL_KEY}&solYear=${y}&solMonth=${p2(m)}&numOfRows=50&_type=json`;
  const tryFetch=async(base)=>{
    const r=await fetch(`${base}?${params}`,{signal:AbortSignal.timeout(8000)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  };
  const parse=(data)=>{
    const raw=data?.response?.body?.items?.item;
    if(!raw)return{};
    const arr=Array.isArray(raw)?raw:[raw];
    const out={};
    arr.forEach(item=>{
      if(item.isHoliday==='Y'){
        const ds=String(item.locdate);
        out[`${ds.slice(0,4)}-${ds.slice(4,6)}-${ds.slice(6,8)}`]=item.dateName;
      }
    });
    return out;
  };
  try{
    const data=await tryFetch(HOL_BASE);
    S.holidayCache[ym]=parse(data);
    S.holidayFallback=false;
  }catch(e1){
    try{
      const data=await tryFetch(HOL_PROXY);
      S.holidayCache[ym]=parse(data);
      S.holidayFallback=false;
    }catch(e2){
      const fb={};
      Object.entries(HOLIDAYS_FALLBACK).forEach(([k,v])=>{if(k.startsWith(ym))fb[k]=v});
      S.holidayCache[ym]=fb;
      S.holidayFallback=true;
    }
  }
  if(S.cal.getFullYear()===y&&S.cal.getMonth()+1===m){
    if(S.page==='home')renderHome();
    else if(S.page==='schedule')renderSchedulePage();
  }
}

function getHolidayForDay(dateStr){
  const ym=dateStr.slice(0,7);
  const cache=S.holidayCache[ym];
  if(cache==null)return HOLIDAYS_FALLBACK[dateStr]||null;
  return cache[dateStr]||null;
}

// ─── CALENDAR UTILS ───────────────────────────────
function getDaysInMonth(y,m){return new Date(y,m+1,0).getDate()}
function getEventsForDay(dateStr){
  return S.events.filter(e=>e.start<=dateStr&&e.end>=dateStr);
}
function renderCalendar(container,month,onAddEvent){
  const y=month.getFullYear(),m=month.getMonth();
  const ym=`${y}-${p2(m+1)}`;
  const loading=S.holidayCache[ym]===null;
  const isLoaded=S.holidayCache[ym]!==undefined&&S.holidayCache[ym]!==null;
  if(!isLoaded&&!loading)fetchHolidays(y,m+1);
  const first=new Date(y,m,1).getDay();
  const days=getDaysInMonth(y,m);
  const todayStr=today();
  const prevDays=getDaysInMonth(y,m-1);
  const loadingBadge=loading?`<span style="font-size:11px;color:var(--sub);margin-left:6px">공휴일 로딩중…</span>`:
    (S.holidayFallback&&isLoaded?`<span style="font-size:11px;color:var(--or);margin-left:6px" title="API 연결 실패, 기본 데이터 사용">⚠ 오프라인</span>`:'');
  let html=`<div class="cal-hd">
    <h3 style="display:flex;align-items:center">${y}년 ${m+1}월${loadingBadge}</h3>
    ${onAddEvent?`<button class="btn btn-p btn-sm" onclick="${onAddEvent}">+ 일정추가</button>`:''}
    <button class="cal-nav" onclick="calPrev('${container}')">‹</button>
    <button class="cal-nav" style="padding:0 8px;width:auto;font-size:12px" onclick="calToday('${container}')">오늘</button>
    <button class="cal-nav" onclick="calNext('${container}')">›</button>
  </div>`;
  // Build flat day array (padded with prev/next month cells)
  const allDays=[];
  for(let i=first;i>0;i--){const d=prevDays-i+1;const pm=m===0?11:m-1,py=m===0?y-1:y;allDays.push({ds:`${py}-${p2(pm+1)}-${p2(d)}`,d,pad:true});}
  for(let d=1;d<=days;d++)allDays.push({ds:`${y}-${p2(m+1)}-${p2(d)}`,d,pad:false});
  const rem=(7-allDays.length%7)%7;
  for(let i=1;i<=rem;i++){const nm=m===11?0:m+1,ny=m===11?y+1:y;allDays.push({ds:`${ny}-${p2(nm+1)}-${p2(i)}`,d:i,pad:true});}
  const weeks=[];for(let i=0;i<allDays.length;i+=7)weeks.push(allDays.slice(i,i+7));
  const multiEvs=S.events.filter(e=>e.start!==e.end);
  html+=`<div class="cal-grid-outer">`;
  html+=`<div class="cal-header-row">`;
  ['일','월','화','수','목','금','토'].forEach(d=>html+=`<div class="cal-dn">${d}</div>`);
  html+=`</div>`;
  weeks.forEach((week,wi)=>{
    html+=`<div class="cal-week${wi===weeks.length-1?' cal-week-last':''}">`;
    const wS=week[0].ds,wE=week[6].ds;
    // Date numbers row only
    html+=`<div class="cal-cells">`;
    week.forEach((day,di)=>{
      const{ds,d,pad}=day;
      const hol=getHolidayForDay(ds);
      const isRed=!pad&&(hol||di===0);
      const isSat=!pad&&di===6;
      let cls=pad?' om':'';
      if(ds===todayStr)cls+=' td';
      if(di===0)cls+=' sun';
      if(di===6)cls+=' sat';
      const dnStyle=pad?'':(isRed?'color:#E24B4A':isSat?'color:#4466bb':'');
      const holHtml=hol&&!pad?`<div style="font-size:12px;color:#E24B4A;line-height:1.3;word-break:break-word;margin-bottom:1px">${hol}</div>`:'';
      html+=`<div class="cal-cell${cls}" onclick="openAddEvent('${ds}')"><div class="dnum" style="${dnStyle}">${d}</div>${holHtml}</div>`;
    });
    html+=`</div>`;
    // All events below date numbers using combined lane assignment
    const wEvs=[];
    // Multi-day events
    multiEvs.filter(e=>e.start<=wE&&e.end>=wS).forEach(e=>{
      const vs=e.start<wS?wS:e.start;
      const ve=e.end>wE?wE:e.end;
      const cs=week.findIndex(d=>d.ds===vs);
      const ce=week.findIndex(d=>d.ds===ve);
      if(cs>=0&&ce>=0)wEvs.push({e,cs,ce,isMulti:true});
    });
    // Single-day events
    week.forEach((day,di)=>{
      S.events.filter(ev=>ev.start===ev.end&&ev.start===day.ds).forEach(e=>{
        wEvs.push({e,cs:di,ce:di,isMulti:false});
      });
    });
    // Sort: multi-day first (longer first), then by start
    wEvs.sort((a,b)=>{
      const aL=a.ce-a.cs,bL=b.ce-b.cs;
      if(bL!==aL)return bL-aL;
      return a.e.start.localeCompare(b.e.start);
    });
    // Assign lanes
    const laneGrid=[];
    const assigned=wEvs.map(ev=>{
      let lane=0;
      while(true){
        if(!laneGrid[lane])laneGrid[lane]=new Set();
        let ok=true;
        for(let c=ev.cs;c<=ev.ce;c++){if(laneGrid[lane].has(c)){ok=false;break;}}
        if(ok){for(let c=ev.cs;c<=ev.ce;c++)laneGrid[lane].add(c);break;}
        lane++;
      }
      return{...ev,lane};
    });
    // Always render evlayer for uniform row heights; use absolute positioning
    html+=`<div class="cal-evlayer">`;
    const colW=100/7;
    const rowH=22;
    assigned.forEach(({e,cs,ce,lane,isMulti})=>{
      const left=colW*cs;
      const width=colW*(ce-cs+1);
      const top=lane*rowH+2;
      if(isMulti){
        const isFirst=e.start>=wS,isLast=e.end<=wE;
        const r=isFirst&&isLast?'4px':isFirst?'4px 0 0 4px':isLast?'0 4px 4px 0':'0';
        const ml=isFirst?2:0,mr=isLast?2:0;
        html+=`<div class="cal-ev ev-${e.type}" style="position:absolute;top:${top}px;left:calc(${left}% + ${ml}px);width:calc(${width}% - ${ml+mr}px);height:20px;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px;cursor:pointer;font-size:11px;border-radius:${r}" onclick="event.stopPropagation();openEventDetail(${e.id})">${isFirst?e.title:''}</div>`;
      } else {
        html+=`<div class="cal-ev ev-${e.type}" style="position:absolute;top:${top}px;left:calc(${left}% + 2px);width:calc(${width}% - 4px);height:20px;line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px;cursor:pointer;font-size:11px;border-radius:4px" onclick="event.stopPropagation();openEventDetail(${e.id})">${e.title}</div>`;
      }
    });
    html+=`</div></div>`;
  });
  html+=`</div>`;
  document.getElementById(container).innerHTML=html;
}
function calPrev(c){S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()-1,1);renderCalendar(c,S.cal,'openAddEvent(null)');if(c==='sched-cal')renderScheduleTable()}
function calNext(c){S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()+1,1);renderCalendar(c,S.cal,'openAddEvent(null)');if(c==='sched-cal')renderScheduleTable()}
function calToday(c){const n=new Date();S.cal=new Date(n.getFullYear(),n.getMonth(),1);renderCalendar(c,S.cal,'openAddEvent(null)');if(c==='sched-cal')renderScheduleTable()}

function calcAutoLeave(startDateStr){
  if(!startDateStr)return{annual:0,monthly:0};
  const start=new Date(startDateStr),now=new Date();
  const ms=now-start;
  if(ms<0)return{annual:0,monthly:0};
  const months=(now.getFullYear()-start.getFullYear())*12+(now.getMonth()-start.getMonth());
  const years=ms/(1000*60*60*24*365.25);
  if(years>=1)return{annual:15,monthly:0};
  return{annual:0,monthly:Math.max(0,months)};
}
function syncEmpAutoLeave(){
  const now=new Date();
  S.employees.forEach(e=>{
    if(!e.startDate||e._yearGranted)return;
    const years=(now-new Date(e.startDate))/(1000*60*60*24*365.25);
    if(years>=1){
      e.annualLeave=Math.max(e.annualLeave||0,15);
      e.monthLeave=0;
      e._yearGranted=true;
      e.leaveHistory=e.leaveHistory||[];
      e.leaveHistory.push({id:newId(),type:'연차',date:today(),days:15,reason:'입사 1년 경과 자동 부여',granted:true});
    }
  });
}

function buildInternGrid(mode){
  const DAYS=['월','화','수','목','금'];
  const TIMES=['09','10','11','12','13','14','15','16','17','18'];
  const COLORS=['#ede9ff','#e6f4ec','#fef3e2','#fde8e8','#ddf4ff','#fff0cc'];
  const TXCOLORS=['var(--ac)','var(--gr)','var(--or)','var(--re)','#0969DA','#B45309'];
  const RH=56; // fixed row height px
  // Build slot map: key `${day}-${hour}` → [{name, ci}]
  const slots={};
  S.interns.filter(intern=>isInternActive(intern)).forEach((intern,idx)=>{
    const sched=mode==='class'?(S.internTimetable[intern.name]||[]):getSchedForWeek(intern.name,0);
    sched.forEach(s=>{
      const sh=parseInt(s.start),eh=parseInt(s.end);
      for(let h=sh;h<eh;h++){
        const k=`${s.day}-${h}`;
        if(!slots[k])slots[k]=[];
        slots[k].push({name:intern.name,ci:idx%6});
      }
    });
  });
  const trows=TIMES.map(h=>`<tr style="height:${RH}px">
    <td style="width:90px;min-width:90px;font-size:11px;color:var(--sub);background:#fafaf8;text-align:center;border:1px solid var(--bd);white-space:nowrap;height:${RH}px;padding:0">${h}:00~${parseInt(h)+1}:00</td>
    ${DAYS.map(d=>{
      const list=slots[`${d}-${parseInt(h)}`]||[];
      const chips=list.map(x=>`<span style="display:inline-block;background:${COLORS[x.ci]};color:${TXCOLORS[x.ci]};border-radius:5px;padding:3px 10px;font-size:12px;font-weight:600;margin:2px;white-space:nowrap">${x.name}</span>`).join('');
      return `<td style="border:1px solid var(--bd);padding:0;height:${RH}px;overflow:hidden"><div style="height:${RH}px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px;padding:4px">${chips}</div></td>`;
    }).join('')}
  </tr>`).join('');
  return `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;table-layout:fixed">
    <colgroup><col style="width:90px">${DAYS.map(()=>`<col>`).join('')}</colgroup>
    <thead><tr style="height:36px">
      <th style="background:#fafaf8;font-size:12px;font-weight:600;border:1px solid var(--bd);padding:0;text-align:center"></th>
      ${DAYS.map(d=>`<th style="background:#fafaf8;font-size:13px;font-weight:700;border:1px solid var(--bd);padding:0;text-align:center">${d}</th>`).join('')}
    </tr></thead>
    <tbody>${trows}</tbody>
  </table></div>`;
}

function tgToggle(d,h,id){
  const k=`${d}-${h}`;
  if(typeof window._ttGridState[k]==='string')return; // text mode: single-click disabled
  window._ttGridState[k]=!window._ttGridState[k];
  const cell=document.querySelector(`[data-d="${d}"][data-h="${h}"]`);
  if(cell)cell.classList.toggle('sel',!!window._ttGridState[k]);
}
function tgEdit(cell,d,h,id){
  cell.contentEditable='true';cell.style.cursor='text';cell.focus();
  const r=document.createRange();r.selectNodeContents(cell);
  const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
  function onBlur(){
    cell.contentEditable='false';cell.style.cursor='';
    const k=`${d}-${h}`;const txt=cell.innerText.trim();
    window._ttGridState[k]=txt||false;
    cell.classList.toggle('sel',!!txt);
    cell.textContent=txt;
    cell.removeEventListener('blur',onBlur);
  }
  cell.addEventListener('blur',onBlur);
}
function saveTTGrid(id){
  const i=S.interns.find(x=>x.id===id);if(!i)return;
  const gs=window._ttGridState||{};
  const DAYS=['월','화','수','목','금'];
  const byDay={};
  DAYS.forEach(d=>{byDay[d]=[]});
  Object.entries(gs).forEach(([k,v])=>{if(v){const[d,h]=k.split('-');byDay[d].push(parseInt(h))}});
  const slots=[];
  DAYS.forEach(d=>{
    const hrs=byDay[d].sort((a,b)=>a-b);
    let st=null,prev=null;
    hrs.forEach(h=>{
      if(st===null){st=h;prev=h}
      else if(h===prev+1){prev=h}
      else{slots.push({day:d,start:`${p2(st)}:00`,end:`${p2(prev+1)}:00`});st=h;prev=h}
    });
    if(st!==null)slots.push({day:d,start:`${p2(st)}:00`,end:`${p2(prev+1)}:00`});
  });

function getSchedForWeek(name,weekOff){
  const hist=S.internSchedHistory[name];
  if(hist&&hist.length){
    let best=null;
    for(const e of hist){if(e.fromWeek<=weekOff)best=e;else break;}
    if(best)return best.slots;
  }
  return S.internSchedules[name]||[];
}

function saveInternSchedGrid(internId,weekOff){
  const intern=S.interns.find(x=>x.id===internId);if(!intern)return;
  const gs=window._wsGs||{};

function getWeekInfo(offset){
  const now=new Date();
  const dow=now.getDay();
  const mon=new Date(now);mon.setDate(now.getDate()-(dow===0?6:dow-1)+offset*7);
  const fri=new Date(mon);fri.setDate(mon.getDate()+4);
  const y=mon.getFullYear(),m=mon.getMonth();
  const first=new Date(y,m,1);
  const fd=first.getDay();
  const fmon=new Date(first);fmon.setDate(first.getDate()+(fd===0?1:fd===1?0:8-fd));
  if(fmon.getMonth()!==m)fmon.setDate(fmon.getDate()-7);
  const diff=Math.round((mon-fmon)/(864e5));
  const wn=Math.floor(diff/7)+1;
  const label=`${y}년 ${m+1}월 ${wn}주차(${m+1}/${mon.getDate()}~${fri.getMonth()+1}/${fri.getDate()})`;
  return{mon,fri,label,wn};
}

function internColorIdx(intern){
  // Use position in full S.interns list so color stays fixed regardless of active/inactive state
  return S.interns.findIndex(x=>x.id===intern.id);
}
function renderWSTable(){
  const el=document.getElementById('ws-table');if(!el)return;
  const {mon}=getWeekInfo(S.weekOffset);
  const DAYS=['월','화','수','목','금'];
  const activeInterns=S.interns.filter(isInternActive);
  let thead=`<tr style="height:44px"><th style="width:90px">시간</th>`;
  DAYS.forEach((d,i)=>{
    const dt=new Date(mon);dt.setDate(mon.getDate()+i);
    const ds=fmt(dt);
    const hol=getHolidayForDay(ds);
    thead+=`<th>${d} ${dt.getMonth()+1}/${dt.getDate()}${hol?`<br><span style="font-size:10px;color:var(--re)">${hol}</span>`:''}</th>`;
  });
  thead+=`</tr>`;
  let tbody='';
  for(let h=9;h<19;h++){
    let row=`<tr style="height:52px"><td class="stime" style="white-space:nowrap">${p2(h)}:00~${p2(h+1)}:00</td>`;
    DAYS.forEach(d=>{
      const chips=activeInterns.map(intern=>{
        const sched=getSchedForWeek(intern.name,S.weekOffset);
        const slot=sched.find(s=>s.day===d&&parseInt(s.start)<=h&&parseInt(s.end)>h);
        if(!slot)return '';
        const c=WS_COLORS[internColorIdx(intern)%WS_COLORS.length];
        return `<span class="ichip" style="background:${c.bg};color:${c.tc}" onclick="openInternWeekSched(${intern.id},${S.weekOffset})">${intern.name}</span>`;
      }).join('');
      row+=`<td class="sslot"><div style="height:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;padding:4px">${chips}</div></td>`;
    });
    row+=`</tr>`;tbody+=row;
  }
  el.innerHTML=`<table class="st-table" style="width:auto;table-layout:fixed">
    <colgroup><col style="width:90px">${DAYS.map(()=>'<col style="width:50px">').join('')}</colgroup>
    <thead>${thead}</thead><tbody>${tbody}</tbody>
  </table>`;
  renderWSInternList();
}

    (active.length?active.map(intern=>{
      const c=WS_COLORS[internColorIdx(intern)%WS_COLORS.length];
      const sched=getSchedForWeek(intern.name,S.weekOffset);
      const days=[...new Set(sched.map(s=>s.day))].join('·')||'미등록';

        <div style="width:10px;height:10px;border-radius:3px;background:${c.bg};border:1.5px solid ${c.tc};flex-shrink:0"></div>
        <div>
          <div style="font-size:13px;font-weight:600;color:var(--tx)">${intern.name}</div>

let _bPosts=[],_bActiveId=null,_bSearch='',_bTagFilter=null,_bDragId=null,_slashId=null,_slashQ='',_slashSel=0;
function _bLoad(){try{_bPosts=JSON.parse(localStorage.getItem('nds_board')||'[]')}catch{_bPosts=[]}}
function _bSave(){localStorage.setItem('nds_board',JSON.stringify(_bPosts))}
function _bNewId(){return 'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}

function renderBoard(){

  p.innerHTML=`<div class="board-wrap">

        <span style="font-size:13px;font-weight:700;color:var(--tx)">게시판</span>

    </div>
  </div>`;
  bRenderSb();
  if(_bActiveId&&_bPosts.find(x=>x.id===_bActiveId))bOpenPost(_bActiveId);
}

function bRenderSb(){
  const listEl=document.getElementById('b-list'),tagsEl=document.getElementById('b-tags');
  if(!listEl)return;
  const allTags=[...new Set(_bPosts.flatMap(p=>p.tags||[]))];
  tagsEl.innerHTML=allTags.map(t=>`<span class="btag${_bTagFilter===t?' on':''}" onclick="bSetTag('${t.replace(/'/g,"\\'")}')">${t}</span>`).join('');
  tagsEl.style.display=allTags.length?'flex':'none';
  let posts=[..._bPosts].sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
  if(_bSearch)posts=posts.filter(p=>(p.title||'').includes(_bSearch)||(p.blocks||[]).some(b=>b.content&&b.content.includes(_bSearch)));
  if(_bTagFilter)posts=posts.filter(p=>(p.tags||[]).includes(_bTagFilter));
  listEl.innerHTML=posts.length?posts.map(p=>`<div class="board-li${_bActiveId===p.id?' active':''}" onclick="bOpenPost('${p.id}')">
    <div class="board-li-title">${p.icon?p.icon+' ':''}${p.title||'제목 없음'}</div>
    <div class="board-li-meta">${p.updatedAt||p.createdAt||''}${(p.tags||[]).length?' · '+p.tags.join(', '):''}</div>
  </div>`).join(''):`<div style="color:var(--sub);font-size:13px;padding:20px;text-align:center">글이 없습니다.</div>`;
}

function bSetSearch(v){_bSearch=v;bRenderSb()}
function bSetTag(t){_bTagFilter=_bTagFilter===t?null:t;bRenderSb()}

function bOpenPost(id){
  _bActiveId=id;bRenderSb();
  const post=_bPosts.find(x=>x.id===id);if(!post)return;
  const el=document.getElementById('b-editor');if(!el)return;
  el.innerHTML=`<div style="max-width:700px;margin:0 auto">
    ${post.cover?`<div style="height:160px;background:url(${post.cover}) center/cover no-repeat;border-radius:8px;margin-bottom:16px;position:relative">
      <button class="btn btn-o btn-sm" style="position:absolute;top:8px;right:8px;background:rgba(255,255,255,.85)" onclick="bRemoveCover('${id}')">커버 삭제</button></div>`
    :`<div style="margin-bottom:10px"><button class="btn-g" style="font-size:12px;color:var(--sub)" onclick="document.getElementById('b-cover-inp').click()">+ 커버 추가</button>
      <input type="file" id="b-cover-inp" style="display:none" accept="image/*" onchange="bLoadCover(event,'${id}')"></div>`}
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <span style="font-size:38px;cursor:pointer;line-height:1" onclick="bPickIcon('${id}')">${post.icon||'📄'}</span>
      <input class="board-title-input" value="${(post.title||'').replace(/"/g,'&quot;')}" placeholder="제목 없음" oninput="bUpdateTitle('${id}',this.value)">
    </div>
    <div style="font-size:12px;color:var(--sub);margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span>${post.createdAt||''}</span>
      ${(post.tags||[]).map(t=>`<span class="btag on">${t}<button onclick="bRemoveTag('${id}','${t.replace(/'/g,"\\'")}');event.stopPropagation()" style="background:none;border:none;cursor:pointer;color:#999;padding:0 0 0 2px;font-size:10px">×</button></span>`).join('')}
      <button class="btn-g" style="font-size:11px" onclick="bAddTag('${id}')">+ 태그</button>
      <button class="btn btn-d btn-sm" style="margin-left:auto" onclick="bDeletePost('${id}')">글 삭제</button>
    </div>
    <div id="b-blocks">${bRenderBlocks(post.blocks||[],id)}</div>
    <div style="padding:4px 0 32px 32px"><button class="btn-g" style="font-size:13px;color:var(--sub)" onclick="bAddBlock(null,'${id}','paragraph')">+ 블록 추가</button></div>
  </div>`;
  const tInput=el.querySelector('.board-title-input');
  if(tInput&&!post.title)setTimeout(()=>tInput.focus(),40);
}

function bRenderBlocks(blocks,postId){
  return (blocks||[]).map(blk=>bBlockHtml(blk,postId)).join('');
}

function bBlockHtml(blk,postId){
  if(blk.type==='divider'){
    return `<div class="bk-wrap" data-id="${blk.id}" draggable="true" ondragstart="bDragStart(event,'${blk.id}')" ondragover="bDragOver(event,'${blk.id}')" ondrop="bDrop(event,'${blk.id}','${postId}')">
      <div class="bk-actions"><span class="bk-handle">⠿</span><span class="bk-add-btn" onclick="bAddBlock('${blk.id}','${postId}','paragraph')">+</span></div>
      <div class="bk-divider"></div>
      <button class="btn-g" style="font-size:11px;align-self:center" onclick="bDelBlock('${blk.id}','${postId}')">×</button></div>`;
  }
  if(blk.type==='table'){
    if(!blk.tableData||!blk.tableData.length)blk.tableData=[['','',''],['','',''],['','','']];
    const rows=blk.tableData;
    const tRows=rows.map((row,ri)=>`<tr>${row.map((cell,ci)=>{
      const tag=ri===0?'th':'td';
      return `<${tag} contenteditable="true" onblur="bTblCell(event,'${blk.id}','${postId}',${ri},${ci})">${cell}</${tag}>`;
    }).join('')}</tr>`).join('');
    return `<div class="bk-wrap" data-id="${blk.id}" draggable="true" ondragstart="bDragStart(event,'${blk.id}')" ondragover="bDragOver(event,'${blk.id}')" ondrop="bDrop(event,'${blk.id}','${postId}')">
      <div class="bk-actions"><span class="bk-handle">⠿</span><span class="bk-add-btn" onclick="bAddBlock('${blk.id}','${postId}','paragraph')">+</span></div>
      <div style="overflow-x:auto;padding:2px 0">
        <table class="bk-table"><tbody>${tRows}</tbody></table>
        <div style="display:flex;gap:4px;margin-top:4px">
          <button class="btn-g" style="font-size:11px" onclick="bTblAddRow('${blk.id}','${postId}')">+ 행</button>
          <button class="btn-g" style="font-size:11px" onclick="bTblAddCol('${blk.id}','${postId}')">+ 열</button>
          <button class="btn-g" style="font-size:11px" onclick="bTblDelRow('${blk.id}','${postId}')">− 행</button>
          <button class="btn-g" style="font-size:11px" onclick="bTblDelCol('${blk.id}','${postId}')">− 열</button>
          <button class="btn-g" style="font-size:11px;margin-left:auto" onclick="bDelBlock('${blk.id}','${postId}')">×</button>
        </div>
      </div></div>`;
  }
  const ph={paragraph:'내용 입력... (/ 로 블록 변경)',heading1:'제목 1',heading2:'제목 2',heading3:'제목 3',bulletedList:'• 항목',numberedList:'1. 항목',toggle:'▶ 토글',quote:'인용구',code:'코드 입력'}[blk.type]||'';
  return `<div class="bk-wrap" data-id="${blk.id}" draggable="true" ondragstart="bDragStart(event,'${blk.id}')" ondragover="bDragOver(event,'${blk.id}')" ondrop="bDrop(event,'${blk.id}','${postId}')">
    <div class="bk-actions"><span class="bk-handle">⠿</span><span class="bk-add-btn" onclick="bShowAddMenu('${blk.id}','${postId}')">+</span></div>
    <div class="bk-content" data-type="${blk.type}" data-ph="${ph}" contenteditable="true"
      oninput="bContentInput(event,'${blk.id}','${postId}')"
      onkeydown="bKeydown(event,'${blk.id}','${postId}')"
      onmouseup="bSelChange()">${blk.content||''}</div></div>`;
}

function bUpdateTitle(postId,val){
  const p=_bPosts.find(x=>x.id===postId);if(!p)return;
  p.title=val;p.updatedAt=today();_bSave();bRenderSb();
}

function bNewPost(){
  const post={id:_bNewId(),title:'',icon:'',cover:null,tags:[],createdAt:today(),updatedAt:today(),
    blocks:[{id:_bNewId(),type:'paragraph',content:''}]};
  _bPosts.unshift(post);_bSave();_bActiveId=post.id;bRenderSb();bOpenPost(post.id);
}

function bDeletePost(id){
  if(!confirm('이 글을 삭제하시겠습니까?'))return;
  _bPosts=_bPosts.filter(x=>x.id!==id);
  if(_bActiveId===id)_bActiveId=null;
  _bSave();renderBoard();
}

function bContentInput(e,blkId,postId){
  const el=e.target;
  const p=_bPosts.find(x=>x.id===postId);if(!p)return;
  const blk=p.blocks.find(x=>x.id===blkId);if(!blk)return;
  const txt=el.innerText;
  if(txt==='/'||(_slashId===blkId&&txt.startsWith('/'))){
    if(txt==='/'){_slashId=blkId;_slashQ='';_slashSel=0;bShowSlash(el,postId);}
    else if(_slashId===blkId){_slashQ=txt.slice(1).toLowerCase();bUpdateSlash();}
    return;
  }
  if(_slashId)bHideSlash();
  blk.content=el.innerHTML;p.updatedAt=today();_bSave();
}

function bKeydown(e,blkId,postId){
  if(_slashId){
    if(e.key==='ArrowDown'){e.preventDefault();bSlashNav(1);return}
    if(e.key==='ArrowUp'){e.preventDefault();bSlashNav(-1);return}
    if(e.key==='Enter'){e.preventDefault();bSlashPick(blkId,postId);return}
    if(e.key==='Escape'){bHideSlash();return}
  }
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    const el=e.target;
    const p=_bPosts.find(x=>x.id===postId);if(!p)return;
    const blk=p.blocks.find(x=>x.id===blkId);if(!blk)return;
    blk.content=el.innerHTML;
    bInsertAfter(blkId,postId,'paragraph');
    return;
  }
  if(e.key==='Backspace'){
    const el=e.target;
    if(!el.innerText.trim()){e.preventDefault();bDelBlock(blkId,postId);}
  }
  if((e.ctrlKey||e.metaKey)){
    if(e.key==='b'){e.preventDefault();document.execCommand('bold');}
    else if(e.key==='i'){e.preventDefault();document.execCommand('italic');}
    else if(e.key==='u'){e.preventDefault();document.execCommand('underline');}
  }
}

function bInsertAfter(blkId,postId,type){
  const p=_bPosts.find(x=>x.id===postId);if(!p)return;
  const idx=p.blocks.findIndex(x=>x.id===blkId);
  const nb={id:_bNewId(),type,content:''};
  p.blocks.splice(idx+1,0,nb);p.updatedAt=today();_bSave();
  const bEl=document.getElementById('b-blocks');
  if(bEl)bEl.innerHTML=bRenderBlocks(p.blocks,postId);
  setTimeout(()=>{const ne=document.querySelector(`[data-id="${nb.id}"] .bk-content`);if(ne)ne.focus();},20);
}

function bDelBlock(blkId,postId){
  const p=_bPosts.find(x=>x.id===postId);if(!p)return;
  if(p.blocks.length<=1)return;
  const idx=p.blocks.findIndex(x=>x.id===blkId);
  p.blocks.splice(idx,1);p.updatedAt=today();_bSave();
  const bEl=document.getElementById('b-blocks');
  if(bEl)bEl.innerHTML=bRenderBlocks(p.blocks,postId);
  const pi=Math.max(0,idx-1);
  setTimeout(()=>{const pe=document.querySelector(`[data-id="${p.blocks[pi]?.id}"] .bk-content`);if(pe){pe.focus();const r=document.createRange();r.selectNodeContents(pe);r.collapse(false);const s=window.getSelection();s.removeAllRanges();s.addRange(r);}},20);
}

function bAddBlock(afterId,postId,type){
  if(afterId)bInsertAfter(afterId,postId,type);
  else{const p=_bPosts.find(x=>x.id===postId);if(!p)return;const nb={id:_bNewId(),type,content:''};p.blocks.push(nb);p.updatedAt=today();_bSave();const bEl=document.getElementById('b-blocks');if(bEl)bEl.innerHTML=bRenderBlocks(p.blocks,postId);setTimeout(()=>{const ne=document.querySelector(`[data-id="${nb.id}"] .bk-content`);if(ne)ne.focus();},20);}
}

// Slash menu
const B_SLASH=[
  {type:'paragraph',icon:'T',label:'문단'},{type:'heading1',icon:'H1',label:'제목 1'},
  {type:'heading2',icon:'H2',label:'제목 2'},{type:'heading3',icon:'H3',label:'제목 3'},
  {type:'bulletedList',icon:'•',label:'글머리 기호'},{type:'numberedList',icon:'1.',label:'번호 목록'},
  {type:'quote',icon:'❝',label:'인용구'},{type:'code',icon:'</>',label:'코드 블록'},
  {type:'toggle',icon:'▶',label:'토글'},{type:'divider',icon:'—',label:'구분선'},
  {type:'table',icon:'⊞',label:'표'},
];

function bShowSlash(el,postId){
  let m=document.getElementById('slash-menu');
  if(!m){m=document.createElement('div');m.id='slash-menu';m.className='slash-menu';document.body.appendChild(m);}
  m._postId=postId;
  const rect=el.getBoundingClientRect();
  m.style.top=(rect.bottom+2)+'px';m.style.left=rect.left+'px';m.style.display='block';
  bUpdateSlash();
}
function bUpdateSlash(){
  const m=document.getElementById('slash-menu');if(!m)return;
  const q=_slashQ;
  const items=B_SLASH.filter(x=>!q||x.label.includes(q)||x.type.includes(q));
  _slashSel=0;
  m.innerHTML=items.map((x,i)=>`<div class="slash-item${i===0?' sel':''}" data-type="${x.type}">
    <span style="width:28px;font-size:12px;font-weight:700;color:var(--sub);text-align:center">${x.icon}</span>${x.label}</div>`).join('');
  m.querySelectorAll('.slash-item').forEach(it=>it.addEventListener('mousedown',e=>{e.preventDefault();const bid=_slashId;const pid=m._postId;if(bid)bChangeBlockType(bid,pid,it.dataset.type);bHideSlash();}));
}
function bSlashNav(d){
  const m=document.getElementById('slash-menu');if(!m)return;
  const items=m.querySelectorAll('.slash-item');
  items[_slashSel]?.classList.remove('sel');
  _slashSel=Math.max(0,Math.min(items.length-1,_slashSel+d));
  items[_slashSel]?.classList.add('sel');
  items[_slashSel]?.scrollIntoView({block:'nearest'});
}
function bSlashPick(blkId,postId){
  const m=document.getElementById('slash-menu');if(!m)return;
  const sel=m.querySelector('.slash-item.sel');
  if(sel)bChangeBlockType(blkId,postId,sel.dataset.type);
  bHideSlash();
}
function bTblCell(e,blkId,postId,r,c){
  const p=_bPosts.find(x=>x.id===postId);if(!p)return;
  const blk=p.blocks.find(x=>x.id===blkId);if(!blk||!blk.tableData)return;
  blk.tableData[r][c]=e.target.innerHTML;p.updatedAt=today();_bSave();
}
function bTblAddRow(blkId,postId){
  const p=_bPosts.find(x=>x.id===postId);if(!p)return;
  const blk=p.blocks.find(x=>x.id===blkId);if(!blk||!blk.tableData)return;
  const cols=blk.tableData[0]?.length||3;
  blk.tableData.push(Array(cols).fill(''));p.updatedAt=today();_bSave();
  const bEl=document.getElementById('b-blocks');if(bEl)bEl.innerHTML=bRenderBlocks(p.blocks,postId);
}
function bTblAddCol(blkId,postId){
  const p=_bPosts.find(x=>x.id===postId);if(!p)return;
  const blk=p.blocks.find(x=>x.id===blkId);if(!blk||!blk.tableData)return;
  blk.tableData.forEach(row=>row.push(''));p.updatedAt=today();_bSave();
  const bEl=document.getElementById('b-blocks');if(bEl)bEl.innerHTML=bRenderBlocks(p.blocks,postId);
}
function bTblDelRow(blkId,postId){
  const p=_bPosts.find(x=>x.id===postId);if(!p)return;
  const blk=p.blocks.find(x=>x.id===blkId);if(!blk||!blk.tableData||blk.tableData.length<=1)return;
  blk.tableData.pop();p.updatedAt=today();_bSave();
  const bEl=document.getElementById('b-blocks');if(bEl)bEl.innerHTML=bRenderBlocks(p.blocks,postId);
}
function bTblDelCol(blkId,postId){
  const p=_bPosts.find(x=>x.id===postId);if(!p)return;
  const blk=p.blocks.find(x=>x.id===blkId);if(!blk||!blk.tableData||blk.tableData[0]?.length<=1)return;
  blk.tableData.forEach(row=>row.pop());p.updatedAt=today();_bSave();
  const bEl=document.getElementById('b-blocks');if(bEl)bEl.innerHTML=bRenderBlocks(p.blocks,postId);
}
function bChangeBlockType(blkId,postId,type){
  const p=_bPosts.find(x=>x.id===postId);if(!p)return;
  const blk=p.blocks.find(x=>x.id===blkId);if(!blk)return;
  blk.type=type;blk.content='';
  if(type==='table'&&!blk.tableData)blk.tableData=[['','',''],['','',''],['','','']];
  p.updatedAt=today();_bSave();
  const bEl=document.getElementById('b-blocks');
  if(bEl)bEl.innerHTML=bRenderBlocks(p.blocks,postId);
  setTimeout(()=>{const ne=document.querySelector(`[data-id="${blkId}"] .bk-content`);if(ne)ne.focus();},20);
}
function bHideSlash(){_slashId=null;_slashQ='';const m=document.getElementById('slash-menu');if(m)m.style.display='none';}

// + Add menu (shows slash menu below clicked block)
function bShowAddMenu(blkId,postId){
  const el=document.querySelector(`[data-id="${blkId}"] .bk-content`);
  if(el){_slashId=blkId;_slashQ='';_slashSel=0;bShowSlash(el,postId);}
}

// Selection format toolbar
function bSelChange(){
  setTimeout(()=>{
    const sel=window.getSelection();
    if(!sel||sel.isCollapsed){bHideFmt();return}
    const range=sel.getRangeAt(0);
    const rect=range.getBoundingClientRect();
    if(!rect.width){bHideFmt();return}
    let tb=document.getElementById('fmt-toolbar');
    if(!tb){
      tb=document.createElement('div');tb.id='fmt-toolbar';tb.className='fmt-toolbar';
      [['B','볼드'],['I','이탤릭'],['U','밑줄'],['code','코드']].forEach(([cmd,lbl])=>{
        const btn=document.createElement('button');btn.className='fmt-btn';
        btn.textContent=lbl;btn.onmousedown=e=>{e.preventDefault();bApplyFmt(cmd);};
        tb.appendChild(btn);
      });
      document.body.appendChild(tb);
    }
    tb.style.top=(rect.top-44+window.scrollY)+'px';
    tb.style.left=(rect.left+rect.width/2-tb.offsetWidth/2||0)+window.scrollX+'px';
    tb.style.display='flex';
  },10);
}
function bHideFmt(){const t=document.getElementById('fmt-toolbar');if(t)t.style.display='none';}
function bApplyFmt(cmd){
  if(cmd==='B')document.execCommand('bold');
  else if(cmd==='I')document.execCommand('italic');
  else if(cmd==='U')document.execCommand('underline');
  else if(cmd==='code'){const txt=window.getSelection()?.toString();if(txt)document.execCommand('insertHTML',false,`<code style="background:#f0f0ee;padding:1px 5px;border-radius:3px;font-family:monospace;font-size:.88em">${txt}</code>`);}
  // save
  const bEl=document.activeElement?.closest('.bk-wrap');
  if(bEl){const bid=bEl.dataset.id;const p=_bPosts.find(x=>x.id===_bActiveId);if(p){const blk=p.blocks.find(x=>x.id===bid);if(blk){blk.content=bEl.querySelector('.bk-content')?.innerHTML||'';_bSave();}}}
}

// Drag & drop
function bDragStart(e,id){_bDragId=id;e.dataTransfer.effectAllowed='move';setTimeout(()=>e.target.style.opacity='.4',0);}
function bDragOver(e,id){e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('.bk-wrap').forEach(el=>el.style.borderTop='');if(id!==_bDragId){const el=document.querySelector(`[data-id="${id}"]`);if(el)el.style.borderTop='2px solid var(--ac)';}}
function bDrop(e,targetId,postId){
  e.preventDefault();
  document.querySelectorAll('.bk-wrap').forEach(el=>{el.style.opacity='';el.style.borderTop='';});
  if(!_bDragId||_bDragId===targetId)return;
  const p=_bPosts.find(x=>x.id===postId);if(!p)return;
  const si=p.blocks.findIndex(x=>x.id===_bDragId),ti=p.blocks.findIndex(x=>x.id===targetId);
  if(si<0||ti<0)return;
  const[blk]=p.blocks.splice(si,1);p.blocks.splice(ti,0,blk);
  p.updatedAt=today();_bSave();
  const bEl=document.getElementById('b-blocks');if(bEl)bEl.innerHTML=bRenderBlocks(p.blocks,postId);
  _bDragId=null;
}

// Tags, icon, cover
function bAddTag(postId){const t=prompt('태그 입력:');if(!t?.trim())return;const p=_bPosts.find(x=>x.id===postId);if(!p)return;if(!p.tags)p.tags=[];if(!p.tags.includes(t.trim()))p.tags.push(t.trim());_bSave();bOpenPost(postId);bRenderSb();}
function bRemoveTag(postId,tag){const p=_bPosts.find(x=>x.id===postId);if(!p)return;p.tags=(p.tags||[]).filter(t=>t!==tag);_bSave();bOpenPost(postId);bRenderSb();}
function bPickIcon(postId){const icons='📄📝📊💡🔗📌⭐🎨🔧📐💬📅🗂🏆🚀📋🎯📎🗒🔖';const i=prompt(`아이콘 (이모지):\n${icons}`)||'📄';const p=_bPosts.find(x=>x.id===postId);if(!p)return;p.icon=[...i.trim()][0]||'📄';_bSave();bOpenPost(postId);bRenderSb();}
function bPickCover(id){document.getElementById('b-cover-inp')?.click();}
function bLoadCover(e,postId){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{const p=_bPosts.find(x=>x.id===postId);if(!p)return;p.cover=ev.target.result;_bSave();bOpenPost(postId);};r.readAsDataURL(file);}
function bRemoveCover(postId){const p=_bPosts.find(x=>x.id===postId);if(!p)return;p.cover=null;_bSave();bOpenPost(postId);}

document.addEventListener('click',e=>{
  if(!e.target.closest('#slash-menu')&&!e.target.closest('.bk-content')&&!e.target.closest('.bk-add-btn'))bHideSlash();
  if(!e.target.closest('#fmt-toolbar')&&!e.target.closest('.bk-content'))bHideFmt();
});

// ─── PROJECTS ─────────────────────────────────────
let _pPosts=[],_pActiveId=null,_pSearch='',_pStatusFilter=null,_pDragId=null;
const PRJ_STATUSES=['진행중','완료','대기','보류'];
function _pLoad(){try{_pPosts=JSON.parse(localStorage.getItem('nds_projects')||'[]')}catch{_pPosts=[]}}
function _pSave(){localStorage.setItem('nds_projects',JSON.stringify(_pPosts))}
function _pNewId(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}

function renderProjects(){
  _pLoad();
  const p=document.getElementById('page-projects');
  p.innerHTML=`<div class="board-wrap">
    <div class="board-sb">
      <div class="board-sb-hd">
        <span style="font-weight:700;font-size:14px">프로젝트</span>
        <button class="btn btn-p btn-sm" onclick="pNewPost()">+ 새 프로젝트</button>
      </div>
      <div style="padding:0 12px 8px">
        <input class="board-search-box" placeholder="검색..." value="${_pSearch}" oninput="_pSearch=this.value;pRenderSb()">
      </div>
      <div style="display:flex;gap:4px;padding:0 12px 8px;flex-wrap:wrap">
        <button class="btag${_pStatusFilter===null?' on':''}" onclick="pSetStatusFilter(null)">전체</button>
        ${PRJ_STATUSES.map(s=>`<button class="btag${_pStatusFilter===s?' on':''}" onclick="pSetStatusFilter('${s}')">${s}</button>`).join('')}
      </div>
      <div class="board-list-wrap" id="p-sb-list"></div>
    </div>
    <div class="board-editor-area" id="p-editor"><div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--sub);font-size:14px">프로젝트를 선택하거나 새로 만드세요</div></div>
  </div>`;
  pRenderSb();
  if(_pActiveId)pOpenPost(_pActiveId);
}

function pRenderSb(){
  const el=document.getElementById('p-sb-list');if(!el)return;
  const q=_pSearch.trim().toLowerCase();
  let list=_pPosts.filter(p=>(!q||(p.name||'').toLowerCase().includes(q))&&(!_pStatusFilter||p.status===_pStatusFilter));
  el.innerHTML=list.length?list.map(p=>`<div class="board-li${p.id===_pActiveId?' active':''}" onclick="pOpenPost('${p.id}')" style="display:flex;align-items:center;gap:6px">
    <span style="font-size:18px;flex-shrink:0">${p.icon||'🗃'}</span>
    <div style="flex:1;min-width:0">
      <div style="font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name||'제목 없음'}</div>
      <span class="prj-status ps-${p.status||'대기'}">${p.status||'대기'}</span>
    </div>
    <button class="btn btn-d btn-sm" style="flex-shrink:0;padding:2px 7px" onclick="event.stopPropagation();pDeletePost('${p.id}')">삭제</button>
  </div>`).join(''):'<div style="padding:16px;color:var(--sub);font-size:13px;text-align:center">프로젝트가 없습니다</div>';
}

function pSetStatusFilter(s){_pStatusFilter=s;renderProjects();if(_pActiveId)pOpenPost(_pActiveId);}

function pNewPost(){
  _pLoad();
  const post={id:_pNewId(),name:'',status:'대기',dueDate:'',assignees:[],icon:'🗃',cover:null,tags:[],createdAt:today(),updatedAt:today(),
    blocks:[{id:_pNewId(),type:'paragraph',content:''}]};
  _pPosts.unshift(post);_pSave();_pActiveId=post.id;renderProjects();pOpenPost(post.id);
}

function pDeletePost(id){
  if(!confirm('이 프로젝트를 삭제하시겠습니까?'))return;
  _pPosts=_pPosts.filter(x=>x.id!==id);
  if(_pActiveId===id)_pActiveId=null;
  _pSave();renderProjects();
}

function pOpenPost(id){
  _pActiveId=id;
  const post=_pPosts.find(x=>x.id===id);
  const el=document.getElementById('p-editor');if(!el)return;
  pRenderSb();
  if(!post){el.innerHTML='';return;}
  const coverHtml=post.cover?`<div style="width:100%;height:180px;background:url('${post.cover}') center/cover;border-radius:8px 8px 0 0;position:relative">
    <button class="btn btn-o btn-sm" style="position:absolute;top:8px;right:8px;background:rgba(255,255,255,.85)" onclick="pRemoveCover('${id}')">커버 삭제</button></div>`
    :`<div style="padding-top:24px;display:flex;gap:8px;align-items:center">
    <label class="btn-g" style="cursor:pointer;font-size:12px">📷 커버 추가<input type="file" style="display:none" accept="image/*" onchange="pLoadCover(event,'${id}')"></label></div>`;
  el.innerHTML=`<div style="max-width:760px;margin:0 auto;padding:0 24px 48px">
    ${coverHtml}
    <div style="display:flex;align-items:center;gap:8px;margin:16px 0 4px">
      <span style="font-size:36px;cursor:pointer" onclick="pPickIcon('${id}')">${post.icon||'🗃'}</span>
      <input class="board-title-input" placeholder="프로젝트 이름" value="${(post.name||'').replace(/"/g,'&quot;')}" oninput="pUpdateTitle('${id}',this.value)" style="flex:1">
      <button class="btn btn-d btn-sm" onclick="pDeletePost('${id}')">삭제</button>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding:10px 12px;background:var(--bg);border-radius:8px;border:1px solid var(--bd)">
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:12px;color:var(--sub)">상태</span>
        <select style="border:1px solid var(--bd);border-radius:6px;padding:3px 8px;font-size:12px;background:var(--card)" onchange="pUpdateStatus('${id}',this.value)">
          ${PRJ_STATUSES.map(s=>`<option value="${s}"${post.status===s?' selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:12px;color:var(--sub)">마감일</span>
        <input type="date" style="border:1px solid var(--bd);border-radius:6px;padding:3px 8px;font-size:12px;background:var(--card)" value="${post.dueDate||''}" onchange="pUpdateDue('${id}',this.value)">
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:12px;color:var(--sub)">담당자</span>
        <span style="font-size:12px">${(post.assignees||[]).join(', ')||'—'}</span>
        <button class="btn-g" style="font-size:11px" onclick="pEditAssignees('${id}')">편집</button>
      </div>
      <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap">
        ${(post.tags||[]).map(t=>`<span class="btag on">${t}<button onclick="pRemoveTag('${id}','${t.replace(/'/g,"\\'")}');event.stopPropagation()" style="background:none;border:none;cursor:pointer;color:#999;padding:0 0 0 2px;font-size:10px">×</button></span>`).join('')}
        <button class="btn-g" style="font-size:11px" onclick="pAddTag('${id}')">+ 태그</button>
      </div>
    </div>
    <div id="p-blocks">${pRenderBlocks(post.blocks,id)}</div>
    <div style="padding:4px 0 32px 32px"><button class="btn-g" style="font-size:13px;color:var(--sub)" onclick="pAddBlock(null,'${id}','paragraph')">+ 블록 추가</button></div>
  </div>`;
}

function pRenderBlocks(blocks,postId){
  return (blocks||[]).map(blk=>pBlockHtml(blk,postId)).join('');
}

function pBlockHtml(blk,postId){
  if(blk.type==='divider'){
    return `<div class="bk-wrap" data-id="${blk.id}" draggable="true" ondragstart="pDragStart(event,'${blk.id}')" ondragover="pDragOver(event,'${blk.id}')" ondrop="pDrop(event,'${blk.id}','${postId}')">
      <div class="bk-actions"><span class="bk-handle">⠿</span><span class="bk-add-btn" onclick="pAddBlock('${blk.id}','${postId}','paragraph')">+</span></div>
      <div class="bk-divider"></div>
      <button class="btn-g" style="font-size:11px;align-self:center" onclick="pDelBlock('${blk.id}','${postId}')">×</button></div>`;
  }
  if(blk.type==='image'){
    return `<div class="bk-wrap" data-id="${blk.id}" draggable="true" ondragstart="pDragStart(event,'${blk.id}')" ondragover="pDragOver(event,'${blk.id}')" ondrop="pDrop(event,'${blk.id}','${postId}')">
      <div class="bk-actions"><span class="bk-handle">⠿</span><span class="bk-add-btn" onclick="pAddBlock('${blk.id}','${postId}','paragraph')">+</span></div>
      <div style="width:100%">
        ${blk.imageData?`<img src="${blk.imageData}" style="max-width:100%;border-radius:6px;display:block">`
          :`<label style="display:flex;align-items:center;justify-content:center;height:120px;border:2px dashed var(--bd);border-radius:8px;cursor:pointer;color:var(--sub);font-size:13px;gap:8px">
            📷 이미지 업로드<input type="file" style="display:none" accept="image/*" onchange="pImgUpload(event,'${blk.id}','${postId}')"></label>`}
        <div style="display:flex;gap:6px;align-items:center;margin-top:4px">
          ${blk.imageData?`<label class="btn-g" style="cursor:pointer;font-size:11px">변경<input type="file" style="display:none" accept="image/*" onchange="pImgUpload(event,'${blk.id}','${postId}')"></label>`:''}
          <input style="flex:1;border:none;border-bottom:1px solid var(--bd);font-size:12px;color:var(--sub);background:transparent;outline:none" placeholder="캡션 입력..." value="${(blk.caption||'').replace(/"/g,'&quot;')}" onblur="pSaveCaption(event,'${blk.id}','${postId}')">
          <button class="btn-g" style="font-size:11px" onclick="pDelBlock('${blk.id}','${postId}')">×</button>
        </div>
      </div></div>`;
  }
  if(blk.type==='table'){
    if(!blk.tableData||!blk.tableData.length)blk.tableData=[['','',''],['','',''],['','','']];
    const rows=blk.tableData;
    const tRows=rows.map((row,ri)=>`<tr>${row.map((cell,ci)=>{
      const tag=ri===0?'th':'td';
      return `<${tag} contenteditable="true" onblur="pTblCell(event,'${blk.id}','${postId}',${ri},${ci})">${cell}</${tag}>`;
    }).join('')}</tr>`).join('');
    return `<div class="bk-wrap" data-id="${blk.id}" draggable="true" ondragstart="pDragStart(event,'${blk.id}')" ondragover="pDragOver(event,'${blk.id}')" ondrop="pDrop(event,'${blk.id}','${postId}')">
      <div class="bk-actions"><span class="bk-handle">⠿</span><span class="bk-add-btn" onclick="pAddBlock('${blk.id}','${postId}','paragraph')">+</span></div>
      <div style="overflow-x:auto;padding:2px 0">
        <table class="bk-table"><tbody>${tRows}</tbody></table>
        <div style="display:flex;gap:4px;margin-top:4px">
          <button class="btn-g" style="font-size:11px" onclick="pTblAddRow('${blk.id}','${postId}')">+ 행</button>
          <button class="btn-g" style="font-size:11px" onclick="pTblAddCol('${blk.id}','${postId}')">+ 열</button>
          <button class="btn-g" style="font-size:11px" onclick="pTblDelRow('${blk.id}','${postId}')">− 행</button>
          <button class="btn-g" style="font-size:11px" onclick="pTblDelCol('${blk.id}','${postId}')">− 열</button>
          <button class="btn-g" style="font-size:11px;margin-left:auto" onclick="pDelBlock('${blk.id}','${postId}')">×</button>
        </div>
      </div></div>`;
  }
  const ph={paragraph:'내용 입력... (/ 로 블록 변경)',heading1:'제목 1',heading2:'제목 2',heading3:'제목 3',bulletedList:'• 항목',numberedList:'1. 항목',toggle:'▶ 토글',quote:'인용구',code:'코드 입력'}[blk.type]||'';
  return `<div class="bk-wrap" data-id="${blk.id}" draggable="true" ondragstart="pDragStart(event,'${blk.id}')" ondragover="pDragOver(event,'${blk.id}')" ondrop="pDrop(event,'${blk.id}','${postId}')">
    <div class="bk-actions"><span class="bk-handle">⠿</span><span class="bk-add-btn" onclick="pShowAddMenu('${blk.id}','${postId}')">+</span></div>
    <div class="bk-content" data-type="${blk.type}" data-ph="${ph}" contenteditable="true"
      oninput="pContentInput(event,'${blk.id}','${postId}')"
      onkeydown="pKeydown(event,'${blk.id}','${postId}')"
      onmouseup="bSelChange()">${blk.content||''}</div></div>`;
}

let _pSlashId=null,_pSlashQ='',_pSlashSel=0;
const P_SLASH=[...B_SLASH,{type:'image',icon:'🖼',label:'이미지'}];

function pUpdateTitle(postId,val){
  const p=_pPosts.find(x=>x.id===postId);if(!p)return;
  p.name=val;p.updatedAt=today();_pSave();pRenderSb();
}
function pUpdateStatus(postId,val){
  const p=_pPosts.find(x=>x.id===postId);if(!p)return;
  p.status=val;p.updatedAt=today();_pSave();pRenderSb();
}
function pUpdateDue(postId,val){
  const p=_pPosts.find(x=>x.id===postId);if(!p)return;
  p.dueDate=val;p.updatedAt=today();_pSave();
}
function pEditAssignees(postId){
  const p=_pPosts.find(x=>x.id===postId);if(!p)return;
  const cur=(p.assignees||[]).join(', ');
  const v=prompt('담당자 (쉼표로 구분):',cur);
  if(v===null)return;
  p.assignees=v.split(',').map(s=>s.trim()).filter(Boolean);
  p.updatedAt=today();_pSave();pOpenPost(postId);
}
function pAddTag(postId){const t=prompt('태그 입력:');if(!t?.trim())return;const p=_pPosts.find(x=>x.id===postId);if(!p)return;if(!p.tags)p.tags=[];if(!p.tags.includes(t.trim()))p.tags.push(t.trim());_pSave();pOpenPost(postId);pRenderSb();}
function pRemoveTag(postId,tag){const p=_pPosts.find(x=>x.id===postId);if(!p)return;p.tags=(p.tags||[]).filter(t=>t!==tag);_pSave();pOpenPost(postId);pRenderSb();}
function pPickIcon(postId){const icons='🗃📁📂🚀🎯💡🔧📊📋🏆⭐🎨🔗📌📅💬🗂📐🔖';const i=prompt(`아이콘 (이모지):\n${icons}`)||'🗃';const p=_pPosts.find(x=>x.id===postId);if(!p)return;p.icon=[...i.trim()][0]||'🗃';_pSave();pOpenPost(postId);pRenderSb();}
function pLoadCover(e,postId){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{const p=_pPosts.find(x=>x.id===postId);if(!p)return;p.cover=ev.target.result;_pSave();pOpenPost(postId);};r.readAsDataURL(file);}
function pRemoveCover(postId){const p=_pPosts.find(x=>x.id===postId);if(!p)return;p.cover=null;_pSave();pOpenPost(postId);}
function pImgUpload(e,blkId,postId){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{const p=_pPosts.find(x=>x.id===postId);if(!p)return;const blk=p.blocks.find(x=>x.id===blkId);if(!blk)return;blk.imageData=ev.target.result;p.updatedAt=today();_pSave();const bEl=document.getElementById('p-blocks');if(bEl)bEl.innerHTML=pRenderBlocks(p.blocks,postId);};r.readAsDataURL(file);}
function pSaveCaption(e,blkId,postId){const p=_pPosts.find(x=>x.id===postId);if(!p)return;const blk=p.blocks.find(x=>x.id===blkId);if(!blk)return;blk.caption=e.target.value;p.updatedAt=today();_pSave();}

function pTblCell(e,blkId,postId,r,c){
  const p=_pPosts.find(x=>x.id===postId);if(!p)return;
  const blk=p.blocks.find(x=>x.id===blkId);if(!blk||!blk.tableData)return;
  blk.tableData[r][c]=e.target.innerHTML;p.updatedAt=today();_pSave();
}
function pTblAddRow(blkId,postId){const p=_pPosts.find(x=>x.id===postId);if(!p)return;const blk=p.blocks.find(x=>x.id===blkId);if(!blk||!blk.tableData)return;const cols=blk.tableData[0]?.length||3;blk.tableData.push(Array(cols).fill(''));p.updatedAt=today();_pSave();const bEl=document.getElementById('p-blocks');if(bEl)bEl.innerHTML=pRenderBlocks(p.blocks,postId);}
function pTblAddCol(blkId,postId){const p=_pPosts.find(x=>x.id===postId);if(!p)return;const blk=p.blocks.find(x=>x.id===blkId);if(!blk||!blk.tableData)return;blk.tableData.forEach(row=>row.push(''));p.updatedAt=today();_pSave();const bEl=document.getElementById('p-blocks');if(bEl)bEl.innerHTML=pRenderBlocks(p.blocks,postId);}
function pTblDelRow(blkId,postId){const p=_pPosts.find(x=>x.id===postId);if(!p)return;const blk=p.blocks.find(x=>x.id===blkId);if(!blk||!blk.tableData||blk.tableData.length<=1)return;blk.tableData.pop();p.updatedAt=today();_pSave();const bEl=document.getElementById('p-blocks');if(bEl)bEl.innerHTML=pRenderBlocks(p.blocks,postId);}
function pTblDelCol(blkId,postId){const p=_pPosts.find(x=>x.id===postId);if(!p)return;const blk=p.blocks.find(x=>x.id===blkId);if(!blk||!blk.tableData||blk.tableData[0]?.length<=1)return;blk.tableData.forEach(row=>row.pop());p.updatedAt=today();_pSave();const bEl=document.getElementById('p-blocks');if(bEl)bEl.innerHTML=pRenderBlocks(p.blocks,postId);}

function pContentInput(e,blkId,postId){
  const el=e.target;
  const p=_pPosts.find(x=>x.id===postId);if(!p)return;
  const blk=p.blocks.find(x=>x.id===blkId);if(!blk)return;
  const txt=el.innerText;
  if(txt==='/'||(_pSlashId===blkId&&txt.startsWith('/'))){
    if(txt==='/'){_pSlashId=blkId;_pSlashQ='';_pSlashSel=0;pShowSlash(el,postId);}
    else if(_pSlashId===blkId){_pSlashQ=txt.slice(1).toLowerCase();pUpdateSlash();}
    return;
  }
  if(_pSlashId)pHideSlash();
  blk.content=el.innerHTML;p.updatedAt=today();_pSave();
}
function pKeydown(e,blkId,postId){
  if(_pSlashId){
    if(e.key==='ArrowDown'){e.preventDefault();pSlashNav(1);return}
    if(e.key==='ArrowUp'){e.preventDefault();pSlashNav(-1);return}
    if(e.key==='Enter'){e.preventDefault();pSlashPick(blkId,postId);return}
    if(e.key==='Escape'){pHideSlash();return}
  }
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    const el=e.target;
    const p=_pPosts.find(x=>x.id===postId);if(!p)return;
    const blk=p.blocks.find(x=>x.id===blkId);if(!blk)return;
    blk.content=el.innerHTML;
    pInsertAfter(blkId,postId,'paragraph');return;
  }
  if(e.key==='Backspace'){
    const el=e.target;
    if(!el.innerText.trim()){e.preventDefault();pDelBlock(blkId,postId);}
  }
  if((e.ctrlKey||e.metaKey)){
    if(e.key==='b'){e.preventDefault();document.execCommand('bold');}
    else if(e.key==='i'){e.preventDefault();document.execCommand('italic');}
    else if(e.key==='u'){e.preventDefault();document.execCommand('underline');}
  }
}
function pInsertAfter(blkId,postId,type){
  const p=_pPosts.find(x=>x.id===postId);if(!p)return;
  const idx=p.blocks.findIndex(x=>x.id===blkId);
  const nb={id:_pNewId(),type,content:''};
  p.blocks.splice(idx+1,0,nb);p.updatedAt=today();_pSave();
  const bEl=document.getElementById('p-blocks');
  if(bEl)bEl.innerHTML=pRenderBlocks(p.blocks,postId);
  setTimeout(()=>{const ne=document.querySelector(`[data-id="${nb.id}"] .bk-content`);if(ne)ne.focus();},20);
}
function pDelBlock(blkId,postId){
  const p=_pPosts.find(x=>x.id===postId);if(!p)return;
  if(p.blocks.length<=1)return;
  const idx=p.blocks.findIndex(x=>x.id===blkId);
  p.blocks.splice(idx,1);p.updatedAt=today();_pSave();
  const bEl=document.getElementById('p-blocks');
  if(bEl)bEl.innerHTML=pRenderBlocks(p.blocks,postId);
  const pi=Math.max(0,idx-1);
  setTimeout(()=>{const pe=document.querySelector(`[data-id="${p.blocks[pi]?.id}"] .bk-content`);if(pe){pe.focus();const r=document.createRange();r.selectNodeContents(pe);r.collapse(false);const s=window.getSelection();s.removeAllRanges();s.addRange(r);}},20);
}
function pAddBlock(afterId,postId,type){
  if(afterId)pInsertAfter(afterId,postId,type);
  else{const p=_pPosts.find(x=>x.id===postId);if(!p)return;const nb={id:_pNewId(),type,content:''};p.blocks.push(nb);p.updatedAt=today();_pSave();const bEl=document.getElementById('p-blocks');if(bEl)bEl.innerHTML=pRenderBlocks(p.blocks,postId);setTimeout(()=>{const ne=document.querySelector(`[data-id="${nb.id}"] .bk-content`);if(ne)ne.focus();},20);}
}
function pChangeBlockType(blkId,postId,type){
  const p=_pPosts.find(x=>x.id===postId);if(!p)return;
  const blk=p.blocks.find(x=>x.id===blkId);if(!blk)return;
  blk.type=type;blk.content='';
  if(type==='table'&&!blk.tableData)blk.tableData=[['','',''],['','',''],['','','']];
  if(type==='image'){blk.imageData=null;blk.caption='';}
  p.updatedAt=today();_pSave();
  const bEl=document.getElementById('p-blocks');
  if(bEl)bEl.innerHTML=pRenderBlocks(p.blocks,postId);
  setTimeout(()=>{const ne=document.querySelector(`[data-id="${blkId}"] .bk-content`);if(ne)ne.focus();},20);
}
function pShowAddMenu(blkId,postId){
  const el=document.querySelector(`[data-id="${blkId}"] .bk-content`);
  if(el){_pSlashId=blkId;_pSlashQ='';_pSlashSel=0;pShowSlash(el,postId);}
}
function pShowSlash(el,postId){
  let m=document.getElementById('p-slash-menu');
  if(!m){m=document.createElement('div');m.id='p-slash-menu';m.className='slash-menu';document.body.appendChild(m);}
  m._postId=postId;
  const rect=el.getBoundingClientRect();
  m.style.top=(rect.bottom+2)+'px';m.style.left=rect.left+'px';m.style.display='block';
  pUpdateSlash();
}
function pUpdateSlash(){
  const m=document.getElementById('p-slash-menu');if(!m)return;
  const q=_pSlashQ;
  const items=P_SLASH.filter(x=>!q||x.label.includes(q)||x.type.includes(q));
  _pSlashSel=0;
  m.innerHTML=items.map((x,i)=>`<div class="slash-item${i===0?' sel':''}" data-type="${x.type}">
    <span style="width:28px;font-size:12px;font-weight:700;color:var(--sub);text-align:center">${x.icon}</span>${x.label}</div>`).join('');
  m.querySelectorAll('.slash-item').forEach(it=>it.addEventListener('mousedown',e=>{e.preventDefault();const bid=_pSlashId;const pid=m._postId;if(bid)pChangeBlockType(bid,pid,it.dataset.type);pHideSlash();}));
}
function pSlashNav(d){
  const m=document.getElementById('p-slash-menu');if(!m)return;
  const items=m.querySelectorAll('.slash-item');
  items[_pSlashSel]?.classList.remove('sel');
  _pSlashSel=Math.max(0,Math.min(items.length-1,_pSlashSel+d));
  items[_pSlashSel]?.classList.add('sel');
  items[_pSlashSel]?.scrollIntoView({block:'nearest'});
}
function pSlashPick(blkId,postId){
  const m=document.getElementById('p-slash-menu');if(!m)return;
  const sel=m.querySelector('.slash-item.sel');
  if(sel)pChangeBlockType(blkId,postId,sel.dataset.type);
  pHideSlash();
}
function pHideSlash(){_pSlashId=null;_pSlashQ='';const m=document.getElementById('p-slash-menu');if(m)m.style.display='none';}

let _pDragIdV=null;
function pDragStart(e,id){_pDragIdV=id;e.dataTransfer.effectAllowed='move';setTimeout(()=>e.target.style.opacity='.4',0);}
function pDragOver(e,id){e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('.bk-wrap').forEach(el=>el.style.borderTop='');if(id!==_pDragIdV){const el=document.querySelector(`[data-id="${id}"]`);if(el)el.style.borderTop='2px solid var(--ac)';}}
function pDrop(e,targetId,postId){
  e.preventDefault();
  document.querySelectorAll('.bk-wrap').forEach(el=>{el.style.borderTop='';el.style.opacity='1';});
  if(!_pDragIdV||_pDragIdV===targetId)return;
  const p=_pPosts.find(x=>x.id===postId);if(!p)return;
  const fi=p.blocks.findIndex(x=>x.id===_pDragIdV);
  const ti=p.blocks.findIndex(x=>x.id===targetId);
  if(fi<0||ti<0)return;
  const [moved]=p.blocks.splice(fi,1);
  p.blocks.splice(ti,0,moved);
  p.updatedAt=today();_pSave();
  const bEl=document.getElementById('p-blocks');if(bEl)bEl.innerHTML=pRenderBlocks(p.blocks,postId);
  _pDragIdV=null;
}

document.addEventListener('click',e=>{
  if(!e.target.closest('#p-slash-menu')&&!e.target.closest('.bk-content')&&!e.target.closest('.bk-add-btn'))pHideSlash();
});

// ─── MODAL SYSTEM ─────────────────────────────────
function showModal(html,size){
  const overlay=document.getElementById('modal');
  const box=document.getElementById('modal-box');
  box.className='mo-box'+(size==='lg'?' lg':size==='sm'?' sm':size==='xl'?' xl':'');
  box.innerHTML=html;
  overlay.style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';saveAppData();}
function modalBgClick(e){if(e.target===document.getElementById('modal'))closeModal()}

// ─── DATA PERSISTENCE ──────────────────────────────
const PERSIST_KEYS=['events','etypes','employees','interns','internSchedules','internSchedHistory','internTimetable','notices','workLogs','workIssues','nid'];
function saveAppData(){
  const d={};PERSIST_KEYS.forEach(k=>{d[k]=S[k]});
  try{localStorage.setItem('nds_data',JSON.stringify(d));}catch{}
}
function loadAppData(){
  try{
    const raw=localStorage.getItem('nds_data');
    if(!raw)return;
    const d=JSON.parse(raw);
    PERSIST_KEYS.forEach(k=>{if(d[k]!==undefined)S[k]=d[k]});
  }catch{localStorage.removeItem('nds_data');}
}

// ─── INIT ──────────────────────────────────────────
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
(function(){
  loadAppData();
  window.addEventListener('beforeunload',saveAppData);
  setInterval(saveAppData,10000);
  try{const u=sessionStorage.getItem('nds_user');if(u){S.user=JSON.parse(u);startApp();}}catch{sessionStorage.removeItem('nds_user');}
})();
</script>
