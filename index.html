<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NDS 인트라넷</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F7F6F3;
  --card:#FFFFFF;
  --sb:#F7F6F3;
  --bd:#E8E6E1;
  --bd2:#EEECE8;
  --ac:#3D3A34;
  --ac-hover:#2C2A26;
  --gr:#2E6845;
  --or:#8C4E1A;
  --re:#B03025;
  --tx:#2E2C28;
  --sub:#A09D98;
  --sub2:#C9C6C0;
  --hover:#ECEAE5;
  --sel:#E5E2DB;
  --sw:220px;
  /* 디자인 토큰: 페이지마다 제각각이던 radius/shadow/spacing 값을 여기 몇 가지로 통일 */
  --r-sm:6px;
  --r-md:10px;
  --r-lg:14px;
  --sh-sm:0 1px 2px rgba(23,20,14,.04);
  --sh-md:0 4px 16px rgba(23,20,14,.06);
  --sh-lg:0 16px 40px rgba(23,20,14,.10);
}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;letter-spacing:0.01em;font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
@keyframes spinLoader{to{transform:rotate(360deg)}}
input,textarea,select{font-family:inherit;outline:none;border:1px solid var(--bd);border-radius:var(--r-sm);padding:8px 11px;width:100%;font-size:13.5px;color:var(--tx);background:#fff;transition:border-color .15s;letter-spacing:0.01em}
input:focus,textarea:focus,select:focus{border-color:var(--sub);box-shadow:none}
#login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.lbox{background:var(--card);padding:44px 40px;border-radius:var(--r-lg);width:360px;border:1px solid var(--bd);box-shadow:var(--sh-md)}
.lbox h1{font-size:21px;font-weight:700;margin-bottom:4px;color:var(--tx);letter-spacing:-0.01em}
.lbox p{color:var(--sub);font-size:13px;margin-bottom:28px}
.lbox .lf{margin-bottom:14px}
.lbox label{display:block;font-size:12px;font-weight:500;margin-bottom:5px;color:var(--sub)}
.lbtn{width:100%;padding:11px;background:var(--ac);color:#fff;border-radius:var(--r-sm);font-size:13.5px;font-weight:600;margin-top:8px;transition:background .15s;letter-spacing:.01em}
.lbtn:hover{background:var(--ac-hover)}
.lerr{color:var(--re);font-size:12px;margin-top:10px;display:none}
#app{display:none;min-height:100vh}
#sb{position:fixed;top:0;left:0;width:var(--sw);height:100vh;background:var(--sb);border-right:1px solid var(--bd);display:flex;flex-direction:column;z-index:100;overflow:visible}
#sb-resizer{position:absolute;right:-3px;top:0;width:6px;height:100%;cursor:col-resize;z-index:101;background:transparent;transition:background .12s}
#sb-resizer:hover,#sb-resizer.dragging{background:var(--ac);opacity:.12}
.sb-logo{padding:18px 14px 14px;flex-shrink:0}
.sb-logo span{font-size:17px;font-weight:700;color:var(--tx);line-height:1.4;letter-spacing:.01em}
.sb-nav{flex:1;overflow-y:auto;padding:2px 0 10px}
.nav-sec-title{font-size:10px;font-weight:600;color:var(--sub2);padding:14px 14px 4px;letter-spacing:.08em;text-transform:uppercase}
.nv{display:flex;align-items:center;gap:9px;padding:8px 12px;margin:1px 6px;font-size:14.5px;font-weight:500;cursor:pointer;transition:background .1s;border-radius:6px;color:var(--tx)}
.nv:hover{background:var(--hover)}
.nv.active{background:var(--sel);color:var(--tx);font-weight:600}
.nv-sub{display:flex;align-items:center;padding:6px 10px 6px 32px;margin:0 6px;font-size:13.5px;font-weight:400;cursor:pointer;color:var(--sub);border-radius:6px;transition:background .1s}
.nv-sub:hover{background:var(--hover);color:var(--tx)}
.nv-sub.active{background:var(--sel);color:var(--tx);font-weight:500}
.nv svg{width:16px;height:16px;flex-shrink:0;opacity:.45}
.nv.active svg{opacity:.7}
.nv-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.nv-label-input{outline:none}
.sb-foot{padding:12px 14px;border-top:1px solid var(--bd);flex-shrink:0}
.uinfo .uname{font-size:13px;font-weight:500}
.uinfo .urole{font-size:11.5px;color:var(--sub);margin-top:2px}
.lout-btn{width:100%;margin-top:10px;padding:7px;background:transparent;border:1px solid var(--bd);border-radius:var(--r-sm);font-size:12px;color:var(--sub);transition:all .15s}
.lout-btn:hover{background:var(--hover);color:var(--re);border-color:var(--re)}
#main{margin-left:var(--sw);min-height:100vh;display:flex;flex-direction:column}
#topbar{background:transparent;border-bottom:none;padding:20px 32px 8px;display:flex;align-items:center;justify-content:space-between}
#topbar h2{font-size:20px;font-weight:700;color:var(--tx);letter-spacing:-0.01em}
#topbar .tdate{font-size:12.5px;color:var(--sub)}
#content{padding:20px 32px 32px;flex:1}
.page{display:none}
.page.active{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r-md);padding:20px 22px}
.ctitle{font-size:11px;font-weight:600;margin-bottom:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.08em}
.btn{padding:7px 14px;border-radius:var(--r-sm);font-size:12.5px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .12s;display:inline-flex;align-items:center;gap:5px;letter-spacing:.01em}
.btn-p{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn-p:hover{background:var(--ac-hover);border-color:var(--ac-hover)}
.btn-o{background:#fff;border-color:var(--bd);color:var(--tx)}
.btn-o:hover{background:var(--hover);border-color:var(--sub2)}
.btn-d{background:#fff;border-color:var(--bd);color:var(--re)}
.btn-d:hover{background:#FDF1F0;border-color:var(--re)}
.btn-sm{padding:4px 10px;font-size:11.5px;border-radius:var(--r-sm)}
.btn-g{background:transparent;border:none;color:var(--sub);padding:3px 7px;font-size:12px;border-radius:var(--r-sm)}
.btn-g:hover{color:var(--tx);background:var(--hover)}
.chip{display:inline-block;padding:3px 9px;border-radius:var(--r-sm);font-size:11px;font-weight:500;letter-spacing:.01em;white-space:nowrap}
.ch-p{background:#EEEDFB;color:#5755C9}
.ch-g{background:#EAF4EE;color:var(--gr)}
.ch-o{background:#FDF0E6;color:var(--or)}
.ch-r{background:#FDEFEE;color:var(--re)}
.ch-gray{background:var(--hover);color:var(--sub)}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:left;font-size:13px;border-bottom:1px solid var(--bd)}
th{font-weight:500;color:var(--sub);background:transparent;white-space:nowrap;font-size:11.5px;letter-spacing:.02em}
td{background:#fff}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--hover)}
.mo{position:fixed;inset:0;background:rgba(20,18,14,.32);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.mo-box{background:#fff;border-radius:var(--r-lg);width:100%;max-width:520px;box-shadow:var(--sh-lg);max-height:92vh;overflow-y:auto}
.mo-box.lg{max-width:720px}
.mo-box.sm{max-width:380px}
.mo-box.xl{max-width:860px}
.mo-hd{padding:22px 24px 0;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1;padding-bottom:16px;border-bottom:1px solid var(--bd)}
.mo-hd h3{font-size:16.5px;font-weight:700;color:var(--tx);letter-spacing:-0.01em}
.mo-cl{background:none;border:none;font-size:18px;color:var(--sub2);cursor:pointer;line-height:1;padding:4px 7px;border-radius:var(--r-sm);transition:background .1s}
.mo-cl:hover{background:var(--hover);color:var(--sub)}
.mo-bd{padding:20px 24px}
.mo-ft{padding:0 24px 20px;display:flex;gap:8px;justify-content:flex-end}
.fr{margin-bottom:12px}
.fr label{display:block;font-size:12px;font-weight:500;margin-bottom:4px;color:var(--sub)}
.fr-row{display:flex;gap:10px}
.fr-row>*{flex:1}
.cal-hd{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.cal-hd-title{font-size:14px;font-weight:600;flex:1;text-align:left;display:flex;align-items:center;min-width:120px}
.cal-hd-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.cal-nav{background:none;border:1px solid var(--bd);border-radius:var(--r-sm);width:29px;height:29px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--sub);transition:background .1s}
.cal-nav:hover{background:var(--hover)}
.cal-nav-sm{width:18px;height:18px;font-size:10px}
.cal-grid-outer{border:1px solid var(--bd);border-radius:var(--r-md);overflow:hidden;transform:translateZ(0)}
.cal-header-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--bd);background:var(--sb)}
.cal-dn{padding:5px;text-align:center;font-size:11.5px;font-weight:500;color:var(--sub)}
.cal-week{border-bottom:1px solid var(--bd)}
.cal-week:last-child{border-bottom:none}
.cal-cells{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:46px}
.cal-cell{background:var(--card);overflow:hidden;padding:4px;cursor:pointer;position:relative;border-right:1px solid var(--bd)}
.cal-cells .cal-cell:last-child{border-right:none}
.cal-cell:hover{background:var(--hover)}
.cal-cell.om{opacity:.45}
.cal-cell.td{background:#ECEAE5}
/* 이벤트 레이어: 날짜 셀과 동일한 7열 grid + border로 세로선을 그려 항상 정렬이 맞도록 함 */
.cal-evlayer{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));height:88px;overflow:hidden;position:relative}
.cal-evcol{border-right:1px solid var(--bd);background:var(--card)}
.cal-evlayer .cal-evcol:nth-child(7){border-right:none}
/* 프로젝트 전용 캘린더처럼 좁은 공간에 여러 달을 나란히 보여줄 때 쓰는 축소판 */
.cal-compact .cal-cells{grid-auto-rows:20px}
.cal-compact .cal-evlayer{height:32px}
.cal-compact .dnum{font-size:10.5px}
.cal-compact .cal-dn{padding:2px;font-size:10px}
.cal-compact .cal-cell{padding:2px}
.board-wrap{display:flex;height:calc(100vh - 108px);background:var(--card);border:1px solid var(--bd);border-radius:var(--r-md);overflow:hidden}
.board-sb{width:240px;border-right:1px solid var(--bd);display:flex;flex-direction:column;background:var(--sb);flex-shrink:0}
.board-sb-hd{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.board-list-wrap{flex:1;overflow-y:auto;padding:4px 0}
.board-li{padding:7px 12px;cursor:pointer;transition:background .08s}
.board-li:hover{background:var(--sel)}
.board-li.active{background:var(--sel)}
.board-li-title{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)}
.board-li.active .board-li-title{font-weight:600}
.board-li-meta{font-size:11px;color:var(--sub);margin-top:2px}
.board-editor-area{flex:1;overflow-y:auto;padding:40px 56px}
.board-title-input{font-size:28px;font-weight:700;border:none;outline:none;width:100%;color:var(--tx);background:transparent;padding:4px 0;font-family:inherit}
.board-title-input::placeholder{color:var(--sub2)}
.bk-wrap{position:relative;display:flex;align-items:flex-start;gap:0;margin:1px 0;padding-left:32px}
.bk-wrap:hover .bk-actions{opacity:1}
.bk-actions{position:absolute;left:0;top:3px;display:flex;gap:1px;opacity:0;transition:opacity .12s;z-index:10}
.bk-handle{width:15px;font-size:11px;color:var(--sub2);cursor:grab;padding:2px 1px;user-select:none;display:flex;align-items:center;justify-content:center}
.bk-add-btn{width:15px;font-size:14px;color:var(--sub2);cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.bk-add-btn:hover{color:var(--sub)}
.bk-content{flex:1;outline:none;min-height:1.5em;padding:2px 4px;border-radius:3px;line-height:1.7;font-size:15px;word-break:break-word;color:var(--tx)}
.bk-content:empty::before{content:attr(data-ph);color:var(--sub2);pointer-events:none}
.bk-content[data-type=heading1]{font-size:26px;font-weight:700;line-height:1.25}
.bk-content[data-type=heading2]{font-size:22px;font-weight:700;line-height:1.25}
.bk-content[data-type=heading3]{font-size:18px;font-weight:600;line-height:1.3}
.bk-content[data-type=quote]{border-left:2px solid var(--sub2);padding-left:14px;color:var(--sub)}
.bk-content[data-type=code]{font-family:monospace;background:var(--hover);padding:10px 14px;border-radius:6px;font-size:13px;white-space:pre-wrap}
.bk-divider{flex:1;height:1px;background:var(--bd);margin:10px 0;align-self:center}
.slash-menu{position:fixed;background:#fff;border:1px solid var(--bd);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.08);z-index:3000;min-width:200px;max-height:280px;overflow-y:auto;display:none}
.mini-cal{position:fixed;background:#fff;border:1px solid var(--bd);border-radius:var(--r-md);box-shadow:var(--sh-lg);z-index:3500;padding:14px;width:248px;display:none}
.mini-cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mini-cal-nav{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border:none;background:none;color:var(--sub);font-size:13px;cursor:pointer;border-radius:6px;padding:0;transition:background .12s,color .12s}
.mini-cal-nav:hover{background:var(--hover);color:var(--tx)}
.mini-cal-title{font-size:13.5px;font-weight:700;color:var(--tx);cursor:pointer;padding:2px 8px;border-radius:6px;transition:background .12s}
.mini-cal-title:hover{background:var(--hover)}
.mini-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mini-cal-dn{font-size:10.5px;font-weight:600;color:var(--sub2);text-align:center;padding:3px 0 6px}
.mini-cal-dn.sun{color:#D08A85}
.mini-cal-dn.sat{color:#7FA3C4}
.mini-cal-day{font-size:12.5px;text-align:center;padding:6px 0;border-radius:8px;cursor:pointer;color:var(--tx);transition:background .1s}
.mini-cal-day:hover{background:var(--hover)}
.mini-cal-day.om{color:var(--sub2)}
.mini-cal-day.sel{background:var(--ac);color:#fff;font-weight:700}
.mini-cal-day.td:not(.sel){color:var(--ac);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--ac)}
.mini-ym-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mini-ym-cell{font-size:13px;text-align:center;padding:11px 0;border-radius:8px;cursor:pointer;color:var(--tx);font-weight:500;transition:background .1s}
.mini-ym-cell:hover{background:var(--hover)}
.mini-ym-cell.sel{background:var(--ac);color:#fff;font-weight:700}
.mini-ym-cell.td:not(.sel){color:var(--ac);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--ac)}
.slash-item{padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px}
.slash-item:hover,.slash-item.sel{background:var(--hover)}
.fmt-toolbar{position:fixed;background:#37352F;border-radius:5px;padding:3px 5px;display:none;gap:2px;z-index:3001;box-shadow:0 3px 10px rgba(55,53,47,.25);align-items:center}
.fmt-btn{background:none;border:none;color:#fff;padding:3px 8px;border-radius:3px;cursor:pointer;font-size:12px;font-weight:600}
.fmt-btn:hover{background:rgba(255,255,255,.15)}
.board-search-box{padding:7px 10px;border-bottom:1px solid var(--bd)}
.board-search-box input{background:var(--hover);border:1px solid var(--bd);border-radius:6px;font-size:12px;padding:5px 9px;width:100%;outline:none}
.board-tags-row{padding:5px 10px;display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--bd)}
.bcat-section{border-bottom:1px solid var(--bd);padding:4px 0}
.bcat-all{display:flex;align-items:center;gap:6px;padding:6px 14px;cursor:pointer;font-size:13px;font-weight:500;color:var(--sub);transition:background .08s}
.bcat-all:hover,.bcat-all.on{background:var(--sel);color:var(--tx)}
.bcat-row{display:flex;align-items:center;padding:5px 10px 5px 14px;cursor:pointer;font-size:13px;font-weight:500;color:var(--tx);transition:background .08s}
.bcat-row:hover{background:var(--hover)}
.bcat-row.on{background:var(--sel)}
.bcat-arrow{font-size:9px;color:var(--sub2);width:12px;flex-shrink:0;transition:transform .12s}
.bcat-name{flex:1}
.bcat-del{font-size:14px;color:var(--sub2);padding:0 4px;line-height:1;opacity:0;transition:opacity .1s}
.bcat-row:hover .bcat-del{opacity:1}
.bcat-del:hover{color:var(--re)}
.bcat-posts{padding-left:12px}
.bcat-add{padding:6px 14px;font-size:12px;color:var(--sub);cursor:pointer;display:flex;align-items:center;gap:4px}
.bcat-add:hover{color:var(--tx)}
.bcat-select{font-size:12px;border:1px solid var(--bd);border-radius:var(--r-sm);padding:2px 6px;background:#fff;color:var(--sub);margin-top:4px;width:100%}
.btag{padding:3px 10px;border-radius:var(--r-sm);font-size:11px;background:var(--hover);color:var(--sub);cursor:pointer;border:1px solid var(--bd);transition:all .12s}
.btag.on{background:var(--ac);color:#fff;border-color:var(--ac);opacity:.9}
.bk-table{width:100%;border-collapse:collapse;font-size:14px;margin:2px 0}
.bk-table td,.bk-table th{border:1px solid var(--bd);padding:6px 10px;min-width:64px;vertical-align:top;outline:none}
.bk-table th{background:var(--hover);font-weight:600}
.bk-table td:focus{background:#F5F4F0}
.prj-status{padding:3px 10px;border-radius:var(--r-sm);font-size:11.5px;font-weight:500;display:inline-block}
.ps-진행중{background:#EEF6F1;color:var(--gr)}.ps-완료{background:#F0EFFC;color:#5B5BD6}
.ps-대기{background:#FEF5E9;color:var(--or)}.ps-보류{background:#FEF0EF;color:var(--re)}
.dnum{font-size:12.5px;font-weight:600;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:2px}
.cal-cell.td .dnum{background:var(--ac);color:#fff}
.cal-cell.sun .dnum{color:var(--re)}
.cal-cell.sat .dnum{color:#3366AA}
.cal-hol{font-size:10px;color:#E24B4A;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px}
.cal-ev{font-size:11.5px;font-weight:500;padding:1px 5px;border-radius:2px;margin-bottom:1px;overflow:hidden;word-break:break-word;white-space:normal;cursor:pointer}
.ev-행사{background:#F0EFFC;color:#5B5BD6}
.ev-미팅{background:#EEF6F1;color:var(--gr)}
.ev-외근{background:#FEF5E9;color:var(--or)}
.ev-휴가{background:#FEF0EF;color:var(--re)}
.ev-공휴일{background:#FEF0EF;color:var(--re)}
.ev-미정{background:#F2F1EE;color:#6B6862}
.dash-grid{display:grid;grid-template-columns:1fr 300px;gap:20px}
.right-col{display:flex;flex-direction:column;gap:14px}
.board-item{padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.board-item:last-child{border-bottom:none}
.board-item:hover .bi-title{color:var(--ac)}
.bi-title{font-size:13.5px;font-weight:500;margin-bottom:3px}
.bi-meta{font-size:12px;color:var(--sub)}
.emp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
/* 인턴 목록: PC는 테이블, 모바일은 카드뷰 (미디어쿼리에서 전환) */
.intern-card-view{display:none}
.intern-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r-md);padding:14px;margin-bottom:10px}
.intern-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.intern-card-name{color:var(--tx);font-weight:600;font-size:15px;text-decoration:none}
.intern-card-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--sub);margin-bottom:10px}
.intern-card-actions{display:flex;flex-wrap:wrap;gap:6px}
.st-table{width:100%;border-collapse:collapse;table-layout:fixed}
/* 수업시간표/근무스케줄 등 격자형 테이블 공통 스타일 */

// 게시판/프로젝트 글을 '보기 모드'로 보여줄 때, 본문 안의 URL(http://, https://, www.로 시작하는 텍스트)을
// 자동으로 클릭 가능한 링크로 바꿔줌. 이미 <a> 태그로 되어있는 부분은 건드리지 않도록 텍스트 노드만 순회함.
function linkifyHtml(html){
  if(!html)return html;
  const div=document.createElement('div');
  div.innerHTML=html;
  const urlRe=/((https?:\/\/|www\.)[^\s<]+)/gi;
  function walk(node){
    if(node.nodeType===3){
      const text=node.textContent;
      urlRe.lastIndex=0;
      if(!urlRe.test(text))return;
      urlRe.lastIndex=0;
      const frag=document.createDocumentFragment();
      let lastIdx=0,m;
      while((m=urlRe.exec(text))){
        if(m.index>lastIdx)frag.appendChild(document.createTextNode(text.slice(lastIdx,m.index)));
        const url=m[0];
        const href=url.startsWith('http')?url:'https://'+url;
        const a=document.createElement('a');
        a.href=href;a.target='_blank';a.rel='noopener';
        a.style.color='inherit';a.style.textDecoration='underline';
        a.textContent=url;
        frag.appendChild(a);
        lastIdx=m.index+url.length;
      }
      if(lastIdx<text.length)frag.appendChild(document.createTextNode(text.slice(lastIdx)));
      node.parentNode.replaceChild(frag,node);
    } else if(node.nodeType===1&&node.tagName!=='A'){
      Array.from(node.childNodes).forEach(walk);
    }
  }
  Array.from(div.childNodes).forEach(walk);
  return div.innerHTML;
}
function esc(str){
  const div=document.createElement('div');
  div.textContent=str==null?'':String(str);
  return div.innerHTML;
}

async function fetchUserProfile(uid){
  const doc = await window._db.collection('users').doc(uid).get();
  if(!doc.exists) return null;
  const d = doc.data();
  return {name:d.name, role:d.role, uid};
}

function doLogin(){
  const id=document.getElementById('id-input').value.trim();
  const pw=document.getElementById('pw-input').value;
  const err=document.getElementById('lerr');
  err.style.display='none';
  if(!id||!pw){
    err.textContent='아이디와 비밀번호를 입력해주세요.';
    err.style.display='block';
    return;
  }
  const email = id + '@nds-login.local';
  firebase.auth().signInWithEmailAndPassword(email, pw)
    .then(async (cred)=>{
      await loadAppData();
      const profile = await fetchUserProfile(cred.user.uid);
      if(!profile){
        err.textContent='사용자 정보를 찾을 수 없습니다. 관리자에게 문의하세요.';
        err.style.display='block';
        firebase.auth().signOut();
        return;
      }
      if(profile.role==='intern'){
        // 인턴 공용 계정이므로, 실제 작성자 이름을 별도로 선택받음
        showInternNamePicker();
      } else {
        S.user = profile;
        sessionStorage.setItem('nds_user',JSON.stringify(S.user));
        startApp();
      }
    })
    .catch(e=>{
      console.warn('로그인 실패:',e);
      err.textContent='아이디 또는 비밀번호가 올바르지 않습니다.';
      err.style.display='block';
    });
}

const HOL_KEY='fbcc88a6bd5c51ff9615e71d4c178d55789d6b464ca8ef1c92a181075c7437a8';
const HOL_BASE='https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getRestDeInfo';
const HOL_PROXY='https://cors-anywhere.herokuapp.com/'+HOL_BASE;

async function fetchHolidays(y,m){
  const ym=`${y}-${p2(m)}`;
  if(S.holidayCache[ym]!==undefined)return;
  S.holidayCache[ym]=null;
  const params=`serviceKey=${HOL_KEY}&solYear=${y}&solMonth=${p2(m)}&numOfRows=50&_type=json`;
  const tryFetch=async(base)=>{
    const r=await fetch(`${base}?${params}`,{signal:AbortSignal.timeout(8000)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  };
  const parse=(data)=>{
    const raw=data?.response?.body?.items?.item;
    if(!raw)return{};
    const arr=Array.isArray(raw)?raw:[raw];
    const out={};
    arr.forEach(item=>{
      if(item.isHoliday==='Y'){
        const ds=String(item.locdate);
        out[`${ds.slice(0,4)}-${ds.slice(4,6)}-${ds.slice(6,8)}`]=item.dateName;
      }
    });
    return out;
  };
  try{
    const data=await tryFetch(HOL_BASE);
    S.holidayCache[ym]=parse(data);
    S.holidayFallback=false;
  }catch(e1){
    try{
      const data=await tryFetch(HOL_PROXY);
      S.holidayCache[ym]=parse(data);
      S.holidayFallback=false;
    }catch(e2){
      const fb={};
      Object.entries(HOLIDAYS_FALLBACK).forEach(([k,v])=>{if(k.startsWith(ym))fb[k]=v});
      S.holidayCache[ym]=fb;
      S.holidayFallback=true;
    }
  }
  if(S.cal.getFullYear()===y&&S.cal.getMonth()+1===m){
    if(S.page==='home')renderHome();
    else if(S.page==='schedule')renderSchedulePage();
  }
  if(S.page==='projects'&&_pActiveId&&_pCalBase){
    // 프로젝트 캘린더가 지금 보여주는 3개월 범위 안에 이 공휴일 데이터의 달이 포함되면 다시 그림
    for(let i=0;i<3;i++){
      const md=new Date(_pCalBase.getFullYear(),_pCalBase.getMonth()+i,1);
      if(md.getFullYear()===y&&md.getMonth()+1===m){pCalRenderAll(_pActiveId);break;}
    }
  }
}

function getHolidayForDay(dateStr){
  const ym=dateStr.slice(0,7);
  const cache=S.holidayCache[ym];
  if(cache==null)return HOLIDAYS_FALLBACK[dateStr]||null;
  return cache[dateStr]||null;
}

// 한 달치 캘린더 그리드(날짜 칸 + 연속일정 막대)를 만드는 공용 함수.
// 메인 일정관리와 프로젝트 전용 캘린더가 이 함수를 공유해서 똑같은 모양을 유지함.
// dayClickFn(dateStr), eventClickFn(eventId)는 각각 "그 자리에 넣을 onclick JS 문자열"을 돌려줘야 함.
function buildMonthGridHtml(events,month,dayClickFn,eventClickFn,compact){
  const y=month.getFullYear(),m=month.getMonth();
  const first=new Date(y,m,1).getDay();
  const days=getDaysInMonth(y,m);
  const todayStr=today();
  const prevDays=getDaysInMonth(y,m-1);
  const allDays=[];
  for(let i=first;i>0;i--){const d=prevDays-i+1;const pm=m===0?11:m-1,py=m===0?y-1:y;allDays.push({ds:`${py}-${p2(pm+1)}-${p2(d)}`,d,pad:true});}
  for(let d=1;d<=days;d++)allDays.push({ds:`${y}-${p2(m+1)}-${p2(d)}`,d,pad:false});
  const rem=(7-allDays.length%7)%7;
  for(let i=1;i<=rem;i++){const nm=m===11?0:m+1,ny=m===11?y+1:y;allDays.push({ds:`${ny}-${p2(nm+1)}-${p2(i)}`,d:i,pad:true});}
  const weeks=[];for(let i=0;i<allDays.length;i+=7)weeks.push(allDays.slice(i,i+7));
  const multiEvs=events.filter(e=>e.start!==e.end);
  let html=`<div class="cal-grid-outer${compact?' cal-compact':''}">`;
  html+=`<div class="cal-header-row">`;
  ['일','월','화','수','목','금','토'].forEach(d=>html+=`<div class="cal-dn">${d}</div>`);
  html+=`</div>`;
  weeks.forEach((week,wi)=>{
    html+=`<div class="cal-week${wi===weeks.length-1?' cal-week-last':''}">`;
    const wS=week[0].ds,wE=week[6].ds;
    html+=`<div class="cal-cells">`;
    week.forEach((day,di)=>{
      const{ds,d,pad}=day;
      const hol=compact?null:getHolidayForDay(ds); // 축소 모드에서는 공간이 없어 공휴일 문구는 생략
      const isRed=!pad&&(hol||di===0);
      const isSat=!pad&&di===6;
      let cls=pad?' om':'';
      if(ds===todayStr)cls+=' td';
      if(di===0)cls+=' sun';
      if(di===6)cls+=' sat';
      const dnStyle=pad?'':(isRed?'color:#E24B4A':isSat?'color:#3366AA':'');
      const holHtml=hol&&!pad?`<div class="cal-hol">${hol}</div>`:'';
      html+=`<div class="cal-cell${cls}" onclick="${dayClickFn(ds)}"><div class="dnum" style="${dnStyle}">${d}</div>${holHtml}</div>`;
    });
    html+=`</div>`;
    const wEvs=[];
    multiEvs.filter(e=>e.start<=wE&&e.end>=wS).forEach(e=>{
      const vs=e.start<wS?wS:e.start;
      const ve=e.end>wE?wE:e.end;
      const cs=week.findIndex(d=>d.ds===vs);
      const ce=week.findIndex(d=>d.ds===ve);
      if(cs>=0&&ce>=0)wEvs.push({e,cs,ce,isMulti:true});
    });
    week.forEach((day,di)=>{
      events.filter(ev=>ev.start===ev.end&&ev.start===day.ds).forEach(e=>{
        wEvs.push({e,cs:di,ce:di,isMulti:false});
      });
    });
    wEvs.sort((a,b)=>{
      const aL=a.ce-a.cs,bL=b.ce-b.cs;
      if(bL!==aL)return bL-aL;
      return a.e.start.localeCompare(b.e.start);
    });
    const laneGrid=[];
    const assigned=wEvs.map(ev=>{
      let lane=0;
      while(true){
        if(!laneGrid[lane])laneGrid[lane]=new Set();
        let ok=true;
        for(let c=ev.cs;c<=ev.ce;c++){if(laneGrid[lane].has(c)){ok=false;break;}}
        if(ok){for(let c=ev.cs;c<=ev.ce;c++)laneGrid[lane].add(c);break;}
        lane++;
      }
      return{...ev,lane};
    });
    html+=`<div class="cal-evlayer">`;
    for(let ci=0;ci<7;ci++)html+=`<div class="cal-evcol"></div>`;
    const colW=100/7;
    const rowH=compact?15:22;
    const barH=compact?13:20;
    const barFont=compact?9.5:11;
    const evLabel=e=>{
      const typePart=e.type?`[${esc(e.type)}] `:'';
      const timePart=(!compact&&e.time&&e.startTime)?`<span style="font-size:9px;opacity:.7;flex-shrink:0;margin-left:3px">${esc(e.startTime)}</span>`:'';
      return `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">${typePart}${esc(e.title)}</span>${timePart}`;
    };
    assigned.forEach(({e,cs,ce,lane,isMulti})=>{
      const left=colW*cs;
      const width=colW*(ce-cs+1);
      const top=lane*rowH+2;
      const clickJs=eventClickFn(e.id);
      if(isMulti){
        const isFirst=e.start>=wS,isLast=e.end<=wE;
        const r=isFirst&&isLast?'4px':isFirst?'4px 0 0 4px':isLast?'0 4px 4px 0':'0';
        const ml=isFirst?2:0,mr=isLast?2:0;
        html+=`<div class="cal-ev ev-${e.type||'미정'}" style="${etypeInlineStyle(e.type)}position:absolute;top:${top}px;left:calc(${left}% + ${ml}px);width:calc(${width}% - ${ml+mr}px);height:${barH}px;line-height:${barH}px;overflow:hidden;display:flex;align-items:center;padding:0 6px;cursor:pointer;font-size:${barFont}px;border-radius:${r}" onclick="event.stopPropagation();${clickJs}">${isFirst?evLabel(e):''}</div>`;
      } else {
        html+=`<div class="cal-ev ev-${e.type||'미정'}" style="${etypeInlineStyle(e.type)}position:absolute;top:${top}px;left:calc(${left}% + 2px);width:calc(${width}% - 4px);height:${barH}px;line-height:${barH}px;overflow:hidden;display:flex;align-items:center;padding:0 6px;cursor:pointer;font-size:${barFont}px;border-radius:4px" onclick="event.stopPropagation();${clickJs}">${evLabel(e)}</div>`;
      }
    });
    html+=`</div></div>`;
  });
  html+=`</div>`;
  return html;
}

// ─── 미니 날짜선택 캘린더 (날짜 입력칸 클릭 시 표시) ──────────
// 제목("2026년 8월")을 누르면 연/월을 빠르게 고르는 화면으로 전환됨.
// 날짜 입력칸에서 열었을 때는 월을 고른 뒤 다시 날짜 선택 화면으로 돌아가고,
// 캘린더 페이지의 월 이동에 쓸 때는 월을 고르자마자 바로 그 달로 이동함(openMonthJump).
let _mcTarget=null,_mcMonth=null,_mcMode='day',_mcOnMonthPick=null,_mcAnchorEl=null;
function openMiniCal(inputId,anchorEl){
  _mcTarget=inputId;_mcOnMonthPick=null;_mcMode='day';
  const curVal=document.getElementById(inputId).value||today();
  const parts=curVal.split('-').map(Number);
  _mcMonth=new Date(parts[0],parts[1]-1,1);
  openMcPanel(anchorEl);
}
function openMonthJump(anchorEl,curDate,onPick){
  _mcTarget=null;_mcOnMonthPick=onPick;_mcMode='ym';
  _mcMonth=new Date(curDate.getFullYear(),curDate.getMonth(),1);
  openMcPanel(anchorEl);
}
function openMcPanel(anchorEl){
  _mcAnchorEl=anchorEl;
  let panel=document.getElementById('mini-cal');
  if(!panel){panel=document.createElement('div');panel.id='mini-cal';panel.className='mini-cal';document.body.appendChild(panel);}
  const rect=anchorEl.getBoundingClientRect();
  const top=rect.bottom+6, left=Math.min(rect.left,window.innerWidth-264);
  panel.style.top=top+'px';
  panel.style.left=Math.max(8,left)+'px';
  panel.style.display='block';
  renderMiniCal();
}
function renderMiniCal(){
  if(_mcMode==='ym'){renderMiniCalYM();return;}
  const panel=document.getElementById('mini-cal');if(!panel)return;
  const y=_mcMonth.getFullYear(),m=_mcMonth.getMonth();
  const selEl=document.getElementById(_mcTarget);
  const selVal=selEl?selEl.value:'';
  const first=new Date(y,m,1).getDay();
  const days=getDaysInMonth(y,m);
  const prevDays=getDaysInMonth(y,m-1);
  const todayStr=today();
  let cells='';
  for(let i=first;i>0;i--){
    const d=prevDays-i+1;const pm=m===0?11:m-1,py=m===0?y-1:y;
    cells+=`<div class="mini-cal-day om" onclick="mcPick('${py}-${p2(pm+1)}-${p2(d)}')">${d}</div>`;
  }
  for(let d=1;d<=days;d++){
    const ds=`${y}-${p2(m+1)}-${p2(d)}`;
    const cls=['mini-cal-day'];
    if(ds===selVal)cls.push('sel');
    if(ds===todayStr)cls.push('td');
    cells+=`<div class="${cls.join(' ')}" onclick="mcPick('${ds}')">${d}</div>`;
  }
  const rem=(7-((first+days)%7))%7;
  for(let i=1;i<=rem;i++){
    const nm=m===11?0:m+1,ny=m===11?y+1:y;
    cells+=`<div class="mini-cal-day om" onclick="mcPick('${ny}-${p2(nm+1)}-${p2(i)}')">${i}</div>`;
  }
  const dnCls=(i)=>i===0?' sun':i===6?' sat':'';
  panel.innerHTML=`
    <div class="mini-cal-hd">
      <button class="mini-cal-nav" onclick="event.stopPropagation();mcNav(-1)">‹</button>
      <span class="mini-cal-title" onclick="event.stopPropagation();mcToggleYM()">${y}년 ${m+1}월</span>
      <button class="mini-cal-nav" onclick="event.stopPropagation();mcNav(1)">›</button>
    </div>
    <div class="mini-cal-grid">
      ${['일','월','화','수','목','금','토'].map((d,i)=>`<div class="mini-cal-dn${dnCls(i)}">${d}</div>`).join('')}
      ${cells}
    </div>`;
}
function mcToggleYM(){_mcMode='ym';renderMiniCal();}
function renderMiniCalYM(){
  const panel=document.getElementById('mini-cal');if(!panel)return;
  const y=_mcMonth.getFullYear(),curM=_mcMonth.getMonth();
  const now=new Date();
  const cells=Array.from({length:12},(_,i)=>{
    const cls=['mini-ym-cell'];
    if(i===curM)cls.push('sel');
    if(y===now.getFullYear()&&i===now.getMonth())cls.push('td');
    return `<div class="${cls.join(' ')}" onclick="event.stopPropagation();mcPickMonth(${y},${i})">${i+1}월</div>`;
  }).join('');
  panel.innerHTML=`
    <div class="mini-cal-hd">
      <button class="mini-cal-nav" onclick="event.stopPropagation();mcYearNav(-1)">‹</button>
      <span class="mini-cal-title" style="cursor:default">${y}년</span>
      <button class="mini-cal-nav" onclick="event.stopPropagation();mcYearNav(1)">›</button>
    </div>
    <div class="mini-ym-grid">${cells}</div>`;
}
function mcYearNav(d){_mcMonth=new Date(_mcMonth.getFullYear()+d,_mcMonth.getMonth(),1);renderMiniCalYM();}
function mcPickMonth(y,m){
  _mcMonth=new Date(y,m,1);
  if(_mcOnMonthPick){const cb=_mcOnMonthPick;closeMiniCal();cb(y,m);return;}
  _mcMode='day';renderMiniCal();
}
function mcNav(d){_mcMonth=new Date(_mcMonth.getFullYear(),_mcMonth.getMonth()+d,1);renderMiniCal();}
function mcPick(ds){
  const el=document.getElementById(_mcTarget);
  if(el){
    el.value=ds;
    el.dispatchEvent(new Event('input',{bubbles:true}));
  }
  closeMiniCal();
}
function closeMiniCal(){
  const p=document.getElementById('mini-cal');if(p)p.style.display='none';
  _mcTarget=null;_mcMode='day';_mcOnMonthPick=null;_mcAnchorEl=null;
}
document.addEventListener('click',e=>{
  const p=document.getElementById('mini-cal');
  if(p&&p.style.display==='block'){
    if(!e.target.closest('#mini-cal')&&e.target!==_mcAnchorEl)closeMiniCal();
  }
});

function saveEvent(id){
  const title=document.getElementById('ev-title').value.trim();
  const start=document.getElementById('ev-start').value;
  const end=document.getElementById('ev-end').value;
  const type=document.getElementById('ev-type').value;
  const content=document.getElementById('ev-content').value.trim();
  const time=document.getElementById('ev-time').checked;
  const startTime=time?document.getElementById('ev-stime').value:'';
  if(!title||!start||!end){alert('제목과 날짜를 입력해주세요');return}
  if(id){const e=S.events.find(x=>x.id===id);Object.assign(e,{title,start,end,type,content,time,startTime});delete e.endTime;}
  else S.events.push({id:newId(),title,start,end,type,content,time,startTime});
  closeModal();
  if(S.page==='home')renderHome();
  else if(S.page==='schedule')renderSchedulePage();

// 원래 정해진 CSS 색을 그대로 쓰고, 새로 추가/이름변경된 종류만 여기서 무작위로 배정함.
const ETYPE_PALETTE=[
  {bg:'#FDE8E8',tc:'#B5495B'},{bg:'#FFF4D6',tc:'#9A7B0A'},{bg:'#E3F6E5',tc:'#2F7A4D'},
  {bg:'#E0F3FA',tc:'#2470A0'},{bg:'#EDE7F9',tc:'#6B4FA0'},{bg:'#FCE7F3',tc:'#A5347A'},
  {bg:'#E8F0FE',tc:'#3B5BA5'},{bg:'#FBEEE6',tc:'#A15C2E'}
];
function assignRandomEtypeColor(name){
  if(!S.etypeColors)S.etypeColors={};
  S.etypeColors[name]=ETYPE_PALETTE[Math.floor(Math.random()*ETYPE_PALETTE.length)];
}
// 지정된 색이 있으면 그 색으로, 없으면 기존 CSS 클래스(ev-행사 등) 색을 그대로 쓰도록 빈 문자열 반환
function etypeInlineStyle(type){
  const c=S.etypeColors&&S.etypeColors[type];
  return c?`background:${c.bg};color:${c.tc};`:'';
}
function editSelectedEtype(){
  const sel=document.getElementById('ev-type');if(!sel)return;
  const cur=sel.value;
  if(!cur){alert('수정할 종류를 먼저 선택해주세요.');return;}
  const idx=S.etypes.indexOf(cur);
  if(idx===-1)return;
  const v=prompt('종류 이름 수정:',cur);
  if(v===null||!v.trim())return;
  const name=v.trim();
  S.etypes[idx]=name;
  if(S.etypeColors&&S.etypeColors[cur]){S.etypeColors[name]=S.etypeColors[cur];delete S.etypeColors[cur];}
  refreshEtypeSelect(name);
}
function deleteSelectedEtype(){
  const sel=document.getElementById('ev-type');if(!sel)return;
  const cur=sel.value;
  if(!cur){alert('삭제할 종류를 먼저 선택해주세요.');return;}
  const idx=S.etypes.indexOf(cur);
  if(idx===-1)return;
  if(idx<4){alert('기본 종류(행사/미팅/외근/휴가)는 삭제할 수 없습니다. 이름 수정만 가능해요.');return;}
  if(!confirm(`'${cur}' 종류를 삭제하시겠습니까?`))return;
  S.etypes.splice(idx,1);
  if(S.etypeColors)delete S.etypeColors[cur];
  refreshEtypeSelect('');

function addEtypeInline(){
  const v=prompt('새 종류 이름:');
  if(v===null||!v.trim())return;
  const name=v.trim();
  if(!S.etypes.includes(name)){
    S.etypes.push(name);
    assignRandomEtypeColor(name);
  }
  refreshEtypeSelect(name);
}

function calcAutoLeave(startDateStr){
  if(!startDateStr)return{annual:0,monthly:0};
  const start=new Date(startDateStr),now=new Date();
  const ms=now-start;
  if(ms<0)return{annual:0,monthly:0};
  const months=(now.getFullYear()-start.getFullYear())*12+(now.getMonth()-start.getMonth());
  const years=ms/(1000*60*60*24*365.25);
  if(years>=1)return{annual:15,monthly:0};
  return{annual:0,monthly:Math.max(0,months)};
}
function syncEmpAutoLeave(){
  const now=new Date();
  S.employees.forEach(e=>{
    if(!e.startDate||e._yearGranted)return;
    if(e.autoLeave===false)return; // 휴가 자동 부여가 꺼진 직원은 자동 지급 대상에서 제외
    const years=(now-new Date(e.startDate))/(1000*60*60*24*365.25);
    if(years>=1){
      e.annualLeave=Math.max(e.annualLeave||0,15);
      e.monthLeave=0;
      e._yearGranted=true;
      e.leaveHistory=e.leaveHistory||[];
      e.leaveHistory.push({id:newId(),type:'연차',date:today(),days:15,reason:'입사 1년 경과 자동 부여',granted:true});
    }
  });
}

  const dm=parseFloat(document.getElementById('la-month').value)||0;

function deleteLeave(empId,leaveId){
  if(!confirm('휴가 내역을 삭제하시겠습니까? 부여/조정됐던 일수도 잔여 일수에서 함께 차감됩니다.'))return;

  if(l){
    if(l.type==='연차')e.annualLeave=Math.max(0,e.annualLeave-l.days);
    else if(l.type==='월차')e.monthLeave=Math.max(0,e.monthLeave-l.days);
    else if(l.type==='특별휴가')e.specialLeave=Math.max(0,(e.specialLeave||0)-l.days);
  }
  e.leaveHistory=e.leaveHistory.filter(x=>x.id!==leaveId);
  renderEmployees();saveAppData().catch(()=>{});
}

function updateLeavePreview(){
  const el=document.getElementById('leave-preview-text');if(!el)return;
  const autoOn=document.getElementById('ae-auto')?.checked;
  if(!autoOn){el.innerHTML='휴가 자동 부여가 꺼져 있습니다. 연차·월차는 0일로 시작하며, 필요할 때 수동으로 부여해주세요.';return}
  const start=document.getElementById('ae-start').value;
  if(!start){el.textContent='입사일을 선택해주세요';return}
  const{annual,monthly}=calcAutoLeave(start);
  const now=new Date(),s=new Date(start);
  const years=(now-s)/(1000*60*60*24*365.25);
  const mos=Math.max(0,Math.floor((now-s)/(1000*60*60*24*30.4)));
  el.innerHTML=years>=1
    ?`연차 <b>15일</b> 즉시 부여 (입사 1년 이상, 월차 미부여)`
    :`월차 <b>${monthly}일</b> (입사 ${mos}개월 경과, 매월 1일씩 자동 부여)`;
}

function toggleElgDateRange(){
  const days=parseFloat(document.getElementById('elg-days')?.value)||1;
  const wrap=document.getElementById('elg-enddate-wrap');
  if(!wrap)return;
  wrap.style.display=days>=2?'block':'none';
  if(days>=2)syncElgEndDate();
}
function syncElgEndDate(){
  const days=parseFloat(document.getElementById('elg-days')?.value)||1;
  const startVal=document.getElementById('elg-date')?.value;
  const endInput=document.getElementById('elg-enddate');
  if(!startVal||!endInput||days<2)return;
  const d=new Date(startVal);
  d.setDate(d.getDate()+Math.max(0,Math.ceil(days)-1));
  endInput.value=fmt(d);
}
function saveEmpLeaveGrant(empId){
  const e=S.employees.find(x=>x.id===empId);if(!e)return;

  const date=document.getElementById('elg-date').value||today();
  const endWrap=document.getElementById('elg-enddate-wrap');
  const endDate=(endWrap&&endWrap.style.display!=='none')?(document.getElementById('elg-enddate').value||null):null;
  const reason=document.getElementById('elg-reason').value;
  // '휴가 사용'은 부여가 아니라 차감이므로, 기록에는 음수 일수로 남기고 잔여 일수에서 뺌
  e.leaveHistory.push({id:newId(),type,date,endDate,days:-days,reason,used:true});

function internGridWeek(d){

function buildInternGrid(mode){
  const DAYS=['월','화','수','목','금'];
  const TIMES=['10','11','12','13','14','15','16','17','18'];
  const COLORS=['#F0EFFC','#EEF6F1','#FEF5E9','#FEF0EF','#EBF3FF','#F4F1FF'];
  const TXCOLORS=['#5B5BD6','#2A6041','#92511A','#C0392B','#2A5DA8','#6E4FB0'];
  const theadHtml=`<tr style="height:36px">
    <th style="background:var(--hover);font-size:11px;font-weight:500;border:1px solid var(--bd);padding:0;text-align:center;color:var(--sub)"></th>
    ${DAYS.map(d=>`<th style="background:var(--hover);font-size:11px;font-weight:600;border:1px solid var(--bd);padding:0;text-align:center">${d}</th>`).join('')}
  </tr>`;
  if(mode==='work'){
    const activeInterns=S.interns.filter(isInternActive);
    const wOff=S.weekOffset; // 근무스케줄 메뉴와 동일한 주차를 사용해 동기화
    const dd=buildWSDayData(activeInterns,wOff);
    const {label}=getWeekInfo(wOff);
    const compact=(window.innerWidth||1024)<=600;
    const RH=22;
    let tbody='';
    for(let s=20;s<38;s++){
      const isFirst=s%2===0;
      const h=Math.floor(s/2);
      let row=`<tr style="height:${RH}px">`;
      if(isFirst){
        row+=`<td style="width:90px;min-width:90px;font-size:${compact?'9.5px':'11px'};color:var(--sub);background:var(--hover);text-align:center;border:1px solid var(--bd);white-space:nowrap;vertical-align:middle;padding:0;height:${RH*2}px" rowspan="2">${wsTimeLabel(h,compact)}</td>`;
      }
      DAYS.forEach((d,di)=>{
        const {slotMap}=dd[d];
        const cur=slotMap[s]||{};
        const prev=slotMap[s-1]||{};
        const next=slotMap[s+1]||{};
        const bdrL=di>0?'border-left:1px solid var(--bd);':'';
        if(!Object.keys(cur).length){
          row+=`<td style="${bdrL}border:1px solid var(--bd);height:${RH}px;padding:0;background:#fff"></td>`;
          return;
        }
        const numCols=Math.max(...Object.values(cur).map(v=>v.numCols));
        const blocks=[];
        for(let col=0;col<numCols;col++){
          const info=cur[col]||null;
          const prevInfo=prev[col]||null;
          const nextInfo=next[col]||null;
          const sepL=col>0?'border-left:1px solid var(--bd);':'';
          if(!info){blocks.push(`<div style="flex:1;height:100%;${sepL}background:#fff"></div>`);continue;}
          const fromAbove=!!(prevInfo&&prevInfo.intern&&prevInfo.intern.id===info.intern.id);
          const toBelow=!!(nextInfo&&nextInfo.intern&&nextInfo.intern.id===info.intern.id&&s<37);
          const bt=fromAbove?'':'border-top:2px solid '+info.c.tc+';';
          const bb=toBelow?'':'border-bottom:2px solid '+info.c.tc+';';
          const name=info.showName?`<span style="color:${info.c.tc};font-size:${compact?'9.5px':'11px'};font-weight:600;white-space:nowrap">${info.intern.name}</span>`:'';
          blocks.push(`<div onclick="openInternWeekSched(${info.intern.id},${wOff})" style="flex:1;display:flex;align-items:center;justify-content:center;background:${info.c.bg};height:100%;cursor:pointer;min-width:0;overflow:hidden;${bt}${bb}${sepL}">${name}</div>`);
        }
        row+=`<td style="${bdrL}border:1px solid var(--bd);height:${RH}px;padding:0;overflow:hidden;vertical-align:top"><div style="display:flex;height:100%;width:100%">${blocks.join('')}</div></td>`;
      });
      row+=`</tr>`;tbody+=row;
    }
    return `<div style="max-width:75%;min-width:400px;margin:0 auto">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <button class="cal-nav" onclick="internGridWeek(-1)">‹</button>
      <span style="flex:1;text-align:center;font-size:12.5px;font-weight:600;color:var(--sub)">${label}</span>
      <button class="cal-nav" onclick="internGridWeek(1)">›</button>
    </div>

function tgEdit(cell,d,h,id){

  function onBlur(){

function saveTTGrid(id){
  const i=S.interns.find(x=>x.id===id);if(!i)return;
  const gs=window._ttGridState||{};
  const DAYS=['월','화','수','목','금'];
  const byDay={};
  DAYS.forEach(d=>{byDay[d]=[]});
  Object.entries(gs).forEach(([k,v])=>{if(v){const[d,h]=k.split('-');byDay[d].push(parseInt(h))}});
  const slots=[];
  DAYS.forEach(d=>{
    const hrs=byDay[d].sort((a,b)=>a-b);
    let st=null,prev=null;
    const flush=()=>{
      // 이 시간 구간(연속된 칸들) 안에서 수업명이 입력된 칸이 있으면 그 이름을 구간의 label로 사용.
      // (하단 표에는 영향 없음 — 그 표는 label을 쓰지 않고 인턴 이름만 그대로 표시함)
      let label='';
      for(let h=st;h<=prev;h++){const v=gs[`${d}-${h}`];if(typeof v==='string'&&v){label=v;break;}}
      const slot={day:d,start:`${p2(st)}:00`,end:`${p2(prev+1)}:00`};
      if(label)slot.label=label;
      slots.push(slot);
    };
    hrs.forEach(h=>{
      if(st===null){st=h;prev=h}
      else if(h===prev+1){prev=h}
      else{flush();st=h;prev=h}
    });
    if(st!==null)flush();
  });
  S.internTimetable[i.name]=slots;
  // Stay in modal — refresh grid and change button to 닫기
  const grid=document.getElementById('tt-grid');
  if(grid)grid.innerHTML=buildTTGridHtml(id);
  const btn=document.getElementById('tt-save-btn');
  if(btn){btn.textContent='닫기';btn.onclick=closeModal;}
  // Refresh bottom class panel
  const panel1=document.getElementById('intern-panel1');
  if(panel1)panel1.innerHTML=buildInternGrid('class');
}

// ─── INTERN WEEKLY SCHEDULE MODAL ─────────────────
function getSchedForWeek(name,weekOff){
  const hist=S.internSchedHistory[name];
  if(hist&&hist.length){
    const targetKey=fmt(getWeekInfo(weekOff).mon); // 비교 대상 주의 월요일 날짜(절대 기준)
    let best=null;
    hist.forEach(e=>{
      const key=e.weekKey||legacyFromWeekToKey(e.fromWeek); // 구버전 데이터(상대 오프셋) 호환
      if(key<=targetKey&&(!best||key>best.key))best={...e,key};
    });
    if(best)return best.slots;
  }
  return S.internSchedules[name]||[];
}
// 구버전 데이터 호환: 과거에 fromWeek(상대 오프셋)로 저장된 항목을
// "오늘 기준"으로 절대 날짜 키로 환산한다. 정확하진 않을 수 있으나 완전히 사라지는 것은 방지함.
function legacyFromWeekToKey(fromWeek){
  if(fromWeek===undefined||fromWeek===null)return '0000-00-00';
  return fmt(getWeekInfo(fromWeek).mon);
}
function isInternActive(intern){
  if(!intern.endDate)return true;
  const td=new Date();td.setHours(0,0,0,0);
  const ed=new Date(intern.endDate);ed.setHours(0,0,0,0);
  return td<=ed;
}

// half-hour slot helpers: slot index s = hour*2 + (0|1), where 1 = :30
function timeToSlot(t){const[h,m]=t.split(':').map(Number);return h*2+(m>=30?1:0);}
function slotToTime(s){const h=Math.floor(s/2);const m=(s%2)*30;return `${p2(h)}:${m===0?'00':'30'}`;}
function slotLabel(s){const e=s+1;const eh=Math.floor(e/2);const em=(e%2)*30;return `${slotToTime(s)}~${p2(eh)}:${em===0?'00':'30'}`;}

function openInternWeekSched(internId,weekOff){
  if(weekOff===undefined){weekOff=0;window._wsEditing=false;}
  const intern=S.interns.find(x=>x.id===internId);if(!intern)return;
  const{mon,label}=getWeekInfo(weekOff);
  const sched=getSchedForWeek(intern.name,weekOff);
  const gs={};
  sched.forEach(s=>{
    const si=timeToSlot(s.start),ei=timeToSlot(s.end);
    for(let i=si;i<ei;i++)gs[`${s.day}-${i}`]=true;
  });
  window._wsGs=gs;window._wsIid=internId;window._wsWoff=weekOff;
  showModal(buildSchedModalHtml(intern,mon,label,gs,internId,weekOff),'lg');
}

function wsApplyCell(d,s,mode){

function wsStartDrag(d,s,ev){

function saveInternSchedGrid(internId,weekOff){
  const intern=S.interns.find(x=>x.id===internId);if(!intern)return;
  const gs=window._wsGs||{};
  const DAYS=['월','화','수','목','금'];
  const byDay={};DAYS.forEach(d=>{byDay[d]=[]});
  Object.entries(gs).forEach(([k,v])=>{if(v){const pts=k.split('-');byDay[pts[0]].push(parseInt(pts[1]))}});
  const slots=[];
  DAYS.forEach(d=>{
    const idxs=byDay[d].sort((a,b)=>a-b);
    let st=null,prev=null;
    idxs.forEach(i=>{
      if(st===null){st=i;prev=i}else if(i===prev+1){prev=i}
      else{slots.push({day:d,start:slotToTime(st),end:slotToTime(prev+1)});st=i;prev=i}
    });
    if(st!==null)slots.push({day:d,start:slotToTime(st),end:slotToTime(prev+1)});
  });
  const weekKey=fmt(getWeekInfo(weekOff).mon); // 해당 주 월요일 날짜를 절대 기준으로 저장
  if(!S.internSchedHistory[intern.name])S.internSchedHistory[intern.name]=[];
  S.internSchedHistory[intern.name]=S.internSchedHistory[intern.name].filter(e=>(e.weekKey||legacyFromWeekToKey(e.fromWeek))!==weekKey);
  S.internSchedHistory[intern.name].push({weekKey,slots});
  S.internSchedHistory[intern.name].sort((a,b)=>(a.weekKey||legacyFromWeekToKey(a.fromWeek)).localeCompare(b.weekKey||legacyFromWeekToKey(b.fromWeek)));
  const panel1=document.getElementById('intern-panel1');
  const panel2=document.getElementById('intern-panel2');
  if(panel1)panel1.innerHTML=buildInternGrid('class');
  if(panel2)panel2.innerHTML=buildInternGrid('work');
  renderWSTable();
  if(S.page==='home')renderTodayInterns();
  window._wsEditing=false;
  openInternWeekSched(internId,weekOff);
}

// 시간 슬롯 라벨: 좁은 화면에서는 "10~11"처럼 짧게, 넓은 화면에서는 "10:00~11:00"
function wsTimeLabel(h,compact){
  return compact?`${h}~${h+1}`:`${p2(h)}:00~${p2(h+1)}:00`;
}
function getWeekInfo(offset){
  const now=new Date();
  const dow=now.getDay();
  const mon=new Date(now);mon.setDate(now.getDate()-(dow===0?6:dow-1)+offset*7);
  const fri=new Date(mon);fri.setDate(mon.getDate()+4);
  const y=mon.getFullYear(),m=mon.getMonth();
  const first=new Date(y,m,1);
  const fd=first.getDay();
  const fmon=new Date(first);fmon.setDate(first.getDate()+(fd===0?1:fd===1?0:8-fd));
  if(fmon.getMonth()!==m)fmon.setDate(fmon.getDate()-7);
  const diff=Math.round((mon-fmon)/(864e5));
  const wn=Math.floor(diff/7)+1;
  const label=`${y}년 ${m+1}월 ${wn}주차(${m+1}/${mon.getDate()}~${fri.getMonth()+1}/${fri.getDate()})`;
  return{mon,fri,label,wn};
}

function wsWeek(d){S.weekOffset+=d;renderWorkSchedule()}
let _wsSemFilter=null;
function wsSetSem(sem){_wsSemFilter=sem;renderWorkSchedule();}
const WS_COLORS=[
  {bg:'#F0EFFC',tc:'#5B5BD6'},{bg:'#EEF6F1',tc:'#2A6041'},
  {bg:'#FEF5E9',tc:'#92511A'},{bg:'#FEF0EF',tc:'#C0392B'},
  {bg:'#EBF3FF',tc:'#2A5DA8'},{bg:'#F4F1FF',tc:'#6E4FB0'}
];
function internColorIdx(intern){
  // Use position in full S.interns list so color stays fixed regardless of active/inactive state
  return S.interns.findIndex(x=>x.id===intern.id);
}
function buildWSDayData(interns,weekOffset){
  const DAYS=['월','화','수','목','금'];
  const result={};
  DAYS.forEach(day=>{
    const runs=[];
    interns.forEach(intern=>{
      const sched=getSchedForWeek(intern.name,weekOffset);
      const c=WS_COLORS[internColorIdx(intern)%WS_COLORS.length];
      const covered=new Set();
      for(let s=20;s<38;s++){
        if(sched.some(sch=>sch.day===day&&timeToSlot(sch.start)<=s&&timeToSlot(sch.end)>s))covered.add(s);
      }
      let rs=-1;
      for(let s=20;s<=38;s++){
        if(covered.has(s)&&rs===-1)rs=s;
        if(!covered.has(s)&&rs!==-1){runs.push({intern,c,start:rs,end:s});rs=-1;}
      }
    });
    // interval graph coloring → column assignment
    const colEnds=[];
    runs.forEach(run=>{
      let col=colEnds.findIndex(e=>e<=run.start);
      if(col===-1)col=colEnds.length;
      colEnds[col]=run.end;
      run.col=col;
    });
    // per-run numCols: peak concurrent count within this run's duration
    runs.forEach(run=>{
      let peak=1;
      for(let s=run.start;s<run.end;s++){
        const cnt=runs.filter(r=>r.start<=s&&r.end>s).length;
        peak=Math.max(peak,cnt);
      }
      run.numCols=peak;
    });
    // slotMap[s][col] = {intern,c,showName,numCols}
    const slotMap={};
    runs.forEach(run=>{
      const mid=run.start+Math.floor((run.end-run.start)/2);
      for(let s=run.start;s<run.end;s++){
        if(!slotMap[s])slotMap[s]={};
        slotMap[s][run.col]={intern:run.intern,c:run.c,showName:s===mid,numCols:run.numCols};
      }
    });
    result[day]={slotMap};
  });
  return result;
}
function renderWSTable(){
  const el=document.getElementById('ws-table');if(!el)return;
  const {mon}=getWeekInfo(S.weekOffset);
  const DAYS=['월','화','수','목','금'];
  const RH=22; // 30분 슬롯 높이(px)
  const compact=(window.innerWidth||1024)<=600;
  const activeInterns=_wsSemFilter
    ?S.interns.filter(i=>i.semester===_wsSemFilter)
    :S.interns.filter(isInternActive);
  const dd=buildWSDayData(activeInterns,S.weekOffset);

  // 헤더
  let thead=`<tr>
    <th style="width:90px;border:1px solid var(--bd);background:var(--sb);padding:6px 2px;font-size:${compact?'10.5px':'12px'};color:var(--sub)">시간</th>`;
  DAYS.forEach((d,i)=>{
    const dt=new Date(mon);dt.setDate(mon.getDate()+i);
    const hol=getHolidayForDay(fmt(dt));
    const dateLabel=compact?`${d}<br>${dt.getMonth()+1}/${dt.getDate()}`:`${d} ${dt.getMonth()+1}/${dt.getDate()}`;
    thead+=`<th style="border:1px solid var(--bd);background:var(--sb);padding:${compact?'4px 2px':'6px 4px'};font-size:${compact?'10.5px':'12px'};color:var(--sub);line-height:1.3">${dateLabel}${hol?`<br><span style="font-size:${compact?'8.5px':'10px'};color:var(--re)">${hol}</span>`:''}</th>`;
  });
  thead+=`</tr>`;

  // rowspan 방식: 각 열별로 어떤 슬롯이 이미 채워졌는지 추적
  // filled[day][s] = true이면 이미 위 슬롯의 td가 rowspan으로 커버함
  const filled={};
  DAYS.forEach(d=>{filled[d]={};});

  let tbody='';
  for(let s=20;s<38;s++){
    const isFirst=s%2===0;
    const h=Math.floor(s/2);
    let row=`<tr style="height:${RH}px">`;

    // 시간 열: 1시간 단위로 rowspan=2
    if(isFirst){
      row+=`<td style="border:1px solid var(--bd);background:var(--sb);font-size:${compact?'9.5px':'10.5px'};color:var(--sub);text-align:center;white-space:nowrap;vertical-align:middle;padding:0 2px" rowspan="2">${wsTimeLabel(h,compact)}</td>`;
    }

    DAYS.forEach(d=>{
      const {slotMap}=dd[d];

      // 이미 위 rowspan이 커버하는 슬롯이면 td 생성 안 함
      if(filled[d][s]){return;}

      const cur=slotMap[s]||{};

      // 블록이 없으면 빈 td
      if(!Object.keys(cur).length){
        row+=`<td style="border:1px solid var(--bd);height:${RH}px;padding:0;background:#fff"></td>`;
        return;
      }

      // col별로 블록 처리 — numCols 기준으로 각 col을 width % 나눠서 하나의 td 안에 flex div로
      const numCols=Math.max(...Object.values(cur).map(v=>v.numCols));

      // 각 col의 rowspan 계산: 같은 인턴이 연속으로 이어지는 슬롯 수
      // rowspan은 col별로 다를 수 있으므로 최소 rowspan 사용 (모든 col이 공유하는 td이므로)
      // 단순화: col0 기준으로 rowspan 계산 (가장 긴 연속 블록)
      // 사실 각 col이 다른 rowspan을 가지면 td를 합칠 수 없음
      // → col별로 각각 td를 만들지 않고, 슬롯마다 flex div로 처리 (rowspan은 포기하고 블록 테두리로)
      // → 대신 각 col의 블록 시작/끝을 정확히 계산해서 border만 제어

      // 실제로 rowspan을 쓰려면 각 col이 독립적인 td여야 함
      // 현재 구조(하나의 td에 여러 col을 flex div)에서는 rowspan 적용 불가
      // → 가장 깔끔한 방법: 하나의 td에 flex div, border는 div에서만 제어
      const blocks=[];
      const prev=slotMap[s-1]||{};
      const next=slotMap[s+1]||{};

      for(let col=0;col<numCols;col++){
        const info    =cur[col] ||null;
        const prevInfo=prev[col]||null;
        const nextInfo=next[col]||null;
        const sepL=col>0?'border-left:1px solid var(--bd);':'';

        if(!info){
          blocks.push(`<div style="flex:1;height:100%;${sepL}background:#fff"></div>`);
          continue;
        }

        const fromAbove=!!(prevInfo&&prevInfo.intern&&prevInfo.intern.id===info.intern.id);
        const toBelow  =!!(nextInfo&&nextInfo.intern&&nextInfo.intern.id===info.intern.id&&s<37);

        const bt=fromAbove?'':'border-top:2px solid '+info.c.tc+';';
        const bb=toBelow  ?'':'border-bottom:2px solid '+info.c.tc+';';

        const name=info.showName
          ?`<span style="color:${info.c.tc};font-size:${compact?'9.5px':'11px'};font-weight:600;white-space:nowrap;text-align:center;line-height:1.3">${info.intern.name}</span>`
          :'';
        const fn=`openInternWeekSched(${info.intern.id},${S.weekOffset})`;

        blocks.push(`<div onclick="${fn}" style="flex:1;display:flex;align-items:center;justify-content:center;background:${info.c.bg};height:100%;cursor:pointer;min-width:0;overflow:hidden;${bt}${bb}${sepL}">${name}</div>`);
      }

      row+=`<td style="border:1px solid var(--bd);height:${RH}px;padding:0;overflow:hidden;vertical-align:top"><div style="display:flex;height:100%;width:100%">${blocks.join('')}</div></td>`;
    });

    row+=`</tr>`;
    tbody+=row;
  }

  el.innerHTML=`<table class="st-table" style="width:100%;table-layout:fixed;border-collapse:collapse">
    <colgroup><col style="width:90px">${DAYS.map(()=>`<col>`).join('')}</colgroup>
    <thead>${thead}</thead><tbody>${tbody}</tbody>
  </table>`;
  renderWSInternList();
}

function saveWorkLog(id){

function deleteWorkLog(id){
